# Canonical reviewed GitLab CI template. Copy this file into dedicated Merlin GitLab CI project.
# GitHub is authoritative; CI fetches an exact SHA without write credentials.
spec:
  inputs:
    github_sha:
      type: string
      description: "Exact reviewed GitHub commit SHA to verify (not a branch)"
      default: "a82fbfc36ad4ae34c2e20de034d3396a977fbec6"
      regex: '^[0-9a-f]{40}$'
---

# GitLab CI verifies one exact GitHub revision, without mirroring or deploying.
# Supply a reviewed commit through the validated github_sha pipeline input.
# The default remains a frozen, previously selected revision.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - verify

merlin-exact-revision:
  stage: verify
  image: ubuntu:24.04
  timeout: 60m
  variables:
    GIT_STRATEGY: none
    DEBIAN_FRONTEND: noninteractive
    MERLIN_GITHUB_SHA: "$[[ inputs.github_sha ]]"
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates git python3 cmake ninja-build g++ make bash coreutils libsqlite3-dev
  script:
    - |
      set -eu
      case "${MERLIN_GITHUB_SHA:-}" in
        *[!0123456789abcdef]*|'') echo "ERROR: set lowercase 40-character MERLIN_GITHUB_SHA"; exit 2 ;;
      esac
      test "${#MERLIN_GITHUB_SHA}" -eq 40 || { echo "ERROR: SHA must have 40 characters"; exit 2; }
      git clone --no-checkout https://github.com/Mannyspiro/expert-robot.git merlin
      cd merlin
      git fetch origin "$MERLIN_GITHUB_SHA"
      git checkout --detach "$MERLIN_GITHUB_SHA"
      test "$(git rev-parse HEAD)" = "$MERLIN_GITHUB_SHA"
      python3 scripts/merlin_hybrid_preflight.py --root . --expected-sha "$MERLIN_GITHUB_SHA" --output "$CI_PROJECT_DIR/merlin-preflight.json"
      export MERLIN_EXPECTED_SHA="$MERLIN_GITHUB_SHA"
      export MERLIN_CI_EVIDENCE_DIR="$CI_PROJECT_DIR/merlin-evidence"
      bash scripts/run_merlin_offline_ci.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - merlin-evidence/
      - merlin-preflight.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: on_success
      allow_failure: false
