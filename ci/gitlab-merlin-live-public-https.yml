# Dedicated OPTIONAL network acceptance lane; never include this job in offline CI.
# GitHub is authoritative. This captures one anonymous public HTTPS source only.
spec:
  inputs:
    github_sha:
      type: string
      description: "Reviewed exact Merlin source commit (not a moving branch)"
      default: "4903c57345760dc66ad20c621d605dd6140ebcfa"
      regex: '^[0-9a-f]{40}$'
---

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - public-research

merlin-live-public-source:
  stage: public-research
  image: ubuntu:24.04
  timeout: 20m
  variables:
    GIT_STRATEGY: none
    DEBIAN_FRONTEND: noninteractive
    MERLIN_GITHUB_SHA: "$[[ inputs.github_sha ]]"
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates git python3
  script:
    - |
      set -eu
      case "${MERLIN_GITHUB_SHA:-}" in
        *[!0123456789abcdef]*|'') echo "ERROR: exact lowercase source SHA required"; exit 2 ;;
      esac
      test "${#MERLIN_GITHUB_SHA}" -eq 40
      git clone --no-checkout https://github.com/Mannyspiro/expert-robot.git merlin
      cd merlin
      git fetch origin "$MERLIN_GITHUB_SHA"
      git checkout --detach "$MERLIN_GITHUB_SHA"
      test "$(git rev-parse HEAD)" = "$MERLIN_GITHUB_SHA"
      export MERLIN_EXPECTED_SHA="$MERLIN_GITHUB_SHA"
      python3 scripts/merlin_public_https_acceptance.py --output "$CI_PROJECT_DIR/live-evidence"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - live-evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: on_success
      allow_failure: false
