name: Molecular Quantum Baseline

on:
  pull_request:
    paths:
      - "scripts/evaluate_molecular_quantum.py"
      - "scripts/generate_molecular_matter.py"
      - "tests/molecular_quantum_smoke.py"
      - "scripts/experiment_molecular_symmetry.py"
      - "scripts/experiment_molecular_approximation.py"
      - "scripts/experiment_molecular_one_shot.py"
      - "scripts/experiment_molecular_stress.py"
      - "tests/molecular_stress_smoke.py"
      - "tests/molecular_one_shot_smoke.py"
      - "tests/molecular_approximation_rule_smoke.py"
      - "scripts/molecular_symmetry_equivalence.py"
      - "tests/molecular_symmetry_equivalence_smoke.py"
      - ".github/workflows/molecular-quantum-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  water-quantum:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYSCF_MAX_MEMORY: '384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned commercial-permissive quantum dependencies
        run: python -m pip install --disable-pip-version-check --no-input rdkit==2026.3.6 pyscf==2.14.0
      - name: Check exact symmetry witness rejection cases
        run: python tests/molecular_symmetry_equivalence_smoke.py
      - name: Check approximation rule and counterexample reporting
        run: python tests/molecular_approximation_rule_smoke.py
      - name: Check one-shot residual diagnostic rejection cases
        run: python tests/molecular_one_shot_smoke.py
      - name: Check stress failure classification and geometry evidence
        run: python tests/molecular_stress_smoke.py
      - name: Test water electronic-structure baseline
        run: python tests/molecular_quantum_smoke.py
      - name: Generate water quantum baseline artifact
        run: |
          mkdir -p quantum-artifacts
          python scripts/generate_molecular_matter.py --smiles O --id water-quantum --conformers 2 --seed 1729 --matter-graph quantum-artifacts/water.matter.json --metadata quantum-artifacts/water.metadata.json --molblock quantum-artifacts/water.mol
          python scripts/evaluate_molecular_quantum.py quantum-artifacts/water.matter.json -o quantum-artifacts/water-rhf-baseline.json
      - name: Run molecular symmetry discovery experiment
        env:
          RESEARCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/experiment_molecular_symmetry.py -o quantum-artifacts/molecular-symmetry-experiment.json
      - name: Run density-fitting diagnostic experiment
        env:
          RESEARCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/experiment_molecular_approximation.py -o quantum-artifacts/molecular-df-diagnostic.json
      - name: Run one-shot full-operator correction experiment
        env:
          RESEARCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/experiment_molecular_one_shot.py -o quantum-artifacts/molecular-one-shot.json
      - name: Challenge frozen residual rule on new distorted molecules
        env:
          RESEARCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/experiment_molecular_stress.py --calibration quantum-artifacts/molecular-one-shot.json -o quantum-artifacts/molecular-residual-stress.json
      - name: Upload non-production quantum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-quantum-${{ github.run_id }}
          path: quantum-artifacts/
          retention-days: 30
          if-no-files-found: error

