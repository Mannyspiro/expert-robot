name: Merlin unified platform integration evidence

on:
  pull_request:
    paths:
      - "python/merlin/app.py"
      - "ui/merlin-hud/index.html"
      - "python/merlin/virtual_repository.py"
      - "python/merlin/virtual_repository_seed.py"
      - "tests/test_merlin_virtual_repository.py"
      - "tests/test_virtual_repository_seed.py"
      - "python/merlin/learner_model.py"
      - "python/merlin/interaction_learning.py"
      - "tests/test_merlin_learner_store_resources.py"
      - "python/merlin/public_literature.py"
      - "tests/test_public_literature.py"
      - "tests/test_merlin_worker_api.py"
      - "tests/test_hermes_worker.py"
      - "tests/test_hermes_worker_service.py"
      - "tests/test_hermes_runtime.py"
      - "tests/test_hermes_stage_handlers.py"
      - "tests/test_hermes_proof_orchestrator.py"
      - "tests/test_avrea_adapter.py"
      - "tests/test_hermes_outbox.py"
      - "python/merlin/identity.py"
      - "requirements-merlin-auth.txt"
      - "python/merlin/learning_platform.py"
      - "python/merlin/capability_registry.py"
      - "python/merlin/knowledge_graph.py"
      - "python/merlin/project_registry.py"
      - "python/merlin/cace_adapter.py"
      - "python/merlin/cace_attestation.py"
      - "python/merlin/cace_runtime.py"
      - "python/merlin/event_outbox.py"
      - "python/merlin/hermes_outbox.py"
      - "python/merlin/hermes_worker.py"
      - "python/merlin/hermes_service.py"
      - "python/merlin/hermes_runtime.py"
      - "python/merlin/hermes_stage_handlers.py"
      - "python/merlin/avrea_adapter.py"
      - "python/merlin/hermes_proof_orchestrator.py"
      - "tests/test_merlin_identity.py"
      - "tests/test_merlin_learning_platform.py"
      - "tests/test_merlin_capability_registry.py"
      - "tests/test_merlin_project_registry.py"
      - "tests/test_cace_adapter.py"
      - "tests/test_cace_attestation.py"
      - "tests/test_cace_runtime.py"
      - "tests/test_ngspice_engine.py"
      - "tests/test_event_outbox.py"
      - "tests/test_merlin_worker_api.py"
      - "tests/research/test_merlin_api.py"
      - "tests/research/test_merlin_learning_http.py"
      - ".github/workflows/merlin-unified-platform-evidence.yml"

permissions:
  contents: read

concurrency:
  group: merlin-unified-platform-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  unified-platform:
    runs-on: namespace-profile-merlin
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Install pinned test runner
        shell: bash
        run: |
          set +e
          python -m pip install -r requirements-merlin-auth.txt pytest==8.3.5 2>&1 | tee artifacts/pip-install.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-unified-platform-install","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/install-result.json
          exit "$rc"

      - name: Compile unified Merlin modules
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m compileall -q python/merlin 2>&1 | tee artifacts/compile.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-unified-platform-compile","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/compile-result.json
          exit "$rc"

      - name: Validate Merlin HUD inline JavaScript
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          html = Path("ui/merlin-hud/index.html").read_text(encoding="utf-8")
          if html.count("<script>") != 1 or html.count("</script>") != 1:
              raise SystemExit("expected exactly one inline script block")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("artifacts/merlin-hud-inline.js").write_text(script, encoding="utf-8")
          PY
          extract_rc=$?
          if [ "$extract_rc" -eq 0 ]; then
            node --check artifacts/merlin-hud-inline.js 2>&1 | tee artifacts/merlin-hud-js.log
            rc=${PIPESTATUS[0]}
          else
            rc="$extract_rc"
          fi
          printf '{"suite":"merlin-hud-js-syntax","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/merlin-hud-js-result.json
          exit "$rc"

      - name: Run unified platform tests
        shell: bash
        env:
          PYTHONPATH: python:.
        run: |
          set +e
          set -o pipefail
          pytest -q tests/research/test_merlin_api.py tests/research/test_merlin_learning_http.py tests/test_merlin_identity.py tests/test_merlin_learning_platform.py tests/test_merlin_capability_registry.py tests/test_merlin_project_registry.py tests/test_cace_adapter.py tests/test_cace_attestation.py tests/test_cace_runtime.py tests/test_ngspice_engine.py tests/test_event_outbox.py tests/test_merlin_worker_api.py tests/test_hermes_worker.py tests/test_hermes_worker_service.py tests/test_hermes_runtime.py tests/test_hermes_stage_handlers.py tests/test_hermes_proof_orchestrator.py tests/test_avrea_adapter.py tests/test_hermes_outbox.py tests/test_public_literature.py tests/test_merlin_learner_store_resources.py tests/test_merlin_virtual_repository.py tests/test_virtual_repository_seed.py 2>&1 | tee artifacts/unified-platform-tests.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-unified-platform-tests","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/unified-platform-tests-result.json
          exit "$rc"

      - name: Upload logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-unified-platform-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
