name: Merlin unified platform integration evidence

on:
  pull_request:
    paths:
      - "python/merlin/app.py"
      - "tests/test_merlin_worker_api.py"
      - "python/merlin/identity.py"
      - "requirements-merlin-auth.txt"
      - "python/merlin/learning_platform.py"
      - "python/merlin/capability_registry.py"
      - "python/merlin/knowledge_graph.py"
      - "python/merlin/project_registry.py"
      - "python/merlin/cace_adapter.py"
      - "python/merlin/event_outbox.py"
      - "python/merlin/hermes_outbox.py"
      - "tests/test_merlin_identity.py"
      - "tests/test_merlin_learning_platform.py"
      - "tests/test_merlin_capability_registry.py"
      - "tests/test_merlin_project_registry.py"
      - "tests/test_cace_adapter.py"
      - "tests/test_event_outbox.py"
      - "tests/test_merlin_worker_api.py"
      - "tests/research/test_merlin_api.py"
      - "tests/research/test_merlin_learning_http.py"
      - ".github/workflows/merlin-unified-platform-evidence.yml"

permissions:
  contents: read

concurrency:
  group: merlin-unified-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unified-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-merlin-auth.txt pytest==8.3.5

      - name: Compile unified Merlin modules
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python -m compileall -q python/merlin/app.py python/merlin/identity.py python/merlin/learning_platform.py python/merlin/capability_registry.py python/merlin/knowledge_graph.py python/merlin/project_registry.py python/merlin/cace_adapter.py python/merlin/event_outbox.py python/merlin/hermes_outbox.py 2>&1 | tee artifacts/compile.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-unified-platform-compile","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/compile-result.json
          exit "$rc"

      - name: Run unified platform tests
        shell: bash
        env:
          PYTHONPATH: python:.
        run: |
          set +e
          mkdir -p artifacts
          python -m pytest -q -v tests/test_merlin_identity.py tests/test_merlin_learning_platform.py tests/test_merlin_capability_registry.py tests/test_merlin_project_registry.py tests/test_cace_adapter.py tests/test_event_outbox.py tests/test_merlin_worker_api.py tests/research/test_merlin_learning_http.py tests/research/test_merlin_api.py 2>&1 | tee artifacts/unified-platform-tests.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-unified-platform-tests","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/unified-platform-tests-result.json
          exit "$rc"

      - name: Upload logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-unified-platform-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
