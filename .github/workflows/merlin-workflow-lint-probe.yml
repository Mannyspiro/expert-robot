name: Merlin Workflow Lint Probe

on:
  push:
    branches:
      - "feat/hermes-routing-eval-avrea-discovery-20261105"
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/external-free-runner-bridge.yml"
      - ".github/workflows/merlin-workflow-lint-probe.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Lint workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          log=artifacts/workflow-lint.log
          rc=0
          {
            echo "runner=$RUNNER_NAME"
            echo "go=$(command -v go || true)"
            echo "ruby=$(command -v ruby || true)"
            echo "python=$(command -v python3 || true)"
          } > "$log"
          if command -v go >/dev/null 2>&1; then
            go version >> "$log" 2>&1
            set +e
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -oneline .github/workflows/ci.yml .github/workflows/external-free-runner-bridge.yml >> "$log" 2>&1
            rc=$?
            set -e
          elif command -v ruby >/dev/null 2>&1; then
            set +e
            ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p); puts "YAML PASS: #{p}" }' .github/workflows/ci.yml .github/workflows/external-free-runner-bridge.yml >> "$log" 2>&1
            rc=$?
            set -e
          else
            set +e
            python3 -m pip install --user pyyaml >> "$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              python3 - <<'PY' >> "$log" 2>&1
          import yaml
          for path in (".github/workflows/ci.yml", ".github/workflows/external-free-runner-bridge.yml"):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print("YAML PASS:", path)
          PY
              rc=$?
            fi
            set -e
          fi
          echo "lint_exit=$rc" >> "$log"
          cat "$log"
          exit "$rc"
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-workflow-lint-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/workflow-lint.log
          if-no-files-found: warn
          retention-days: 14
