name: CACE Browser Vision Evidence

on:
  pull_request:
    paths:
      - "scripts/cace_browser_vision.py"
      - "tests/cace_browser_vision_smoke.py"
      - "config/cace_browser_vision_policy.json"
      - "docs/cace-browser-vision.md"
      - ".github/workflows/cace-browser-vision.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-browser-vision-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshot-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and headless Chromium
        run: |
          python -m pip install --disable-pip-version-check --no-input playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Exercise screenshot, DOM, ARIA and fail-closed security
        run: python tests/cace_browser_vision_smoke.py
