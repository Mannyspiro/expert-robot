name: CACE Headless Local Integration

on:
  push:
    branches:
      - "feat/cace-headless-local-llm"
    paths:
      - ".github/workflows/cace-headless-local-integration.yml"
      - "config/cace_headless_local.json"
      - "python/cace_headless.py"
      - "tests/cace_headless_client_smoke.py"
      - "integration/cace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-headless-local-integration
  cancel-in-progress: true

jobs:
  validate-and-stage:
    runs-on: avrea-ubuntu-latest-1-vcpu
    timeout-minutes: 15

    steps:
      - name: Check out Expert Robot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Expert Robot headless client smoke
        run: python3 tests/cace_headless_client_smoke.py

      - name: CACE payload contract smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n integration/cace/scripts/run_cace_headless_local.sh

          tmp="$RUNNER_TEMP/cace-payload-contract"
          rm -rf "$tmp"
          mkdir -p "$tmp/config" "$tmp/scripts" "$tmp/tests"
          cp integration/cace/config/headless_local_llm.json "$tmp/config/"
          cp integration/cace/scripts/run_cace_headless_local.sh "$tmp/scripts/"
          cp integration/cace/tests/test_headless_local_llm_contract.py "$tmp/tests/"
          python3 "$tmp/tests/test_headless_local_llm_contract.py"

      - name: Prepare CACE deploy key
        id: key
        shell: bash
        env:
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_SSH_PRIVATE_KEY:-}"
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > "$RUNNER_TEMP/cace_repo_key.pub"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Apply and validate CACE headless branch
        id: cace
        shell: bash
        env:
          KEY_FILE: ${{ steps.key.outputs.key_file }}
          CACE_BRANCH: expert-robot/headless-local-llm
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-headless-repo"
          rm -rf "$work"

          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            git clone git@github.com:morganaspim/Cace-app.git "$work"

          cd "$work"
          default_ref="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
          git checkout -B "$CACE_BRANCH" "$default_ref"

          mkdir -p config scripts docs tests
          cp "$GITHUB_WORKSPACE/integration/cace/config/headless_local_llm.json" config/headless_local_llm.json
          cp "$GITHUB_WORKSPACE/integration/cace/scripts/run_cace_headless_local.sh" scripts/run_cace_headless_local.sh
          cp "$GITHUB_WORKSPACE/integration/cace/docs/HEADLESS_LOCAL_LLM.md" docs/HEADLESS_LOCAL_LLM.md
          cp "$GITHUB_WORKSPACE/integration/cace/tests/test_headless_local_llm_contract.py" tests/test_headless_local_llm_contract.py
          chmod +x scripts/run_cace_headless_local.sh

          bash -n scripts/run_cace_headless_local.sh
          python3 tests/test_headless_local_llm_contract.py

          # Re-run CACE's pre-existing local-AI security tests. No dependencies
          # are installed here: this lane must use the runner as-is and never
          # hide missing prerequisites behind downloads or a package cache.
          python3 -m pytest -q \
            tests/test_local_ai.py \
            tests/test_local_ai_security_v334.py

          git config user.name "expert-robot-cace-headless"
          git config user.email "noreply@github.com"
          git add config/headless_local_llm.json \
                  scripts/run_cace_headless_local.sh \
                  docs/HEADLESS_LOCAL_LLM.md \
                  tests/test_headless_local_llm_contract.py

          if git diff --cached --quiet; then
            echo "CACE headless branch already matches staged payload."
          else
            git commit -m "Add loopback-only headless local LLM runtime"
          fi

          cace_commit="$(git rev-parse HEAD)"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            git push --force-with-lease origin "HEAD:$CACE_BRANCH"

          echo "cace_commit=$cace_commit" >> "$GITHUB_OUTPUT"
          echo "CACE staged branch: $CACE_BRANCH @ $cace_commit"

      - name: Remove deploy key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cace_repo_key" "$RUNNER_TEMP/cace_repo_key.pub"
