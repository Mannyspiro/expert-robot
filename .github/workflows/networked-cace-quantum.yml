name: Networked CACE Quantum Cluster

on:
  pull_request:
    paths:
      - "scripts/cace_quantum_cluster.py"
      - "scripts/evaluate_molecular_quantum.py"
      - "tests/cace_quantum_cluster_smoke.py"
      - ".github/workflows/networked-cace-quantum.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-quantum-cluster-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  two-cace-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYSCF_MAX_MEMORY: '384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify quantum network protocol without external dependencies
        run: python3 tests/cace_quantum_cluster_smoke.py
      - name: Install pinned commercial-permissive scientific dependencies
        run: python -m pip install --disable-pip-version-check --no-input rdkit==2026.3.6 pyscf==2.14.0 numpy
      - name: Prepare CACE deploy key
        shell: bash
        env:
          CACE_REPO_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CACE_REPO_KEY" || { echo '::error::CACE repo key unavailable'; exit 1; }
          umask 077
          printf '%s\n' "$CACE_REPO_KEY" > "$RUNNER_TEMP/cace_repo_key"
          chmod 600 "$RUNNER_TEMP/cace_repo_key"
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/cace_repo_key" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Prepare two independent pinned CACE checkouts
        shell: bash
        run: |
          set -euo pipefail
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' git clone git@github.com:morganaspim/Cace-app.git "$RUNNER_TEMP/cace-a"
          git -C "$RUNNER_TEMP/cace-a" checkout 0e7aa229d3bb57174e281b883ee8af5445f15f75
          cp -a "$RUNNER_TEMP/cace-a" "$RUNNER_TEMP/cace-b"
          test "$(git -C "$RUNNER_TEMP/cace-a" rev-parse HEAD)" = "$(git -C "$RUNNER_TEMP/cace-b" rev-parse HEAD)"
          python -m pip install --disable-pip-version-check --no-input -e "$RUNNER_TEMP/cace-a"
      - name: Create verified water Matter Graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quantum-cluster-artifacts
          python scripts/generate_molecular_matter.py --smiles O --id networked-water --conformers 2 --seed 1729 --matter-graph quantum-cluster-artifacts/water.matter.json --metadata quantum-cluster-artifacts/water.metadata.json --molblock quantum-cluster-artifacts/water.mol
      - name: Network two CACE workers and run independent basis calculations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cace_quantum_cluster.py --coordinate --cace-roots "$RUNNER_TEMP/cace-a" "$RUNNER_TEMP/cace-b" --graph quantum-cluster-artifacts/water.matter.json --verify-serial -o quantum-cluster-artifacts/two-worker-rhf.json
      - name: Upload quantum result (no secrets or worker tokens)
        uses: actions/upload-artifact@v4
        with:
          name: networked-cace-quantum-${{ github.run_id }}
          path: quantum-cluster-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove deploy key
        if: always()
        shell: bash
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/cace_repo_key"
