name: Merlin optional OpenSandbox and Z.ai protocol gate

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'config/merlin/optional-source-candidates.json'
      - 'third_party/opensandbox'
      - 'third_party/graft'
      - 'portable/merlin_studio/zai_bridge.py'
      - 'scripts/merlin/opensandbox_eval.py'
      - 'scripts/merlin/verify_optional_sources.py'
      - 'tests/test_opensandbox_zai_integration.py'
      - 'docs/merlin/OPENSANDBOX_ZAI_GRAFT_REVIEW_20261122.md'
      - '.github/workflows/merlin-opensandbox-zai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Retrieve immutable Apache-2.0 upstream sources
        run: |
          git submodule update --init third_party/opensandbox third_party/graft
          python3 scripts/merlin/verify_optional_sources.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original adapter syntax
        run: |
          python3 -m py_compile scripts/merlin/opensandbox_eval.py
          python3 -m py_compile portable/merlin_studio/zai_bridge.py
          python3 -m py_compile scripts/merlin/verify_optional_sources.py
      - name: Exercise boundaries without Docker, cloud requests or credentials
        run: |
          python3 -m unittest discover -s tests -p test_opensandbox_zai_integration.py -v
      - name: Show immutable verification scope
        run: |
          git ls-tree HEAD third_party/opensandbox third_party/graft
          echo "OpenSandbox runtime, model API and Graft-generated tools were NOT executed here."

      - name: Package exact OpenSandbox and Graft source plus Merlin adapters
        run: |
          mkdir -p bundle/merlin-sandbox-zai-graft/third_party/opensandbox
          mkdir -p bundle/merlin-sandbox-zai-graft/third_party/graft
          mkdir -p bundle/merlin-sandbox-zai-graft/scripts/merlin
          mkdir -p bundle/merlin-sandbox-zai-graft/portable/merlin_studio
          mkdir -p bundle/merlin-sandbox-zai-graft/tests
          mkdir -p bundle/merlin-sandbox-zai-graft/config/merlin
          mkdir -p bundle/merlin-sandbox-zai-graft/docs/merlin
          git -C third_party/opensandbox archive HEAD | tar -xf - -C bundle/merlin-sandbox-zai-graft/third_party/opensandbox
          git -C third_party/graft archive HEAD | tar -xf - -C bundle/merlin-sandbox-zai-graft/third_party/graft
          cp .gitmodules bundle/merlin-sandbox-zai-graft/
          cp config/merlin/optional-source-candidates.json bundle/merlin-sandbox-zai-graft/config/merlin/
          cp docs/merlin/OPENSANDBOX_ZAI_GRAFT_REVIEW_20261122.md bundle/merlin-sandbox-zai-graft/docs/merlin/
          cp scripts/merlin/opensandbox_eval.py scripts/merlin/verify_optional_sources.py bundle/merlin-sandbox-zai-graft/scripts/merlin/
          cp portable/merlin_studio/zai_bridge.py bundle/merlin-sandbox-zai-graft/portable/merlin_studio/
          cp tests/test_opensandbox_zai_integration.py bundle/merlin-sandbox-zai-graft/tests/
          (cd bundle && zip -qr merlin-opensandbox-zai-graft-source.zip merlin-sandbox-zai-graft)
          sha256sum bundle/merlin-opensandbox-zai-graft-source.zip > bundle/SHA256SUMS.txt
          unzip -t bundle/merlin-opensandbox-zai-graft-source.zip > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: merlin-opensandbox-zai-graft-source
          path: |
            bundle/merlin-opensandbox-zai-graft-source.zip
            bundle/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
