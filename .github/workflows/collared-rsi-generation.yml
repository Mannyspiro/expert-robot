name: Collared RSI Generation

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Candidate branch (must start candidate/)"
        required: true
        type: string
      image:
        description: "Offline evaluation image pinned as image@sha256:digest"
        required: true
        type: string
      expected_gain:
        required: true
        default: "0.10"
        type: string
      variance:
        required: true
        default: "0.05"
        type: string
      cost_per_run:
        required: true
        default: "1.0"
        type: string
      diminishing_rate:
        required: true
        default: "0.20"
        type: string

permissions:
  contents: read

concurrency:
  group: expert-robot-avrea-heavy
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 45
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_REF" in candidate/*) ;; *) exit 2 ;; esac

      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Bind lineage and authority scope
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git -C trusted rev-parse HEAD)"
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          git -C candidate merge-base --is-ancestor "$base_sha" "$candidate_sha"
          python3 trusted/scripts/validate_candidate_scope.py candidate \
            --base-sha "$base_sha" --candidate-sha "$candidate_sha" \
            --policy trusted/config/auto_promotion_scope.json --output scope.json
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Estimate optimal evaluation count
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/scripts/estimate_generation_budget.py \
            --expected-gain "${{ inputs.expected_gain }}" \
            --variance "${{ inputs.variance }}" \
            --cost-per-run "${{ inputs.cost_per_run }}" \
            --diminishing-rate "${{ inputs.diminishing_rate }}" \
            --min-runs 2 --max-runs 30 > budget.json

      - name: Run independent collared evaluations
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          CANDIDATE_SHA: ${{ steps.meta.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        run: |
          set -euo pipefail
          recommended="$(python3 -c 'import json; print(json.load(open("budget.json"))["recommended_runs"])')"
          mkdir -p evidence/runs
          printf '[]\n' > evidence/run-records.json
          for i in $(seq 1 "$recommended"); do
            sealed="$RUNNER_TEMP/core-$i.enc"
            key="/dev/shm/expert-robot-generation-$GITHUB_RUN_ID-$i.key"
            workspace="$RUNNER_TEMP/eval-$i"
            mkdir -p "$workspace"
            cp -a candidate "$workspace/candidate"
            (cd trusted && scripts/prepare_collared_generation.sh . "$sealed" "$key")
            (
              cd trusted
              scripts/run_collared.sh --sealed "$sealed" --key-file "$key" \
                --image "$IMAGE" --workspace "$workspace" -- \
                sh -lc 'cmake -S /work/candidate -B /work/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build /work/build --parallel 8 && ctest --test-dir /work/build --output-on-failure'
            )
            cp "$workspace/collar-evidence/result.json" "evidence/runs/result-$i.json"
            python3 - "$i" "$CANDIDATE_SHA" "$BASE_SHA" <<'PY'
import json, os, pathlib, sys
i, candidate_sha, base_sha = sys.argv[1:]
p=pathlib.Path("evidence/run-records.json")
rows=json.loads(p.read_text())
runtime=json.loads(pathlib.Path(f"evidence/runs/result-{i}.json").read_text())
if runtime.get("tripped") or runtime.get("exit_code") != 0 or runtime.get("promotion_authority") is not False:
    raise SystemExit("collared evaluation did not satisfy fail-closed runtime contract")
rows.append({
    "run_id": f"{os.environ['GITHUB_RUN_ID']}-{i}",
    "kind": "evaluation",
    "promoted_lineage": False,
    "candidate_sha": candidate_sha,
    "base_sha": base_sha,
    "collared_execution": True,
    "collar_tripped": False,
})
p.write_text(json.dumps(rows,indent=2)+"\n")
PY
          done

      - name: Assemble trusted collar evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.meta.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
import json, os, pathlib
budget=json.load(open("budget.json"))
records=json.load(open("evidence/run-records.json"))
runtime=json.load(open(f"evidence/runs/result-{len(records)}.json"))
scope=json.load(open("scope.json"))
payload={
  "schema_version": 2,
  "candidate_id": os.environ["CANDIDATE_SHA"],
  "candidate_sha": os.environ["CANDIDATE_SHA"],
  "parent_sha": os.environ["BASE_SHA"],
  "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
  "generation_budget": {
    "estimated": True,
    "recommended_runs": budget["recommended_runs"],
    "actual_runs": len(records),
    "assumptions": budget["assumptions"],
  },
  "run_records": records,
  "lineage_verified": True,
  "core_integrity_verified": True,
  "authority_change": scope["authority_change"],
  "runtime_result": runtime,
}
pathlib.Path("evidence/collar-evidence.json").write_text(json.dumps(payload,indent=2)+"\n")
PY
          python3 trusted/scripts/validate_collar_evidence.py evidence/collar-evidence.json \
            --candidate-sha "$CANDIDATE_SHA" --base-sha "$BASE_SHA" \
            --output evidence/normalized-collar.json

      - name: Upload independent collar evidence
        uses: actions/upload-artifact@v4
        with:
          name: collar-generation-evidence-${{ github.run_id }}
          path: |
            evidence/collar-evidence.json
            evidence/normalized-collar.json
            evidence/run-records.json
            evidence/runs/
            budget.json
            scope.json
          if-no-files-found: error
          retention-days: 30
