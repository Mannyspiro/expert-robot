name: External Free Runner Bridge

on:
  push:
    branches:
      - "feat/reuse-refactored-fishstick"
      - "feat/hermes-routing-eval-avrea-discovery-20261105"
      - "repair/cace-bridge-request-isolation-20261105"
    paths:
      - ".github/workflows/external-free-runner-bridge.yml"
      - ".github/workflows/cace-return-pr.yml"
      - "config/external_runner_bridge_request.json"
      - "config/compute_policy.json"
      - "config/known_failure_classes.json"
      - "config/formal_dependency_lock.json"
      - "tests/compute_policy_smoke.py"
      - "tests/known_failure_regression_smoke.py"
      - "tests/formal_dependency_lock_smoke.py"
      - "tests/cace_return_bridge_smoke.py"
      - "scripts/preflight.sh"
      - "formal/**"
      - "python/merlin/hermes_stage_handlers.py"
      - "python/merlin/hermes_proof_orchestrator.py"
      - "python/merlin/engineering_ir.py"
      - "python/merlin/ngspice_engine.py"
      - "python/merlin/freecad_bridge.py"
      - "python/merlin/freecad_document_bridge.py"
      - "python/merlin/project_registry.py"
      - "python/merlin/knowledge_graph.py"
      - "scripts/run_engineering_ngspice_smoke.py"
      - "tests/test_hermes_stage_handlers.py"
      - "tests/test_hermes_proof_orchestrator.py"
      - "tests/test_engineering_ir.py"
      - "tests/test_ngspice_engine.py"
      - "tests/test_freecad_bridge.py"
      - "tests/test_freecad_document_bridge.py"
      - "tests/test_hud_http.py"
      - "tests/test_hud_runtime.py"
      - "tests/test_registry_queries.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-free-runner-bridge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 30

    steps:
      - name: Check out Expert Robot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Prepare deploy key
        id: key
        shell: bash
        env:
          # Preserve the already-installed cross-repository credential. Prefer the
          # dedicated name when present; fall back to the established legacy name.
          CACE_BRIDGE_SSH_PRIVATE_KEY: ${{ secrets.CACE_BRIDGE_SSH_PRIVATE_KEY }}
          LEGACY_CACE_BRIDGE_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bridge_key="${CACE_BRIDGE_SSH_PRIVATE_KEY:-}"
          bridge_key_source="CACE_BRIDGE_SSH_PRIVATE_KEY"
          if [ -z "$bridge_key" ]; then
            bridge_key="${LEGACY_CACE_BRIDGE_SSH_PRIVATE_KEY:-}"
            bridge_key_source="RAILWAY_SSH_PRIVATE_KEY (legacy alias)"
          fi
          if [ -z "$bridge_key" ]; then
            echo "::error::No existing CACE bridge key secret was found."
            echo "::error::Checked CACE_BRIDGE_SSH_PRIVATE_KEY and legacy RAILWAY_SSH_PRIVATE_KEY."
            exit 1
          fi

          umask 077
          key_file="$RUNNER_TEMP/cace_bridge_key"
          printf '%s\n' "$bridge_key" > "$key_file"
          unset bridge_key LEGACY_CACE_BRIDGE_SSH_PRIVATE_KEY CACE_BRIDGE_SSH_PRIVATE_KEY
          chmod 600 "$key_file"

          ssh-keygen -y -f "$key_file" > "$RUNNER_TEMP/cace_bridge_key.pub"
          eval "$(ssh-agent -s)"
          ssh-add "$key_file"

          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          {
            echo "key_file=$key_file"
            echo "key_source=$bridge_key_source"
          } >> "$GITHUB_OUTPUT"

      - name: Package current Expert Robot source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          request_id="expert-robot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          archive="$RUNNER_TEMP/expert-robot-source.tar.gz"

          tar \
            --exclude='./build' \
            --exclude='./build-*' \
            --exclude='./formal/.lake' \
            --exclude='./.git' \
            -czf "$archive" .

          size_bytes="$(stat -c %s "$archive")"
          max_bytes=$((25 * 1024 * 1024))
          if [ "$size_bytes" -gt "$max_bytes" ]; then
            echo "::error::Bridge archive is $size_bytes bytes; refusing to push more than $max_bytes bytes."
            exit 1
          fi

          sha256sum "$archive"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          {
            echo "request_id=$request_id"
            echo "archive=$archive"
            echo "size_bytes=$size_bytes"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish request to isolated Cace-app request branch
        id: install
        shell: bash
        env:
          RUNNER_REPO_SSH: git@github.com:morganaspim/Cace-app.git
          BRIDGE_BASE_BRANCH: repair/oci-disk-diagnostics-20261105
          REQUEST_BRANCH: cace-request/${{ steps.package.outputs.request_id }}
          REQUEST_ID: ${{ steps.package.outputs.request_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/cace-app-bridge"
          rm -rf "$work"

          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git clone "$RUNNER_REPO_SSH" "$work"

          cd "$work"
          git fetch origin "$BRIDGE_BASE_BRANCH:refs/remotes/origin/$BRIDGE_BASE_BRANCH"
          git checkout -b "$REQUEST_BRANCH" "refs/remotes/origin/$BRIDGE_BASE_BRANCH"

          # CACE's canonical workflow remains on the executor base branch.
          # Each request branch is immutable and unique to this workflow attempt.
          # The CACE workflow listens on cace-request/**. Never rewrite the shared
          # executor branch or delete another request's evidence.
          mkdir -p bridge
          cp "$ARCHIVE" bridge/expert-robot-source.tar.gz

          python3 - "$REQUEST_ID" "$GITHUB_SHA" "${{ steps.package.outputs.size_bytes }}" "$GITHUB_REF_NAME" "$ARCHIVE_SHA256" > bridge/request.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "schema_version": 3,
              "request_id": sys.argv[1],
              "expert_robot_commit": sys.argv[2],
              "archive_size_bytes": int(sys.argv[3]),
              "source_branch": sys.argv[4],
              "source_archive_sha256": sys.argv[5],
              "return_repository": "Mannyspiro/expert-robot",
              "requested_lane": "cace-oci-aarch64",
              "authority": "qualification-only",
              "monetary_cost": "free",
          }, indent=2))
          PY

          git config user.name "expert-robot-dispatcher"
          git config user.email "noreply@github.com"
          git add bridge/request.json bridge/expert-robot-source.tar.gz
          git diff --cached --check
          git commit -m "Dispatch Expert Robot request: $REQUEST_ID"
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git push origin "HEAD:refs/heads/$REQUEST_BRANCH"

          echo "request_published=true branch=$REQUEST_BRANCH"
          echo "request_branch=$REQUEST_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Await external free-runner evidence
        id: await
        shell: bash
        env:
          RUNNER_REPO_SSH: git@github.com:morganaspim/Cace-app.git
          RESULT_BRANCH: cace-result/${{ steps.package.outputs.request_id }}
          REQUEST_ID: ${{ steps.package.outputs.request_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail

          poll="$RUNNER_TEMP/cace-result-poll"
          evidence="$RUNNER_TEMP/external-free-runner-evidence"
          rm -rf "$poll" "$evidence"
          mkdir -p "$poll" "$evidence"

          git -C "$poll" init -q
          git -C "$poll" remote add origin "$RUNNER_REPO_SSH"

          found=false
          for _ in $(seq 1 120); do
            GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
              git -C "$poll" fetch -q --force origin "refs/heads/$RESULT_BRANCH:refs/remotes/origin/result" 2>/dev/null || true

            if git -C "$poll" show refs/remotes/origin/result:bridge/result.json > "$evidence/result.json" 2>/dev/null; then
              got="$(python3 -c 'import json; print(json.load(open("'"$evidence"'/result.json"))["request_id"])' 2>/dev/null || true)"
              if [ "$got" = "$REQUEST_ID" ]; then
                git -C "$poll" show refs/remotes/origin/result:bridge/result.log > "$evidence/result.log" 2>/dev/null || true
                git -C "$poll" show refs/remotes/origin/result:bridge/request.json > "$evidence/request.json"
                python3 - "$evidence/result.json" "$evidence/result.log" "$evidence/request.json" "$ARCHIVE" "$REQUEST_ID" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import re
          import sys

          result_path, log_path, request_path, archive_path, expected_request, expected_source = sys.argv[1:]
          result = json.load(open(result_path, encoding="utf-8"))
          request_bytes = open(request_path, "rb").read()
          request = json.loads(request_bytes)
          log = open(log_path, "rb").read()
          archive = open(archive_path, "rb").read()
          assert request.get("schema_version") == 3, "unsupported request schema"
          assert request.get("request_id") == expected_request
          assert request.get("expert_robot_commit") == expected_source
          assert result.get("schema_version") == 3, "unsupported result schema"
          assert result.get("request_id") == expected_request
          assert result.get("expert_robot_commit") == expected_source
          assert result.get("source_archive_sha256") == request.get("source_archive_sha256")
          assert result.get("source_archive_sha256") == hashlib.sha256(archive).hexdigest()
          assert result.get("request_sha256") == hashlib.sha256(request_bytes).hexdigest()
          assert result.get("cace_repository") == "morganaspim/Cace-app"
          assert re.fullmatch(r"[0-9a-f]{40}", result.get("cace_commit", ""))
          assert re.fullmatch(r"[0-9a-f]{40}", result.get("cace_workflow_sha", ""))
          assert result.get("cace_workflow_id") == 367390621
          assert isinstance(result.get("cace_workflow_run_id"), int) and result["cace_workflow_run_id"] > 0
          assert isinstance(result.get("cace_run_attempt"), int) and result["cace_run_attempt"] > 0
          expected_workflow_ref = (
              "morganaspim/Cace-app/.github/workflows/expert-robot-bridge.yml@refs/heads/cace-request/"
              + expected_request
          )
          assert result.get("cace_workflow_ref") == expected_workflow_ref
          assert result.get("cace_workflow_name") == "Expert Robot Free Runner Bridge"
          assert result.get("status") in ("pass", "fail")
          assert isinstance(result.get("exit_code"), int)
          assert (result["status"] == "pass") == (result["exit_code"] == 0)
          assert result.get("authority") == "qualification-only"
          assert result.get("promotion_authority") is False
          assert result.get("toolchain", {}).get("lean_image") == "leanprover/lean4:v4.34.0"
          assert result.get("toolchain", {}).get("mathlib_commit") == "5ed2965256430c3649e86755f9576b54eca72435"
          assert result.get("result_log_sha256") == hashlib.sha256(log).hexdigest()
          assert result.get("result_log_size_bytes") == len(log)
          print("validated CACE result and source archive binding: " + result["status"])
          print("cace_commit=" + result["cace_commit"])
          print("cace_workflow_run_id=" + str(result["cace_workflow_run_id"]))
          PY
                found=true
                break
              fi
            fi

            sleep 10
          done

          if [ "$found" != true ]; then
            echo "::error::Timed out waiting for the free CACE runner result."
            exit 1
          fi

          cat "$evidence/result.json"
          status="$(python3 -c 'import json; print(json.load(open("'"$evidence"'/result.json"))["status"])')"
          cace_commit="$(python3 -c 'import json; print(json.load(open("'"$evidence"'/result.json"))["cace_commit"])')"
          cace_run_id="$(python3 -c 'import json; print(json.load(open("'"$evidence"'/result.json"))["cace_workflow_run_id"])')"
          cace_run_attempt="$(python3 -c 'import json; print(json.load(open("'"$evidence"'/result.json"))["cace_run_attempt"])')"
          {
            echo "evidence_validated=true"
            echo "result_status=$status"
            echo "cace_commit=$cace_commit"
            echo "cace_run_id=$cace_run_id"
            echo "cace_run_attempt=$cace_run_attempt"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" = "pass" ]; then
            echo "qualification_passed=true" >> "$GITHUB_OUTPUT"
            echo "External qualification passed."
          else
            echo "qualification_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::External qualification returned a valid structured FAIL result; preserving it as evidence."
            if [ -f "$evidence/result.log" ]; then tail -n 200 "$evidence/result.log"; fi
          fi

      - name: Upload external runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-free-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/external-free-runner-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist CACE evidence in Expert Robot
        if: ${{ always() && steps.await.outputs.evidence_validated == 'true' }}
        shell: bash
        env:
          REQUEST_ID: ${{ steps.package.outputs.request_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/external-free-runner-evidence"
          if [ ! -s "$source_dir/result.json" ] || [ ! -s "$source_dir/result.log" ] || [ ! -s "$source_dir/request.json" ]; then
            echo "No complete validated CACE evidence to persist."
            exit 0
          fi
          python3 - "$source_dir/result.json" "$source_dir/result.log" "$source_dir/request.json" "$REQUEST_ID" "$SOURCE_SHA" <<'PY'
          import hashlib
          import json
          import re
          import sys

          result_path, log_path, request_path, expected_id, expected_source = sys.argv[1:]
          result = json.load(open(result_path, encoding="utf-8"))
          request = json.load(open(request_path, encoding="utf-8"))
          log = open(log_path, "rb").read()
          assert request.get("request_id") == expected_id
          assert request.get("expert_robot_commit") == expected_source
          assert result.get("schema_version") == 3
          assert result.get("request_id") == expected_id
          assert result.get("expert_robot_commit") == expected_source
          assert result.get("cace_repository") == "morganaspim/Cace-app"
          assert re.fullmatch(r"[0-9a-f]{40}", result.get("cace_commit", ""))
          assert re.fullmatch(r"[0-9a-f]{40}", result.get("cace_workflow_sha", ""))
          assert result.get("cace_workflow_id") == 367390621
          expected_workflow_ref = (
              "morganaspim/Cace-app/.github/workflows/expert-robot-bridge.yml@refs/heads/cace-request/"
              + expected_id
          )
          assert result.get("cace_workflow_ref") == expected_workflow_ref
          assert isinstance(result.get("cace_workflow_run_id"), int)
          assert isinstance(result.get("cace_run_attempt"), int)
          assert result.get("result_log_sha256") == hashlib.sha256(log).hexdigest()
          assert result.get("result_log_size_bytes") == len(log)
          assert result.get("status") in ("pass", "fail")
          assert result.get("authority") == "qualification-only"
          assert result.get("promotion_authority") is False
          PY
          evidence_dir=".cace/evidence/$REQUEST_ID"
          mkdir -p "$evidence_dir"
          cp "$source_dir/result.json" "$evidence_dir/result.json"
          cp "$source_dir/result.log" "$evidence_dir/result.log"
          cp "$source_dir/request.json" "$evidence_dir/request.json"
          python3 - "$evidence_dir" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          request = json.loads((root / "request.json").read_text(encoding="utf-8"))
          manifest = {
              "schema_version": 1,
              "request_id": request["request_id"],
              "expert_robot_commit": request["expert_robot_commit"],
              "cace_repository": result["cace_repository"],
              "cace_commit": result["cace_commit"],
              "cace_workflow_run_id": result["cace_workflow_run_id"],
              "cace_run_attempt": result["cace_run_attempt"],
              "qualification_status": result["status"],
              "qualification_passed": result["status"] == "pass",
              "cace_workflow_id": result["cace_workflow_id"],
              "cace_workflow_sha": result["cace_workflow_sha"],
              "cace_workflow_ref": result["cace_workflow_ref"],
              "cace_workflow_name": result["cace_workflow_name"],
              "result_sha256": hashlib.sha256((root / "result.json").read_bytes()).hexdigest(),
              "result_log_sha256": hashlib.sha256((root / "result.log").read_bytes()).hexdigest(),
              "request_sha256": hashlib.sha256((root / "request.json").read_bytes()).hexdigest(),
              "source_archive_sha256": result["source_archive_sha256"],
              "toolchain": result["toolchain"],
              "signer_identity": result.get("signer_identity"),
              "signer_fingerprint": result.get("signer_fingerprint"),
              "signature_status": result.get("signature_status", "missing"),
              "verification_level": "integrity-checked; source archive, request, commit, workflow and toolchain bound; signer key not yet configured",
              "authority": "qualification-only",
              "promotion_authority": False,
          }
          (root / "return-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          git add "$evidence_dir"
          git config user.name "expert-robot-evidence-return"
          git config user.email "noreply@github.com"
          git commit -m "Persist CACE evidence: $REQUEST_ID"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "evidence_persisted=true attempt=$attempt"
              exit 0
            fi
            echo "Evidence commit raced with a newer branch commit; retry=$attempt" >&2
            git rebase --abort || true
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not persist CACE evidence after five fast-forward-safe attempts."
              exit 1
            fi
            sleep "$attempt"
          done

      - name: Remove key material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SSH_AGENT_PID" ]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/cace_bridge_key" "$RUNNER_TEMP/cace_bridge_key.pub"
