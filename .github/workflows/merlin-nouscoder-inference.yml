name: Merlin NousCoder local inference qualification

on:
  workflow_dispatch:

concurrency:
  group: nouscoder-inference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-inference:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified NousCoder model cache
        uses: actions/cache/restore@v4
        with:
          path: models/hermes_coder
          key: nouscoder-14b-q4-k-m-v1-${{ runner.os }}
          fail-on-cache-miss: true
      - name: Confirm model checksum before inference
        run: |
          set -euo pipefail
          model='models/hermes_coder/NousResearch_NousCoder-14B-Q4_K_M.gguf'
          test -s "$model"
          echo '9cc51afc755319db42a6324baf3395436cce5954dc87df95d3b9e7d625610624  '"$model" | sha256sum --check
      - name: Build llama.cpp CPU server
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON
          cmake --build /tmp/llama.cpp/build --config Release --parallel 8 --target llama-server
          test -x /tmp/llama.cpp/build/bin/llama-server
      - name: Load model and run a real coding prompt
        run: |
          set -euo pipefail
          mkdir -p artifacts
          /tmp/llama.cpp/build/bin/llama-server \
            --model models/hermes_coder/NousResearch_NousCoder-14B-Q4_K_M.gguf \
            --host 127.0.0.1 --port 8080 --ctx-size 65536 \
            --threads 8 --threads-batch 8 --batch-size 512 --ubatch-size 128 \
            --n-gpu-layers 0 > /tmp/nouscoder-llama-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/nouscoder-llama-server.log; exit 5; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/nouscoder-llama-server.log; echo 'llama-server readiness timeout' >&2; exit 6; fi
          curl --fail --silent --show-error --max-time 180 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"NousResearch_NousCoder-14B-Q4_K_M.gguf","messages":[{"role":"system","content":"Return only one valid Python function. Do not explain."},{"role":"user","content":"Write clamp(value, low, high), inclusive. Return low if value is below low, high if above high, otherwise value."}],"temperature":0,"top_p":0.95,"max_tokens":256,"chat_template_kwargs":{"enable_thinking":false},"reasoning_format":"none"}' \
            > artifacts/nouscoder-inference.json
          python3 - <<'PY'
          import ast, json
          with open('artifacts/nouscoder-inference.json', encoding='utf-8') as f:
              data = json.load(f)
          message = data['choices'][0]['message']
          source = (message.get('content') or message.get('reasoning_content') or '').strip()
          try:
              module = ast.parse(source)
          except SyntaxError as exc:
              print(json.dumps(data, indent=2)[:4000])
              raise SystemExit(f'Model output is not valid Python: {exc}')
          if len(module.body) != 1 or not isinstance(module.body[0], ast.FunctionDef):
              raise SystemExit('Output must contain exactly one top-level function.')
          fn = module.body[0]
          if fn.name != 'clamp' or [a.arg for a in fn.args.args] != ['value', 'low', 'high'] or fn.decorator_list:
              raise SystemExit('Function signature does not match clamp(value, low, high).')
          allowed = (ast.Module, ast.FunctionDef, ast.arguments, ast.arg, ast.Return, ast.If,
                     ast.Compare, ast.Name, ast.Load, ast.Constant, ast.Lt, ast.Gt, ast.LtE,
                     ast.GtE, ast.Eq, ast.NotEq, ast.BoolOp, ast.And, ast.Or, ast.Call,
                     ast.keyword, ast.UnaryOp, ast.USub, ast.UAdd, ast.BinOp, ast.Add,
                     ast.Sub, ast.Mult, ast.Div, ast.FloorDiv, ast.Mod, ast.Pow, ast.Expr, ast.Pass)
          for node in ast.walk(module):
              if not isinstance(node, allowed):
                  raise SystemExit(f'Unsafe or unsupported syntax rejected: {type(node).__name__}')
              if isinstance(node, ast.Call) and (not isinstance(node.func, ast.Name) or node.func.id not in {'min', 'max'}):
                  raise SystemExit('Only min/max calls are allowed in this smoke test.')
          namespace = {'__builtins__': {'min': min, 'max': max}}
          exec(compile(module, '<nouscoder-smoke>', 'exec'), namespace, namespace)
          clamp = namespace['clamp']
          cases = [(-1, 0, 10, 0), (11, 0, 10, 10), (5, 0, 10, 5), (0, 0, 10, 0), (10, 0, 10, 10)]
          for value, low, high, expected in cases:
              actual = clamp(value, low, high)
              if actual != expected:
                  raise SystemExit(f'Incorrect clamp result for {(value, low, high)}: {actual} != {expected}')
          print('PASS: NousCoder generated an AST-restricted clamp function; five execution tests passed.')
          print(source[:1200])
          PY
      - name: Publish server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-nouscoder-inference-diagnostics
          path: /tmp/nouscoder-llama-server.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish inference qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-nouscoder-inference-smoke
          path: artifacts/nouscoder-inference.json
          retention-days: 7
