name: Merlin runner diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/merlin-runner-diagnostic.yml'
permissions:
  contents: read
jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record runner startup without checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          uname -a
          python3 --version
          echo "Runner startup succeeded" >> "${GITHUB_STEP_SUMMARY}"
