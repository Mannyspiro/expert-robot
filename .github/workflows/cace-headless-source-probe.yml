name: CACE Headless Source Probe

on:
  push:
    branches:
      - "feat/cace-headless-local-llm"
    paths:
      - ".github/workflows/cace-headless-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-headless-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: avrea-ubuntu-latest-1-vcpu
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare CACE deploy key
        id: key
        shell: bash
        env:
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_SSH_PRIVATE_KEY:-}"
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > "$RUNNER_TEMP/cace_repo_key.pub"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Snapshot headless and local-AI surfaces
        shell: bash
        env:
          KEY_FILE: ${{ steps.key.outputs.key_file }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-src"
          out="$RUNNER_TEMP/cace-headless-probe"
          rm -rf "$work" "$out"
          mkdir -p "$out"

          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:morganaspim/Cace-app.git "$work"

          cd "$work"
          git rev-parse HEAD > "$out/cace-commit.txt"

          git ls-files \
            | grep -Ei '(^|/)(ai|llm|model|models|runtime|server|api|capabil|agent|assistant|chat|headless|orchestrat|lean|mcp)(/|$)|(^|/).*(ai|llm|model|runtime|server|api|capabil|agent|assistant|chat|headless|orchestrat|mcp).*$' \
            | sort -u \
            > "$out/candidate-files.txt" || true

          python3 - "$work" "$out" <<'PY'
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2]) / "selected-source"
          out.mkdir(parents=True, exist_ok=True)

          candidates = []
          for raw in (pathlib.Path(sys.argv[2]) / "candidate-files.txt").read_text(encoding="utf-8").splitlines():
              p = root / raw
              if not p.is_file():
                  continue
              try:
                  size = p.stat().st_size
              except OSError:
                  continue
              if size > 250_000:
                  continue
              if p.suffix.lower() not in {
                  ".py", ".ts", ".tsx", ".js", ".jsx", ".json", ".toml", ".yaml", ".yml",
                  ".md", ".sh", ".cpp", ".cc", ".cxx", ".hpp", ".h", ".lean", ".txt"
              }:
                  continue
              candidates.append((raw, p))

          # Keep probe bounded. Prefer files with the strongest headless/AI signal.
          keywords = ("llm", "ai", "assistant", "model", "server", "api", "capabil", "agent", "headless", "orchestrat", "mcp")
          candidates.sort(key=lambda item: (-sum(k in item[0].lower() for k in keywords), item[0]))
          for raw, src in candidates[:120]:
              dst = out / raw
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          (pathlib.Path(sys.argv[2]) / "selected-count.txt").write_text(str(min(len(candidates), 120)) + "\n")
          PY

          tar -C "$out" -czf "$RUNNER_TEMP/cace-headless-source-probe.tar.gz" .

      - name: Upload bounded source probe
        uses: actions/upload-artifact@v4
        with:
          name: cace-headless-source-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/cace-headless-source-probe.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove key material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/cace_repo_key" "$RUNNER_TEMP/cace_repo_key.pub"
