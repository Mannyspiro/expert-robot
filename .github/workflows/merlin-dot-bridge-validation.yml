name: Merlin dot bridge validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-dot-bridge-validation
  cancel-in-progress: false

jobs:
  focused-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MCP interface
        run: python -m pip install -r requirements-merlin-dot.txt
      - name: Validate dot bridge contracts
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m unittest discover -s tests -p 'test_dot_context.py' -v 2>&1 | tee artifacts/dot-context.txt
          python -m unittest discover -s tests -p 'test_dual_coder.py' -v 2>&1 | tee artifacts/dot-two-coder.txt
          python -m unittest discover -s tests -p 'test_mcp_protocol.py' -v 2>&1 | tee artifacts/dot-mcp-stdio.txt
          python -m unittest discover -s tests -p 'test_http_gateway.py' -v 2>&1 | tee artifacts/dot-mcp-http.txt
          python -m unittest discover -s tests -p 'test_job_inbox.py' -v 2>&1 | tee artifacts/dot-job-inbox.txt
          python -m unittest discover -s tests -p 'test_request_gateway.py' -v 2>&1 | tee artifacts/dot-request-http.txt
      - name: Preserve focused validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-dot-bridge-validation
          path: artifacts/
          retention-days: 30
