name: Exact CACE Conservation Certificate Research

on:
  push:
    branches: ["research/cace-stoichiometry-cert-v1-20261009"]
    paths:
      - "scripts/generate_cace_conservation_certificate.py"
      - "scripts/verify_cace_conservation_certificate.py"
      - "tests/test_cace_conservation_certificate.py"
      - ".github/workflows/cace-stoichiometry-certificate.yml"
  pull_request:
    paths:
      - "scripts/generate_cace_conservation_certificate.py"
      - "scripts/verify_cace_conservation_certificate.py"
      - "tests/test_cace_conservation_certificate.py"
      - ".github/workflows/cace-stoichiometry-certificate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-certificate-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned independent symbolic oracle
        run: python3 -m pip install --disable-pip-version-check --no-input 'sympy==1.14.0'
      - name: Replay 97 exact receipts and 15 hostile mutations
        run: python3 tests/test_cace_conservation_certificate.py
      - name: Compare receipt against independent verifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sample={
              "species":["A","B","C","D"],
              "reactions":["r0","r1","r2"],
              "stoichiometry":[["-1","1","0"],["1","-1","0"],
                               ["0","0","-1"],["0","0","1"]]}
          Path("/tmp/cace-conservation-input.json").write_text(json.dumps(sample))
          PY
          python3 scripts/generate_cace_conservation_certificate.py --input /tmp/cace-conservation-input.json -o /tmp/cace-conservation-receipt.json
          python3 scripts/verify_cace_conservation_certificate.py /tmp/cace-conservation-receipt.json | tee /tmp/cace-conservation-validation.json
          python3 - <<'PY'
          import json
          record=json.load(open("/tmp/cace-conservation-validation.json"))
          assert record["valid"] is True
          assert record["conservation_laws"] == 2
          assert record["method"] == "component_graph"
          assert record["formal_kernel_verification"] is False
          assert record["cace_runtime_executed"] is False
          PY
      - name: Retain exact mathematical receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-stoichiometric-conservation-receipt
          path: |
            /tmp/cace-conservation-receipt.json
            /tmp/cace-conservation-validation.json
          retention-days: 30
          if-no-files-found: warn
