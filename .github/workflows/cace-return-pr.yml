name: CACE Return PR

on:
  push:
    branches:
      - "cace-return/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out return branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate return evidence
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_cace_return.py .cace-return.json "$GITHUB_REF_NAME" > "$RUNNER_TEMP/validated.json"

          base_branch="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated.json"))["base_branch"])')"
          request_id="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated.json"))["request_id"])')"
          source_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated.json"))["source_sha"])')"
          status="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated.json"))["status"])')"
          result_contract="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated.json"))["result_contract"])')"
          evidence_dir=".cace/evidence/$request_id"

          git fetch origin "$base_branch"

          if ! git merge-base --is-ancestor "$source_sha" "origin/$base_branch"; then
            echo "::error::Return source is not an ancestor of the declared base branch."
            exit 1
          fi

          git diff --name-only "origin/$base_branch...HEAD" > "$RUNNER_TEMP/changed.txt"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .cace-return.json)
                ;;
              "$evidence_dir"/*)
                ;;
              *)
                echo "::error::Non-evidence change on CACE return branch: $path"
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"

          test -f "$evidence_dir/request.json"
          test -f "$evidence_dir/result.json"

          if [ "$result_contract" = "cace-tool-broker-v1" ]; then
            python3 scripts/validate_cace_tool_result.py               config/cace_tool_broker.json               "$evidence_dir/request.json"               "$evidence_dir/result.json"               > "$RUNNER_TEMP/validated-tool-result.json"

            tool_status="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated-tool-result.json"))["status"])')"
            tool_request_id="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated-tool-result.json"))["request_id"])')"
            tool_source_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/validated-tool-result.json"))["source_commit"])')"
            test "$tool_status" = "$status"
            test "$tool_request_id" = "$request_id"
            test "$tool_source_sha" = "$source_sha"
          fi

          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "result_contract=$result_contract" >> "$GITHUB_OUTPUT"

      - name: Open return PR if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.validate.outputs.base_branch }}
          REQUEST_ID: ${{ steps.validate.outputs.request_id }}
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
          STATUS: ${{ steps.validate.outputs.status }}
          RESULT_CONTRACT: ${{ steps.validate.outputs.result_contract }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "CACE return PR already exists: #$existing"
            exit 0
          fi

          status_upper="$(printf '%s' "$STATUS" | tr '[:lower:]' '[:upper:]')"
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base "$BASE_BRANCH"             --head "$GITHUB_REF_NAME"             --title "CACE qualification evidence [$status_upper]: $REQUEST_ID"             --body "Automated return from the free CACE ARM64 qualification lane. Evidence status: $STATUS. Result contract: $RESULT_CONTRACT. Source commit: $SOURCE_SHA. Authority: qualification evidence only; no promotion or merge authority."
