name: Verified RSI Integration Planner

on:
  pull_request:
    paths:
      - "config/verified_rsi_integration_catalog.json"
      - "scripts/plan_verified_rsi.py"
      - "tests/verified_rsi_planner_smoke.py"
      - "scripts/collect_verified_rsi_signals.py"
      - "tests/verified_rsi_signals_smoke.py"
      - "docs/verified-rsi-integration.md"
      - ".github/workflows/verified-rsi-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent RSI planning and authority invariants
        run: |
          python3 tests/verified_rsi_planner_smoke.py
          python3 tests/verified_rsi_signals_smoke.py
      - name: Prepare zero-spend RSI experiment ranking
        run: |
          mkdir -p rsi-artifacts
          python3 scripts/plan_verified_rsi.py --remaining-avrea-credits 0 -o rsi-artifacts/verified-rsi-plan.json
      - name: Save advisory RSI plan
        uses: actions/upload-artifact@v4
        with:
          name: verified-rsi-plan-${{ github.run_id }}
          path: rsi-artifacts/verified-rsi-plan.json
          retention-days: 14
          if-no-files-found: error
