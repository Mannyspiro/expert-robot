name: Merlin core contract evidence

on:
  pull_request:
    paths:
      - "python/merlin/app.py"
      - "python/merlin/capability_registry.py"
      - "python/merlin/identity.py"
      - "tests/test_merlin_capability_registry.py"
      - "tests/test_merlin_identity.py"
      - "tests/research/test_merlin_api.py"
      - ".github/workflows/merlin-core-contract-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-core-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5

      - name: Compile core contracts
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python -m compileall -q python/merlin/app.py python/merlin/capability_registry.py python/merlin/identity.py 2>&1 | tee artifacts/compile.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-core-compile","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/compile-result.json
          exit "$rc"

      - name: Run core contract and API tests
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          set +e
          mkdir -p artifacts
          python -m pytest -q -v tests/test_merlin_capability_registry.py tests/test_merlin_identity.py tests/research/test_merlin_api.py 2>&1 | tee artifacts/core-tests.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"merlin-core-contract-tests","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/core-tests-result.json
          exit "$rc"

      - name: Upload logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
