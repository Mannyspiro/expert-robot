name: Titan PQC ACVP Reference Tests

on:
  push:
    branches:
      - "feat/titan-pqc-foundation-20261105"
    paths:
      - "config/titan/provider-lock.v1.json"
      - "formal/MathAI/Titan/Protocol.lean"
      - ".github/workflows/titan-pqc-acvp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-pqc-acvp-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  acvp-reference:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 25
    steps:
      - name: Checkout Titan source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc g++ git python3 python3-venv

      - name: Verify pinned upstream provider and vector release
        shell: bash
        run: |
          set -euo pipefail
          LIBOQS_TAG_SHA="$(git ls-remote https://github.com/open-quantum-safe/liboqs.git refs/tags/0.16.0 | awk '{print $1}')"
          test "$LIBOQS_TAG_SHA" = "5a1a854b0dc9f2141bdc771c555ee60c37950183"
          git clone --filter=blob:none https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          git -C /tmp/liboqs checkout --detach 5a1a854b0dc9f2141bdc771c555ee60c37950183
          test "$(git -C /tmp/liboqs rev-parse HEAD)" = "$LIBOQS_TAG_SHA"
          ACVP_TAG_SHA="$(git ls-remote https://github.com/usnistgov/ACVP-Server.git refs/tags/v1.1.0.41 | awk '{print $1}')"
          test "$ACVP_TAG_SHA" = "b121fee031dc65d32c96f4109a42a10dacbe2076"
          echo "ACVP_TAG_SHA=$ACVP_TAG_SHA" >> "$GITHUB_ENV"
          {
            echo "liboqs_commit=$(git -C /tmp/liboqs rev-parse HEAD)"
            echo "acvp_server_commit=$ACVP_TAG_SHA"
            echo "python=$(python3 --version)"
            echo "cmake=$(cmake --version | head -1)"
            echo "gcc=$(gcc --version | head -1)"
            echo "runner=$RUNNER_NAME"
          } | tee titan-provider-provenance.txt

      - name: Build only standardized algorithms
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQS_ALGS_ENABLED=STD \
            -DOQS_BUILD_TESTS=ON \
            -DOQS_BUILD_ONLY_LIB=OFF
          cmake --build /tmp/liboqs/build --parallel 4

      - name: Install pinned upstream test requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/titan-pqc-venv
          /tmp/titan-pqc-venv/bin/python -m pip install --upgrade "pip==25.2"
          /tmp/titan-pqc-venv/bin/python -m pip install --require-hashes -r /tmp/liboqs/.github/workflows/requirements.txt

      - name: Execute official NIST ACVP projection-vector tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/liboqs
          export OQS_BUILD_DIR=build
          set +e
          /tmp/titan-pqc-venv/bin/python -m pytest -q tests/test_acvp_vectors.py \
            --junitxml="$GITHUB_WORKSPACE/titan-acvp-junit.xml" \
            | tee "$GITHUB_WORKSPACE/titan-acvp-test.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$GITHUB_WORKSPACE/titan-acvp-exit-code.txt"
          exit "$rc"

      - name: Record exact source and vector evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          def sha(p):
              p=pathlib.Path(p)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          def git(path,*args):
              try:return subprocess.check_output(["git","-C",path,*args],text=True).strip()
              except Exception:return None
          rc_path=root/"titan-acvp-exit-code.txt"
          rc_text=rc_path.read_text().strip() if rc_path.exists() else None
          junit_path=root/"titan-acvp-junit.xml"
          suites={}
          counts={"tests":0,"passed":0,"skipped":0,"failed":0}
          if junit_path.exists():
              tree=ET.parse(junit_path)
              for case in tree.iter("testcase"):
                  name=case.attrib.get("name","")
                  suite=("FIPS203" if name.startswith("test_acvp_vec_kem_") and "[ML-KEM-" in name else
                         "FIPS204" if name.startswith("test_acvp_vec_ml_dsa_") and "[ML-DSA-" in name else
                         "FIPS205" if name.startswith("test_acvp_vec_slh_dsa_") and "[SLH_DSA_PURE_" in name else None)
                  if suite is None: continue
                  row=suites.setdefault(suite,{"tests":0,"passed":0,"skipped":0,"failed":0})
                  row["tests"]+=1
                  counts["tests"]+=1
                  if case.find("skipped") is not None:
                      row["skipped"]+=1; counts["skipped"]+=1
                  elif case.find("failure") is not None or case.find("error") is not None:
                      row["failed"]+=1; counts["failed"]+=1
                  else:
                      row["passed"]+=1; counts["passed"]+=1
          report={
            "schema_version":1,
            "evidence_type":"titan-pqc-acvp-test",
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            "workflow_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "titan_source_commit":os.environ.get("GITHUB_SHA"),
            "provider":{"repository":"https://github.com/open-quantum-safe/liboqs","release":"0.16.0","commit":git("/tmp/liboqs","rev-parse","HEAD")},
            "vectors":{"repository":"https://github.com/usnistgov/ACVP-Server","tag":"v1.1.0.41","commit":os.environ.get("ACVP_TAG_SHA")},
            "test_suites":["FIPS203","FIPS204","FIPS205"],
            "suite_results":suites,
            "test_counts":counts,
            "test_exit_code":int(rc_text) if rc_text and rc_text.isdigit() else None,
            "known_answer_tests_run":junit_path.exists(),
            "test_result":"pass" if rc_text=="0" else ("fail" if rc_text else "not_completed"),
            "test_log_sha256":sha(root/"titan-acvp-test.log"),
            "junit_sha256":sha(junit_path),
            "runner_name":os.environ.get("RUNNER_NAME"),
            "fips_validation_claim":False,
            "production_eligible":False
          }
          (root/"titan-pqc-acvp-evidence.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-pqc-acvp-${{ github.run_id }}
          path: |
            titan-provider-provenance.txt
            titan-acvp-test.log
            titan-acvp-junit.xml
            titan-pqc-acvp-evidence.json
          if-no-files-found: warn
          retention-days: 30
