name: Autonomous Research Operations - Observe Only

on:
  workflow_dispatch:
  schedule:
    # 09:23 America/Phoenix, after merging to default branch.
    - cron: '23 16 * * *'
  pull_request:
    paths:
      - 'scripts/run_autonomous_research_cycle.py'
      - 'tests/autonomous_research_operations_smoke.py'
      - 'scripts/verify_autonomous_research_receipt.py'
      - 'tests/test_receipt_verifier.py'
      - 'config/autonomous_research_policy.json'
      - '.github/workflows/autonomous-research-operations.yml'

permissions:
  contents: read

concurrency:
  group: autonomous-research-observe-only
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'Mannyspiro/expert-robot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce local research route and mutation gates
        run: |
          python3 tests/autonomous_research_operations_smoke.py
          python3 -m unittest discover -v -s tests -p 'test_receipt_verifier.py'
      - name: Run exactly one offline research episode
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p autonomous-research-artifacts
          python3 scripts/run_autonomous_research_cycle.py \
            --source-commit "$SOURCE_HEAD" \
            -o autonomous-research-artifacts/research-episode.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('autonomous-research-artifacts/research-episode.json')
          receipt=json.loads(path.read_text())
          assert receipt['source_commit']==os.environ['SOURCE_HEAD']
          assert receipt['conclusion']=='bounded_offline_experiment_only'
          assert receipt['promotion_authorized'] is False
          assert receipt['candidate']['lean_gate']=='requires_exact_kernel_axiom_audit'
          assert receipt['external_network_used'] is False
          assert receipt['avrea_credits_reserved']==0
          assert path.stat().st_size<=65536
          PY
      - name: Independently audit observation receipt against checked-out source
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/verify_autonomous_research_receipt.py \
            --root . \
            --receipt autonomous-research-artifacts/research-episode.json \
            --source-commit "$SOURCE_HEAD"
      - name: Preserve source-bound observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-research-observation-${{ github.run_id }}
          path: autonomous-research-artifacts/research-episode.json
          retention-days: 30
          if-no-files-found: warn
