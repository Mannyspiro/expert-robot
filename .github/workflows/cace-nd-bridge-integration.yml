name: CACE ND Bridge Integration

on:
  pull_request:
    paths:
      - "scripts/compile_crl_to_cace_nd.py"
      - "scripts/run_cace_nd_bridge_smoke.py"
      - "scripts/inspect_cace_beam_solver.py"
      - "scripts/run_cace_beam_benchmark.py"
      - "scripts/evaluate_research_object_beam.py"
      - "scripts/evaluate_research_object_truss.py"
      - "scripts/generate_research_object_candidates.py"
      - "scripts/research_object_routing.py"
      - "tests/research_object_beam_smoke.py"
      - "scripts/certify_beam_discrete.py"
      - "scripts/run_beam_holdouts.py"
      - "tests/beam_discrete_certificate_smoke.py"
      - "tests/research_object_beam_holdouts_smoke.py"
      - "config/examples/research_object_beam_holdouts.json"
      - "config/examples/research_object_beam.json"
      - "tests/crl_to_cace_nd_smoke.py"
      - "config/cace_actual_module_contracts.json"
      - "config/examples/portal_p2_boundary_null.crl"
      - ".github/workflows/cace-nd-bridge-integration.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nd-bridge-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    concurrency:
      group: expert-robot-research-validation-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned CACE Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cace-pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/cace_fem_nd_contract_pin.json') }}
          restore-keys: |
            cace-pip-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare deploy key
        shell: bash
        env:
          CACE_REPO_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$CACE_REPO_KEY" > "$key_file"
          chmod 600 "$key_file"
          eval "$(ssh-agent -s)"
          ssh-add "$key_file" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Install CACE runtime dependency
        run: python3 -m pip install --disable-pip-version-check --no-input numpy
      - name: Clone pinned CACE and run bridge
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-app"
          out="$RUNNER_TEMP/cace-nd-bridge.json"
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git clone git@github.com:morganaspim/Cace-app.git "$work"
          git -C "$work" checkout 0e7aa229d3bb57174e281b883ee8af5445f15f75
          python3 scripts/inspect_cace_beam_solver.py "$work" -o "$RUNNER_TEMP/cace-beam-solver-contract.json"
          if [ -f "$work/requirements.txt" ]; then
            python3 -m pip install -r "$work/requirements.txt"
          elif [ -f "$work/pyproject.toml" ]; then
            python3 -m pip install -e "$work"
          else
            python3 -m pip install "numpy>=1.26,<3"
          fi
          python3 scripts/run_cace_nd_bridge_smoke.py \
            "$work" config/examples/portal_p2_boundary_null.crl -o "$out"
          RESEARCH_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }} python3 scripts/run_cace_beam_benchmark.py \
            "$work" config/examples/research_object_beam.json -o "$RUNNER_TEMP/cace-beam-benchmark.json"
          python3 scripts/certify_beam_discrete.py "$RUNNER_TEMP/cace-beam-benchmark.json" -o "$RUNNER_TEMP/cace-beam-certificate-replay.json"
          cat "$out"

      - name: Validate theorem-backed refinement forecast
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/cace-nd-bridge.json"
          forecast="$RUNNER_TEMP/cace-refinement-forecast-validation.json"
          python3 scripts/validate_cace_refinement_forecast.py "$report" -o "$forecast"
          cat "$forecast"

      - name: Mine experiment-inspired mathematics
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/cace-nd-bridge.json"
          dataset="$RUNNER_TEMP/cace-math-dataset.json"
          candidates="$RUNNER_TEMP/cace-math-candidates.json"
          queue="$RUNNER_TEMP/cace-math-proof-queue.json"
          python3 scripts/cace_history_to_math_dataset.py "$report" -o "$dataset"
          python3 scripts/mine_experiment_math.py "$dataset" -o "$candidates"
          python3 scripts/select_math_candidates.py "$candidates" > "$queue"
          cat "$candidates"
          cat "$queue"
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: cace-nd-bridge-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cace-nd-bridge.json
            ${{ runner.temp }}/cace-beam-solver-contract.json
            ${{ runner.temp }}/cace-beam-benchmark.json
            ${{ runner.temp }}/cace-beam-certificate-replay.json
            config/examples/research_object_beam_holdouts.json
            ${{ runner.temp }}/cace-math-dataset.json
            ${{ runner.temp }}/cace-math-candidates.json
            ${{ runner.temp }}/cace-math-proof-queue.json
            ${{ runner.temp }}/cace-refinement-forecast-validation.json
          retention-days: 30
      - name: Cleanup key
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/cace_repo_key"

