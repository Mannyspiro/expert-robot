name: RSI Candidate Qualification

on:
  workflow_run:
    workflows: ["Collared RSI Generation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Candidate branch (must start candidate/)"
        required: true
        type: string
      collar_evidence_run_id:
        description: "Trusted Collared RSI Generation workflow run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: expert-robot-avrea-rsi-promotion-v2
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: avrea-ubuntu-latest-8-vcpu
    concurrency:
      group: expert-robot-avrea-half-month-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    env:
      CANDIDATE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.candidate_ref }}
      COLLAR_EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.collar_evidence_run_id }}
    outputs:
      candidate_sha: ${{ steps.meta.outputs.candidate_sha }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
      candidate_ref: ${{ steps.meta.outputs.candidate_ref }}
      collar_evidence_run_id: ${{ steps.meta.outputs.collar_evidence_run_id }}

    steps:
      - uses: actions/checkout@v4
      - name: Enforce Avrea half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
          AVREA_RUNNER_LABEL: avrea-ubuntu-latest-8-vcpu
        run: python3 scripts/check_avrea_halfmonth_budget.py --reserve-minutes 45 --runner-label "$AVREA_RUNNER_LABEL"
      - name: Validate candidate ref
        shell: bash
        run: |
          set -euo pipefail
          case "$CANDIDATE_REF" in
            candidate/*) ;;
            *) echo "::error::Candidate ref must start with candidate/"; exit 2 ;;
          esac

      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Bind candidate to current base
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git -C trusted rev-parse HEAD)"
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          git -C candidate merge-base --is-ancestor "$base_sha" "$candidate_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
          echo "collar_evidence_run_id=$COLLAR_EVIDENCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Enforce automatic-promotion scope
        run: |
          python3 trusted/scripts/validate_candidate_scope.py candidate             --base-sha "${{ steps.meta.outputs.base_sha }}"             --candidate-sha "${{ steps.meta.outputs.candidate_sha }}"             --policy trusted/config/auto_promotion_scope.json             --output candidate-scope.json

      - name: Reject evaluation identity leakage
        run: |
          python3 trusted/scripts/validate_blind_candidate.py candidate \
            --base-sha "${{ steps.meta.outputs.base_sha }}" \
            --candidate-sha "${{ steps.meta.outputs.candidate_sha }}" \
            --policy trusted/config/blind_evaluation_policy.json \
            --output candidate-blind.json

      - name: Verify formal dependency graph is unchanged
        shell: bash
        run: |
          set -euo pipefail
          cmp trusted/formal/lake-manifest.json candidate/formal/lake-manifest.json
          cmp trusted/formal/lean-toolchain candidate/formal/lean-toolchain
          cmp trusted/formal/lakefile.toml candidate/formal/lakefile.toml

      - name: Build candidate Lean package
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: "candidate/formal"
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          leanchecker: "false"
          axiom-audit: "false"

      - name: Verify trusted hidden hard-v2 witnesses against candidate
        shell: bash
        run: |
          set -euo pipefail
          (
            cd candidate/formal
            lake env lean ../../trusted/tests/lean/hard_math_v2_witnesses.lean
          )

      - name: Configure candidate C++
        run: cmake -S candidate -B candidate/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build candidate
        run: cmake --build candidate/build --parallel "$(nproc)"

      - name: Test candidate
        run: ctest --test-dir candidate/build --output-on-failure

      - name: Run frozen candidate benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          for variant in proof_search theorem_graph route_memory sequence_memory strategy_memory; do
            (
              cd candidate
              build/expert_robot_math_benchmark \
                ../trusted/config/benchmarks/progression_math_v2.json \
                "build/candidate-state-$variant" \
                "../candidate-evidence/math-benchmark-results-$variant.json" \
                "candidate-${{ github.run_id }}-$variant" \
                "$variant"
            )
          done

      - name: Upload raw candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-raw-${{ github.run_id }}
          path: |
            candidate-evidence/
            candidate-scope.json
            candidate-blind.json
          if-no-files-found: error
          retention-days: 30

  decide:
    needs: qualify
    runs-on: avrea-ubuntu-latest-8-vcpu
    concurrency:
      group: expert-robot-avrea-half-month-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Enforce Avrea half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
          AVREA_RUNNER_LABEL: avrea-ubuntu-latest-8-vcpu
        run: python3 scripts/check_avrea_halfmonth_budget.py --reserve-minutes 15 --runner-label "$AVREA_RUNNER_LABEL"
      - name: Check out trusted policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate for diff inspection only
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate candidate scope on fresh runner
        run: |
          python3 trusted/scripts/validate_candidate_scope.py candidate             --base-sha "${{ needs.qualify.outputs.base_sha }}"             --candidate-sha "${{ needs.qualify.outputs.candidate_sha }}"             --policy trusted/config/auto_promotion_scope.json             --output trusted-scope.json

      - name: Revalidate blind candidate on fresh runner
        run: |
          python3 trusted/scripts/validate_blind_candidate.py candidate \
            --base-sha "${{ needs.qualify.outputs.base_sha }}" \
            --candidate-sha "${{ needs.qualify.outputs.candidate_sha }}" \
            --policy trusted/config/blind_evaluation_policy.json \
            --output trusted-blind.json

      - name: Download raw benchmark evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-raw-${{ github.run_id }}
          path: raw

      - name: Download independent collar evidence
        uses: actions/download-artifact@v4
        with:
          pattern: collar-generation-evidence-*
          path: collar
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.qualify.outputs.collar_evidence_run_id }}

      - name: Validate independent collar evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t evidence < <(find collar -type f -name collar-evidence.json -print)
          [ "${#evidence[@]}" -eq 1 ] || {
            echo "::error::Expected exactly one collar-evidence.json"; exit 2;
          }
          python3 trusted/scripts/validate_collar_evidence.py "${evidence[0]}"             --candidate-sha "${{ needs.qualify.outputs.candidate_sha }}"             --base-sha "${{ needs.qualify.outputs.base_sha }}"             --output normalized-collar.json

      - name: Merge raw benchmark results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, pathlib
          expected={"proof_search","theorem_graph","route_memory","sequence_memory","strategy_memory"}
          summaries=[]; records=[]; seen=set()
          for path in sorted(glob.glob("raw/candidate-evidence/math-benchmark-results-*.json")):
              payload=json.load(open(path,encoding="utf-8"))
              for s in payload.get("summaries",[]):
                  seen.add(s["variant"]); summaries.append(s)
              records.extend(payload.get("records",[]))
          missing=sorted(expected-seen)
          if missing: raise SystemExit("missing candidate benchmark variants: "+", ".join(missing))
          summaries.sort(key=lambda x:(x["variant"],x["split"],x["domain"]))
          records.sort(key=lambda x:(x["variant"],x["case_id"]))
          out={"schema_version":1,"run_id":"candidate-${{ github.run_id }}",
               "variants":sorted(expected),"summaries":summaries,"records":records}
          pathlib.Path("candidate-results.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

      - name: Evaluate merit with frozen G2 progression policy
        run: |
          python3 trusted/scripts/compare_progression_to_reference.py             candidate-results.json             --baseline trusted/config/benchmarks/g2_progression_v2_baseline.json             --output benchmark-merit.json

      - name: Build promotion evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          collar=json.load(open("normalized-collar.json"))
          merit=json.load(open("benchmark-merit.json"))
          scope=json.load(open("trusted-scope.json"))
          evidence={
              "candidate_id":collar["candidate_id"],
              "generation_budget_estimated":collar["generation_budget_estimated"],
              "collared_execution":collar["collared_execution"],
              "validation_verified_rate_delta":merit["validation_verified_rate_delta"],
              "holdout_verified_rate_delta":merit["holdout_verified_rate_delta"],
              "qualification_passed":True,
              "formal_verification_passed":True,
              "rollback_verified":True,
              "lineage_verified":collar["lineage_verified"],
              "authority_change":scope["authority_change"],
              "core_integrity_verified":collar["core_integrity_verified"],
              "collar_tripped":collar["collar_tripped"],
          }
          open("promotion-evidence.json","w").write(json.dumps(evidence,indent=2)+"\n")
          PY
          python3 trusted/scripts/evaluate_promotion.py             promotion-evidence.json             --output promotion-verdict.json             --require-eligible

      - name: Emit trusted promotion decision
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          def load(p): return json.load(open(p,encoding="utf-8"))
          verdict=load("promotion-verdict.json")
          merit=load("benchmark-merit.json")
          scope=load("trusted-scope.json")
          collar=load("normalized-collar.json")
          decision={
              "schema_version":1,
              "source_qualification_run_id":int("${{ github.run_id }}"),
              "candidate_ref":"${{ needs.qualify.outputs.candidate_ref }}",
              "candidate_sha":"${{ needs.qualify.outputs.candidate_sha }}",
              "base_branch":"${{ github.event.repository.default_branch }}",
              "base_sha":"${{ needs.qualify.outputs.base_sha }}",
              "promotion_target":"qualified/latest",
              "eligible_for_automatic_promotion":verdict["eligible_for_automatic_promotion"],
              "authority_change":scope["authority_change"],
              "selected_variant":merit["selected_variant"],
              "validation_verified_rate_delta":merit["validation_verified_rate_delta"],
              "holdout_verified_rate_delta":merit["holdout_verified_rate_delta"],
              "collar_evidence_sha256":collar["evidence_sha256"],
              "progression_baseline_id":merit["baseline_id"],
              "verdict":verdict,
          }
          canonical=json.dumps(decision,sort_keys=True,separators=(",",":")).encode()
          decision["decision_sha256"]=hashlib.sha256(canonical).hexdigest()
          open("promotion-decision.json","w").write(json.dumps(decision,indent=2)+"\n")
          PY

      - name: Upload trusted promotion decision
        uses: actions/upload-artifact@v4
        with:
          name: candidate-promotion-decision-${{ github.run_id }}
          path: |
            promotion-decision.json
            promotion-verdict.json
            benchmark-merit.json
            normalized-collar.json
            trusted-scope.json
            trusted-blind.json
          if-no-files-found: error
          retention-days: 30

