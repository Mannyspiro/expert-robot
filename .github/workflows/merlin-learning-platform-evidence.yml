name: Merlin Learning platform evidence

on:
  pull_request:
    paths:
      - "python/merlin/learning_platform.py"
      - "python/merlin/app.py"
      - "python/merlin/research_curriculum.py"
      - "python/merlin/math_foundations_course.py"
      - "python/merlin/math_logic_discrete_course.py"
      - "python/merlin/math_algebra_functions_course.py"
      - "python/merlin/math_calculus_probability_course.py"
      - "python/merlin/math_numerical_scientific_computing_course.py"
      - "python/merlin/learner_model.py"
      - "tests/test_learner_model.py"
      - "docs/merlin/MERLIN_MATH_FOUNDATIONS_COURSE_V1.json"
      - "docs/merlin/MERLIN_MATH_LOGIC_DISCRETE_COURSE_V1.json"
      - "docs/merlin/MERLIN_MATH_ALGEBRA_FUNCTIONS_COURSE_V1.json"
      - "docs/merlin/MERLIN_MATH_CALCULUS_PROBABILITY_COURSE_V1.json"
      - "docs/merlin/MERLIN_MATH_NUMERICAL_SCIENTIFIC_COMPUTING_COURSE_V1.json"
      - "docs/merlin/MERLIN_MATH_LEARNING_PATHWAYS_V1.json"
      - "docs/merlin/MERLIN_MATH_LEARNING_PATHWAYS_V1.md"
      - "docs/merlin/MERLIN_MATH_LESSON_BACKLOG_V1.json"
      - "docs/research/merlin-mathematical-idea-catalog.v1.json"
      - "scripts/merlin_math_idea_validate.py"
      - "scripts/merlin_math_pathways_validate.py"
      - "scripts/merlin_math_lesson_backlog_validate.py"
      - "scripts/merlin_math_portfolio_validate.py"
      - "tests/test_merlin_math_foundations_course.py"
      - "tests/test_merlin_math_logic_discrete_course.py"
      - "tests/test_merlin_math_algebra_functions_course.py"
      - "tests/test_merlin_math_calculus_probability_course.py"
      - "tests/test_merlin_math_numerical_scientific_computing_course.py"
      - "tests/test_merlin_math_lesson_backlog.py"
      - "tests/test_merlin_math_portfolio.py"
      - "ui/merlin-learning/index.html"
      - "tests/test_merlin_learning_platform.py"
      - "tests/research/test_merlin_learning_http.py"
      - "tests/test_merlin_research_curriculum.py"
      - ".github/workflows/merlin-learning-platform-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-learning-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  learning-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Install pinned test runner
        shell: bash
        run: |
          set +e
          python -m pip install pytest==8.3.5 2>&1 | tee artifacts/pip-install.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"learning-platform-install","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/install-result.json
          exit "$rc"

      - name: Compile Merlin Learning modules
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python -m compileall -q python/merlin/app.py python/merlin/learning_platform.py python/merlin/learner_model.py python/merlin/research_curriculum.py python/merlin/math_foundations_course.py python/merlin/math_logic_discrete_course.py python/merlin/math_algebra_functions_course.py python/merlin/math_calculus_probability_course.py python/merlin/math_numerical_scientific_computing_course.py 2>&1 | tee artifacts/compile.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"learning-platform-compile","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/compile-result.json
          exit "$rc"

      - name: Validate canonical mathematical idea catalog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merlin_math_idea_validate.py

      - name: Validate algebra and functions course template
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from python.merlin.math_algebra_functions_course import load_math_algebra_functions_manifest
          manifest = load_math_algebra_functions_manifest()
          print("Validated", manifest["curriculum_id"], len(manifest["objectives"]), "objectives")
          PY

      - name: Validate numerical methods and scientific computing course template
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from python.merlin.math_numerical_scientific_computing_course import load_math_numerical_scientific_computing_manifest
          manifest = load_math_numerical_scientific_computing_manifest()
          print("Validated", manifest["curriculum_id"], len(manifest["objectives"]), "objectives")
          PY

      - name: Validate calculus probability and statistics course template
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from python.merlin.math_calculus_probability_course import load_math_calculus_probability_manifest
          manifest = load_math_calculus_probability_manifest()
          print("Validated", manifest["curriculum_id"], len(manifest["objectives"]), "objectives")
          PY

      - name: Validate logic and discrete mathematics course template
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from python.merlin.math_logic_discrete_course import load_math_logic_discrete_manifest
          manifest = load_math_logic_discrete_manifest()
          print("Validated", manifest["curriculum_id"], len(manifest["objectives"]), "objectives")
          PY

      - name: Validate three-path mathematics learning map
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merlin_math_pathways_validate.py

      - name: Validate cross-course mathematics portfolio
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/merlin_math_portfolio_validate.py

      - name: Validate review-gated mathematics lesson backlog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merlin_math_lesson_backlog_validate.py

      - name: Validate Merlin Learning inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path("ui/merlin-learning/index.html").read_text(encoding="utf-8")
          if html.count("<script>") != 1 or html.count("</script>") != 1:
              raise SystemExit("expected exactly one inline script block")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("artifacts/merlin-learning-inline.js").write_text(script, encoding="utf-8")
          PY
          node --check artifacts/merlin-learning-inline.js 2>&1 | tee artifacts/merlin-learning-js.log

      - name: Run Merlin Learning tests
        id: tests
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          set +e
          mkdir -p artifacts
          python -m pytest -q -v tests/test_merlin_learning_platform.py tests/research/test_merlin_learning_http.py tests/test_merlin_research_curriculum.py tests/test_merlin_math_foundations_course.py tests/test_merlin_math_logic_discrete_course.py tests/test_merlin_math_algebra_functions_course.py tests/test_merlin_math_calculus_probability_course.py tests/test_merlin_math_numerical_scientific_computing_course.py tests/test_merlin_math_lesson_backlog.py tests/test_merlin_math_portfolio.py tests/test_learner_model.py 2>&1 | tee artifacts/learning-tests.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"learning-platform-tests","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/learning-tests-result.json
          exit "$rc"

      - name: Upload test logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-learning-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
