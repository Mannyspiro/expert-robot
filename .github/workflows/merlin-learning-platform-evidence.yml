name: Merlin Learning platform evidence

on:
  pull_request:
    paths:
      - "python/merlin/learning_platform.py"
      - "python/merlin/app.py"
      - "python/merlin/research_curriculum.py"
      - "python/merlin/learner_model.py"
      - "python/merlin/knowledge_graph.py"
      - "python/merlin/project_registry.py"
      - "python/merlin/event_outbox.py"
      - "tests/test_merlin_learning_platform.py"
      - "tests/research/test_merlin_learning_http.py"
      - "tests/test_merlin_research_curriculum.py"
      - "tests/test_merlin_learner_store_resources.py"
      - ".github/workflows/merlin-learning-platform-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-learning-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  learning-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5

      - name: Compile Merlin Learning modules
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python -m compileall -q python/merlin/app.py python/merlin/learning_platform.py python/merlin/research_curriculum.py python/merlin/learner_model.py python/merlin/knowledge_graph.py python/merlin/project_registry.py python/merlin/event_outbox.py 2>&1 | tee artifacts/compile.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"learning-platform-compile","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/compile-result.json
          exit "$rc"

      - name: Run Merlin Learning tests
        id: tests
        shell: bash
        env:
          PYTHONPATH: python
        run: |
          set +e
          mkdir -p artifacts
          python -m pytest -q -v tests/test_merlin_learning_platform.py tests/research/test_merlin_learning_http.py tests/test_merlin_research_curriculum.py tests/test_merlin_learner_store_resources.py 2>&1 | tee artifacts/learning-tests.log
          rc=${PIPESTATUS[0]}
          printf '{"suite":"learning-platform-tests","commit":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$rc" > artifacts/learning-tests-result.json
          exit "$rc"

      - name: Upload test logs and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-learning-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
