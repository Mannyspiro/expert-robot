name: Production RSI Qualification

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared across heavy Avrea workflows so repository-wide compute never
  # exceeds the 24-vCPU benchmark ceiling.
  group: expert-robot-avrea-heavy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Production policy gates
        run: |
          set -euo pipefail
          python3 tests/compute_policy_smoke.py
          python3 tests/known_failure_regression_smoke.py
          python3 tests/formal_dependency_lock_smoke.py
          python3 tests/cace_return_bridge_smoke.py
          python3 tests/collar_policy_smoke.py
          python3 tests/production_policy_smoke.py
          bash tests/collar_vault_smoke.sh
          mkdir -p build
          python3 scripts/production_readiness.py --output build/production-readiness.json

      - name: Build pinned Lean package
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: "formal"
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          leanchecker: "false"
          axiom-audit: "false"

      - name: Configure C++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build C++
        run: cmake --build build --parallel "$(nproc)"

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rsi-qualification-${{ github.run_id }}
          path: |
            build/production-readiness.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
