name: Production RSI Qualification

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One repository-wide heavy lane prevents aggregate Avrea compute from
  # exceeding the approved ceiling. Newer releases may supersede only pending,
  # not running, work.
  group: expert-robot-avrea-l3-v2
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Production policy gates
        run: |
          set -euo pipefail
          python3 tests/compute_policy_smoke.py
          python3 tests/known_failure_regression_smoke.py
          python3 tests/formal_dependency_lock_smoke.py
          python3 tests/cace_return_bridge_smoke.py
          python3 tests/collar_policy_smoke.py
          python3 tests/collar_runtime_contract_smoke.py
          python3 tests/production_policy_smoke.py
          python3 tests/benchmark_baseline_smoke.py
          python3 tests/candidate_scope_smoke.py
          python3 tests/collar_evidence_smoke.py
          python3 tests/blind_generation_view_smoke.py
          python3 tests/blind_candidate_smoke.py
          python3 tests/promotion_workflow_smoke.py
          python3 tests/research_cli_contract_smoke.py
          bash tests/collar_vault_smoke.sh
          mkdir -p build
          python3 scripts/production_readiness.py --output build/production-readiness.json

      - name: Build pinned Lean package
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: "formal"
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          leanchecker: "false"
          axiom-audit: "false"

      - name: Configure C++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build C++
        run: cmake --build build --parallel "$(nproc)"

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rsi-static-${{ github.run_id }}
          path: |
            build/production-readiness.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  benchmark:
    needs: qualify
    name: release-benchmark-${{ matrix.variant }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant:
          - proof_search
          - theorem_graph
          - route_memory
          - sequence_memory
          - strategy_memory

    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build pinned Lean package
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: "formal"
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          leanchecker: "false"
          axiom-audit: "false"

      - name: Configure C++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build benchmark
        run: cmake --build build --target expert_robot_math_benchmark --parallel "$(nproc)"

      - name: Run isolated train validation holdout benchmark
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ matrix.variant }}"
          ./build/expert_robot_math_benchmark             config/benchmarks/core_math_holdout.json             "build/math-benchmark-state-${variant}"             "build/math-benchmark-results-${variant}.json"             "release-${{ github.run_id }}-${variant}"             "${variant}"

      - name: Upload variant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-part-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            build/math-benchmark-results-${{ matrix.variant }}.json
            build/math-benchmark-state-${{ matrix.variant }}/math_eval.sqlite3
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: [qualify, benchmark]
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Require static qualification
        if: ${{ needs.qualify.result != 'success' }}
        run: |
          echo "::error::Static production qualification failed."
          exit 1

      - name: Download release benchmark evidence
        uses: actions/download-artifact@v4
        with:
          pattern: release-benchmark-part-*-${{ github.run_id }}
          path: build/parts
          merge-multiple: true

      - name: Merge benchmark summaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import pathlib

          paths = sorted(glob.glob("build/parts/math-benchmark-results-*.json"))
          expected = {"proof_search","theorem_graph","route_memory","sequence_memory","strategy_memory"}
          summaries, records, seen = [], [], set()
          for path in paths:
              payload = json.load(open(path, encoding="utf-8"))
              for summary in payload.get("summaries", []):
                  seen.add(summary["variant"])
                  summaries.append(summary)
              records.extend(payload.get("records", []))
          missing = sorted(expected - seen)
          if missing:
              raise SystemExit("missing benchmark variants: " + ", ".join(missing))
          summaries.sort(key=lambda x: (x["variant"], x["split"], x["domain"]))
          records.sort(key=lambda x: (x["variant"], x["case_id"]))
          output = {
              "schema_version": 1,
              "run_id": "release-${{ github.run_id }}",
              "execution": "production-release-parallel-independent-variants",
              "variants": sorted(expected),
              "summaries": summaries,
              "records": records,
              "failure_map": [x for x in records if not x.get("verified", False)],
          }
          target = pathlib.Path("build/math-benchmark-results.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Compare against frozen G0 baseline
        run: |
          python3 scripts/compare_benchmark_to_baseline.py             build/math-benchmark-results.json             --baseline config/benchmarks/g0_baseline.json             --output build/benchmark-merit.json

      - name: Require benchmark workers
        if: ${{ needs.benchmark.result != 'success' }}
        run: |
          echo "::error::At least one release benchmark worker failed."
          exit 1

      - name: Require demonstrated merit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          evidence = json.load(open("build/benchmark-merit.json", encoding="utf-8"))
          if not evidence.get("merit_demonstrated"):
              raise SystemExit("release contains capability changes but no validation gain over frozen G0")
          if not evidence.get("blind_holdout_non_regression"):
              raise SystemExit("release regresses the frozen blind-holdout overlap")
          print("release merit gate: PASS", evidence.get("selected_variant"))
          PY

      - name: Upload final release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rsi-release-${{ github.run_id }}
          path: |
            build/math-benchmark-results.json
            build/benchmark-merit.json
          if-no-files-found: warn
          retention-days: 30
