name: Research Object Modeler Tests

on:
  pull_request:
    paths:
      - "scripts/generate_research_object_candidates.py"
      - "scripts/experiment_security_guard_cuts.py"
      - "tests/security_guard_cuts_smoke.py"
      - "scripts/experiment_parser_differential.py"
      - "scripts/experiment_security_flow_mediation.py"
      - "config/avrea_half_month_budget.json"
      - "tests/parser_differential_smoke.py"
      - "scripts/research_object_routing.py"
      - "tests/research_object_modeler_smoke.py"
      - "tests/research_object_modeler_v2_smoke.py"
      - "scripts/export_research_object_obj.py"
      - "tests/research_object_obj_export_smoke.py"
      - "scripts/solidify_research_object.py"
      - "tests/research_object_solid_smoke.py"
      - "scripts/evaluate_research_object_truss.py"
      - "tests/research_object_truss_smoke.py"
      - "config/examples/research_object_truss_load_case.json"
      - "config/examples/research_object_demo.json"
      - "scripts/evaluate_research_object_beam.py"
      - "tests/research_object_beam_smoke.py"
      - "scripts/certify_beam_discrete.py"
      - "scripts/run_beam_holdouts.py"
      - "tests/beam_discrete_certificate_smoke.py"
      - "tests/research_object_beam_holdouts_smoke.py"
      - "config/examples/research_object_beam_holdouts.json"
      - "config/examples/research_object_beam.json"
      - ".github/workflows/research-object-modeler.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  avrea-preflight:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/magick-ir-v0-1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check current-period Avrea reservation before runner allocation
        id: budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python3 scripts/check_avrea_halfmonth_budget.py \
               --reserve-minutes 5 \
               --runner-label avrea-ubuntu-latest-8-vcpu \
               > "$RUNNER_TEMP/avrea-security-preflight.json"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Approved by current-period repo quota estimate."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Avrea withheld: budget unavailable or insufficient."
          fi
      - name: Retain Avrea preflight record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avrea-security-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/avrea-security-preflight.json
          if-no-files-found: warn
          retention-days: 30

  avrea-security:
    needs: avrea-preflight
    if: ${{ needs.avrea-preflight.outputs.allowed == 'true' }}
    runs-on: avrea-ubuntu-latest-8-vcpu
    concurrency:
      group: expert-robot-avrea-half-month-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce Avrea half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
          AVREA_RUNNER_LABEL: avrea-ubuntu-latest-8-vcpu
        run: python3 scripts/check_avrea_halfmonth_budget.py --reserve-minutes 5 --runner-label "$AVREA_RUNNER_LABEL"
      - name: Execute bounded offline security-mediation experiment
        run: python3 scripts/experiment_security_flow_mediation.py -o /tmp/cace-security-flow-avrea.json
      - name: Retain Avrea experiment result
        uses: actions/upload-artifact@v4
        with:
          name: avrea-security-mediation-${{ github.run_id }}
          path: /tmp/cace-security-flow-avrea.json
          if-no-files-found: error
          retention-days: 30

  modeler-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test geometry and obstacle-detour modeler
        run: |
          python3 tests/research_object_modeler_smoke.py
          python3 tests/security_guard_cuts_smoke.py
          python3 tests/parser_differential_smoke.py
          python3 scripts/experiment_security_flow_mediation.py -o /tmp/cace-security-flow-mediation.json
          RESEARCH_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }} python3 scripts/experiment_parser_differential.py -o /tmp/cace-parser-differential.json
          RESEARCH_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }} python3 scripts/experiment_security_guard_cuts.py -o /tmp/cace-security-guard-cuts.json
          python3 tests/research_object_modeler_v2_smoke.py
          python3 tests/research_object_obj_export_smoke.py
          python3 tests/research_object_solid_smoke.py
          python3 tests/research_object_truss_smoke.py
          python3 tests/research_object_beam_smoke.py
          python3 tests/beam_discrete_certificate_smoke.py
          python3 tests/research_object_beam_holdouts_smoke.py
          RESEARCH_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }} python3 scripts/evaluate_research_object_beam.py config/examples/research_object_beam.json -o /tmp/cace-modeler-beam-report.json
          python3 scripts/generate_research_object_candidates.py config/examples/research_object_demo.json -o /tmp/cace-modeler.json
          python3 scripts/export_research_object_obj.py config/examples/research_object_demo.json -o /tmp/cace-modeler-preview.obj
          python3 scripts/solidify_research_object.py config/examples/research_object_demo.json --candidate ring -o /tmp/cace-modeler-watertight.obj --report /tmp/cace-modeler-solid-report.json
          python3 scripts/evaluate_research_object_truss.py config/examples/research_object_demo.json config/examples/research_object_truss_load_case.json -o /tmp/cace-modeler-truss-report.json
      - name: Publish modeler candidate record
        uses: actions/upload-artifact@v4
        with:
          name: research-object-modeler-${{ github.run_id }}
          path: |
            /tmp/cace-modeler.json
            /tmp/cace-security-guard-cuts.json
            /tmp/cace-parser-differential.json
            /tmp/cace-security-flow-mediation.json
            /tmp/cace-modeler-preview.obj
            /tmp/cace-modeler-watertight.obj
            /tmp/cace-modeler-solid-report.json
            /tmp/cace-modeler-truss-report.json
            /tmp/cace-modeler-beam-report.json
          retention-days: 30

