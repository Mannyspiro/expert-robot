name: Merlin synthetic agent learning and heldout contract
"on":
  push:
    branches: ["fix/merlin-tool-continuation-fail-closed-20261122"]
    paths:
      - python/merlin/agent_training_bench.py
      - tests/test_agent_training_bench.py
      - .github/workflows/merlin-agent-learning-benchmark.yml
  pull_request:
    paths:
      - python/merlin/agent_training_bench.py
      - tests/test_agent_training_bench.py
      - .github/workflows/merlin-agent-learning-benchmark.yml

permissions:
  contents: read

jobs:
  blind-heldout-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run no-network deterministic synthetic learner evaluation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile python/merlin/agent_training_bench.py tests/test_agent_training_bench.py
          python3 -B -m unittest discover -s tests -p 'test_agent_training_bench.py' -v 2>&1 | tee synthetic-learning-tests.log
          sha256sum python/merlin/agent_training_bench.py tests/test_agent_training_bench.py > source-sha256.txt
      - name: Retain tests and exact evidence identity only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-learning-contract-${{ github.run_id }}
          path: |
            synthetic-learning-tests.log
            source-sha256.txt
          if-no-files-found: warn
          retention-days: 14
