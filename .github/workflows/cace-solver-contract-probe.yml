name: Pinned CACE FEM Solver Contract Probe

on:
  push:
    branches: ["research/cace-solver-residual-qualification-20261009"]
    paths:
      - "scripts/probe_cace_solver_interface.py"
      - "scripts/experiment_cace_actual_solver_residual.py"
      - "scripts/verify_cace_solver_benchmark_evidence.py"
      - ".github/workflows/cace-solver-contract-probe.yml"
  pull_request:
    paths:
      - "scripts/probe_cace_solver_interface.py"
      - ".github/workflows/cace-solver-contract-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-solver-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load authorized read-only CACE access
        env:
          CACE_REPO_KEY: "${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CACE_REPO_KEY:-}" || { echo "authorized CACE key missing"; exit 1; }
          umask 077
          printf '%s\n' "$CACE_REPO_KEY" > "$RUNNER_TEMP/cace_key"
          chmod 600 "$RUNNER_TEMP/cace_key"
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/cace_key" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Read exact prequalified CACE source without modifying remote
        shell: bash
        run: |
          set -euo pipefail
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git clone --depth 1 git@github.com:morganaspim/Cace-app.git "$RUNNER_TEMP/cace-app"
          if [ "$(git -C "$RUNNER_TEMP/cace-app" rev-parse HEAD)" != "66b22a71ff52b3110269f5994a5fd0716a2054c1" ]; then
            GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
              git -C "$RUNNER_TEMP/cace-app" fetch --depth 1 origin 66b22a71ff52b3110269f5994a5fd0716a2054c1
            git -C "$RUNNER_TEMP/cace-app" checkout --detach 66b22a71ff52b3110269f5994a5fd0716a2054c1
          fi
          test "$(git -C "$RUNNER_TEMP/cace-app" rev-parse HEAD)" = "66b22a71ff52b3110269f5994a5fd0716a2054c1"
      - name: Collect exact public API contracts for solver and residual
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/probe_cace_solver_interface.py --cace-repo "$RUNNER_TEMP/cace-app" -o "$RUNNER_TEMP/cace-solver-api.json"
      - name: Execute genuine pinned CACE FEM Poisson solver and verify independent analytic solution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'numpy==2.0.2'
          python3 scripts/experiment_cace_actual_solver_residual.py --cace-repo "$RUNNER_TEMP/cace-app" --output "$RUNNER_TEMP/cace-solver-experiment.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"cace-solver-experiment.json").read_text())
          assert result["passed_meshed_cases"] == 8
          assert result["real_cace_mesh_shape_assembly_solver_residual_estimator_invoked"] is True
          assert result["externally_detected_fake_estimator"] is True
          assert result["externally_detected_changed_rhs"] is True
          assert result["corrupted_solution_rejected_by_cace_solver_tolerance_check"] is True
          assert result["general_pde_a_posteriori_bound_qualified"] is False
          assert result["authority_expanded"] is False
          print("Pinned real CACE FEM solver, residual, estimator and mutant gates PASS")
          PY
      - name: Independently replay every matrix, solution, residual, and estimator with 14 adversarial mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_cace_solver_benchmark_evidence.py "$RUNNER_TEMP/cace-solver-experiment.json" | tee "$RUNNER_TEMP/cace-benchmark-verification.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"cace-benchmark-verification.json").read_text())
          assert d["benchmark_consistency"] is True and d["meshes"]==8
          assert d["adversarial_mutations_rejected"]==14
          assert d["general_pde_error_certificate"] is False
          print("Independent strict benchmark evidence replay PASS")
          PY
      - name: Preserve auditable API schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-cace-fem-solver-contract
          path: |
            ${{ runner.temp }}/cace-solver-api.json
            ${{ runner.temp }}/cace-solver-experiment.json
            ${{ runner.temp }}/cace-benchmark-verification.json
          retention-days: 14
          if-no-files-found: warn
      - name: Destroy temporary deploy-key material
        if: always()
        shell: bash
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/cace_key"
