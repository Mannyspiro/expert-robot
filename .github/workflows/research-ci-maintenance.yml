name: Research CI Queue and Runner Checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/research-ci-maintenance.yml"
      - "scripts/prune_research_ci_queue.py"
      - "scripts/checkpoint_research_state.py"
      - "tests/research_ci_queue_smoke.py"
      - "tests/research_checkpoint_smoke.py"
      - "config/research_session_policy.json"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: research-ci-maintenance-pr-47
  cancel-in-progress: true

jobs:
  maintain:
    if: >-
      github.repository == 'Mannyspiro/expert-robot' &&
      github.event.pull_request.number == 47 &&
      github.event.pull_request.head.ref == 'research/magick-ir-v0-1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Mannyspiro'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test queue scope and checkpoint integrity
        run: |
          python3 tests/research_ci_queue_smoke.py
          python3 tests/research_checkpoint_smoke.py
      - name: Cancel obsolete unassigned research jobs
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p runner-state
          python3 scripts/prune_research_ci_queue.py --head-sha "$TARGET_HEAD_SHA" --apply --out runner-state/queue-maintenance.json
      - name: Save current research state on runner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          python3 scripts/checkpoint_research_state.py --head-sha "$TARGET_HEAD_SHA" --state-dir runner-state --outcome "$CLEANUP_OUTCOME" --queue-report runner-state/queue-maintenance.json
      - name: Retain runner checkpoint without a notes commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-runner-state-${{ github.run_id }}
          path: runner-state/
          retention-days: 30
          if-no-files-found: error
