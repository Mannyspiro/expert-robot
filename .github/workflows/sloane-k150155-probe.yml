name: Sloane K150155 Exact Probe

on:
  push:
    branches:
      - "research/bl-facsimile-acquisition"
    paths:
      - ".github/workflows/sloane-k150155-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe K150155 and IllID 16257 exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          import hashlib, json, pathlib, re, ssl, urllib.parse, urllib.request
          root = pathlib.Path("probe")
          ctx = ssl._create_unverified_context()

          def fetch(url, timeout=90):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (manuscript provenance research)","Accept":"*/*"})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return r.read(), r.geturl(), r.headers.get("Content-Type","")

          report = {
              "target":"Sloane MS 1171 f.120r",
              "candidate_slide":"K150155",
              "candidate_illid":16257,
              "policy":"Sequence adjacency is not evidence. Promote only if archived BL metadata explicitly identifies Sloane MS 1171 and f.120/f.120r.",
              "cdx_queries":[],
              "snapshots":[],
              "image_urls":[],
          }

          targets = [
              "www.bl.uk/catalogues/illuminatedmanuscripts/ILLUMIN.ASP?Size=mid&IllID=16257",
              "www.bl.uk/catalogues/illuminatedmanuscripts/ILLUMIN.ASP?IllID=16257*",
              "www.bl.uk/IllImages/Kslides/K150/K150155.jpg",
              "www.bl.uk/IllImages/Kslides/thm/K150/K150155.jpg",
              "bl.uk/IllImages/Kslides/K150/K150155.jpg",
              "bl.uk/IllImages/Kslides/thm/K150/K150155.jpg",
          ]

          snapshots=[]
          for target in targets:
              params=urllib.parse.urlencode({
                  "url":target,
                  "output":"json",
                  "filter":"statuscode:200",
                  "collapse":"digest",
                  "fl":"timestamp,original,mimetype,statuscode,digest,length",
              })
              url="https://web.archive.org/cdx/search/cdx?"+params
              rec={"target":target,"cdx_url":url}
              try:
                  b,final,ctype=fetch(url)
                  txt=b.decode("utf-8","replace")
                  rec.update({"status":"fetched","bytes":len(b),"preview":txt[:1500]})
                  arr=json.loads(txt)
                  if isinstance(arr,list) and len(arr)>1:
                      hdr=arr[0]
                      for row in arr[1:]:
                          d=dict(zip(hdr,row))
                          d["query_target"]=target
                          snapshots.append(d)
              except Exception as e:
                  rec.update({"status":"failed","error":repr(e)})
              report["cdx_queries"].append(rec)

          # Fetch unique archived metadata snapshots first.
          seen=set()
          for d in snapshots:
              key=(d.get("timestamp"),d.get("original"))
              if key in seen: continue
              seen.add(key)
              ts,orig=key
              wb=f"https://web.archive.org/web/{ts}id_/{orig}"
              rec={"timestamp":ts,"original":orig,"wayback_url":wb,"query_target":d.get("query_target")}
              try:
                  b,final,ctype=fetch(wb,120)
                  rec.update({"status":"fetched","final_url":final,"content_type":ctype,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
                  if (ctype or "").lower().startswith("image/") or b[:2]==b"\xff\xd8" or b.startswith(b"\x89PNG"):
                      ext=".jpg" if b[:2]==b"\xff\xd8" else ".bin"
                      fn=f"snapshot_{len(report['snapshots'])}{ext}"
                      (root/fn).write_bytes(b)
                      rec["file"]=fn
                  else:
                      txt=b.decode("utf-8","replace")
                      if txt.count("\ufffd")>20: txt=b.decode("latin-1","replace")
                      fn=f"snapshot_{len(report['snapshots'])}.html"
                      (root/fn).write_bytes(b)
                      plain=re.sub(r"<[^>]+>"," ",txt)
                      plain=re.sub(r"\s+"," ",plain)
                      rec["file"]=fn
                      rec["explicit_sloane1171"]=bool(re.search(r"Sloane.{0,100}1171|1171.{0,100}Sloane",plain,re.I))
                      rec["explicit_f120r"]=bool(re.search(r"f\.?\s*120\s*r\b|folio\s*120\s*recto",plain,re.I))
                      rec["explicit_f120"]=bool(re.search(r"f\.?\s*120\b",plain,re.I))
                      rec["explicit_f120v"]=bool(re.search(r"f\.?\s*120\s*v\b",plain,re.I))
                      rec["mentions_k150155"]=bool(re.search(r"K150155",txt,re.I))
                      rec["mentions_16257"]=bool(re.search(r"16257",txt,re.I))
                      ctxs=[]
                      for pat in [r".{0,300}Sloane.{0,300}",r".{0,300}1171.{0,300}",r".{0,300}120r.{0,300}",r".{0,300}120v.{0,300}",r".{0,300}K150155.{0,300}",r".{0,300}16257.{0,300}"]:
                          ctxs += [re.sub(r"\s+"," ",x).strip() for x in re.findall(pat,txt,re.I|re.S)]
                      rec["contexts"]=ctxs[:100]
              except Exception as e:
                  rec.update({"status":"failed","error":repr(e)})
              report["snapshots"].append(rec)

          # Probe likely live/legacy image URLs, record only transport status.
          for url in [
              "http://www.bl.uk/IllImages/Kslides/K150/K150155.jpg",
              "https://www.bl.uk/IllImages/Kslides/K150/K150155.jpg",
              "http://www.bl.uk/IllImages/Kslides/thm/K150/K150155.jpg",
              "https://www.bl.uk/IllImages/Kslides/thm/K150/K150155.jpg",
          ]:
              rec={"url":url}
              try:
                  b,final,ctype=fetch(url,60)
                  fn="live_"+str(len(report["image_urls"]))+".bin"
                  (root/fn).write_bytes(b)
                  rec.update({"status":"fetched","final_url":final,"content_type":ctype,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"file":fn})
              except Exception as e:
                  rec.update({"status":"failed","error":repr(e)})
              report["image_urls"].append(rec)

          qualified=[]
          for rec in report["snapshots"]:
              if rec.get("explicit_sloane1171") and rec.get("explicit_f120r"):
                  qualified.append(rec)
          report["qualified_f120r_records"]=qualified
          report["result"]="EXPLICIT_F120R_FOUND" if qualified else "NO_EXPLICIT_F120R_IDENTIFICATION"
          (root/"k150155_illid16257_audit.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Upload exact-ID audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sloane-k150155-probe-${{ github.run_id }}
          path: probe/
          if-no-files-found: error
          retention-days: 14
