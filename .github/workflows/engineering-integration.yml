name: Merlin Engineering Integration

on:
  workflow_dispatch:
  push:
    branches:
      - "repair/cace-bridge-request-isolation-20261105"
      - "repair/merlin-full-integration-20261105"
    paths:
      - "python/merlin/engineering_ir.py"
      - "python/merlin/freecad_bridge.py"
      - "python/merlin/freecad_document_bridge.py"
      - "python/merlin/project_registry.py"
      - "python/merlin/knowledge_graph.py"
      - "python/merlin/ngspice_engine.py"
      - "scripts/run_engineering_ngspice_smoke.py"
      - ".github/workflows/engineering-integration.yml"

permissions:
  contents: read

jobs:
  engineering-smoke:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 15
    steps:
      - name: Check out exact Expert Robot commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ngspice when absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ngspice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ngspice
          fi
          command -v ngspice
          command -v prlimit
          ngspice --version | head -n 4

      - name: Install checksum-pinned FreeCAD 1.1.4 AppImage
        shell: bash
        run: |
          set -euo pipefail
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$available_kb" -lt 4194304 ]; then
            echo "::error::At least 4 GiB free is required for the verified FreeCAD AppImage runtime."
            exit 1
          fi
          case "$(uname -m)" in
            x86_64)
              asset="FreeCAD_1.1.4-Linux-x86_64-py311.AppImage"
              expected="f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434"
              ;;
            aarch64|arm64)
              asset="FreeCAD_1.1.4-Linux-aarch64-py311.AppImage"
              expected="675d1a4295b2183e0e1d816a4b5557dcb63aeced4e60aaa28d6c3686f4c71dc9"
              ;;
            *)
              echo "::error::Unsupported FreeCAD architecture: $(uname -m)"
              exit 1
              ;;
          esac
          appimage="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/$asset" --output "$appimage"
          echo "$expected  $appimage" | sha256sum --check -
          chmod +x "$appimage"
          cat > "$RUNNER_TEMP/freecadcmd" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          export FREECAD_USER_HOME="${RUNNER_TEMP:-/tmp}/freecad-user"
          mkdir -p "$FREECAD_USER_HOME"
          exec "$MERLIN_FREECAD_APPIMAGE" --appimage-extract-and-run "$@"
          SH
          chmod +x "$RUNNER_TEMP/freecadcmd"
          echo "MERLIN_FREECAD_APPIMAGE=$appimage" >> "$GITHUB_ENV"
          echo "FREECAD_CMD=$RUNNER_TEMP/freecadcmd" >> "$GITHUB_ENV"
          echo "FreeCAD 1.1.4 AppImage checksum verified: $asset"

      - name: Run Engineering IR, FreeCAD macro and bounded ngspice integration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python python3 scripts/run_engineering_ngspice_smoke.py artifacts/engineering-ngspice
          python3 -m json.tool artifacts/engineering-ngspice/manifest.json >/dev/null
          test -s artifacts/engineering-ngspice/merlin_import.FCMacro
          test -s artifacts/engineering-ngspice/merlin_project.FCStd
          test -s artifacts/engineering-ngspice/merlin_project.step
          test -s artifacts/engineering-ngspice/freecad_document_export.FCMacro
          test -s artifacts/engineering-ngspice/freecad-mesh.json
          test -s artifacts/engineering-ngspice/freecad-registration.json
          test -s artifacts/engineering-ngspice/ngspice-result.json
          test -s artifacts/engineering-ngspice/canonical-registry/merlin.sqlite3
          test -s artifacts/engineering-ngspice/canonical-graph.sqlite3
          echo "engineering_integration=PASS"

      - name: Upload reproducible engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-engineering-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/engineering-ngspice/
          if-no-files-found: warn
          retention-days: 14
