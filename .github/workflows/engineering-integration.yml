name: Merlin Engineering Integration

on:
  workflow_dispatch:
  push:
    branches:
      - "repair/cace-bridge-request-isolation-20261105"
    paths:
      - "python/merlin/engineering_ir.py"
      - "python/merlin/freecad_bridge.py"
      - "python/merlin/freecad_document_bridge.py"
      - "python/merlin/project_registry.py"
      - "python/merlin/knowledge_graph.py"
      - "python/merlin/ngspice_engine.py"
      - "scripts/run_engineering_ngspice_smoke.py"
      - ".github/workflows/engineering-integration.yml"

permissions:
  contents: read

jobs:
  engineering-smoke:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 15
    steps:
      - name: Check out exact Expert Robot commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ngspice and FreeCAD command-line tools when absent
        shell: bash
        run: |
          set -euo pipefail
          need_install=0
          command -v ngspice >/dev/null 2>&1 || need_install=1
          command -v FreeCADCmd >/dev/null 2>&1 || command -v freecadcmd >/dev/null 2>&1 || need_install=1
          if [ "$need_install" = "1" ]; then
            sudo apt-get update
            sudo apt-get install -y ngspice freecad
          fi
          command -v ngspice
          command -v prlimit
          ngspice --version | head -n 4
          freecad_cmd="$(command -v FreeCADCmd || command -v freecadcmd || true)"
          if [ -z "$freecad_cmd" ]; then
            freecad_cmd="$(find /usr/lib/freecad /usr/bin -type f \\( -name FreeCADCmd -o -name freecadcmd \\) -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$freecad_cmd" ]; then
            echo "::error::FreeCADCmd/freecadcmd was not installed."
            exit 1
          fi
          echo "FREECAD_CMD=$freecad_cmd" >> "$GITHUB_ENV"
          echo "FreeCAD command: $freecad_cmd"
          if ! command -v FreeCADCmd >/dev/null 2>&1 && ! command -v freecadcmd >/dev/null 2>&1; then
            available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
            if [ "$available_kb" -ge 4194304 ]; then
              sudo apt-get install -y freecad || echo "FreeCAD package installation failed; macro generation remains enabled"
            else
              echo "FreeCAD runtime install skipped: less than 4 GiB free on Avrea runner"
            fi
          fi
          if command -v FreeCADCmd >/dev/null 2>&1 || command -v freecadcmd >/dev/null 2>&1; then
            echo "FreeCAD command-line runtime available"
          else
            echo "FreeCAD runtime unavailable; macro generation will be verified"
          fi

      - name: Run Engineering IR, FreeCAD macro and bounded ngspice integration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python python3 scripts/run_engineering_ngspice_smoke.py artifacts/engineering-ngspice
          python3 -m json.tool artifacts/engineering-ngspice/manifest.json >/dev/null
          test -s artifacts/engineering-ngspice/merlin_import.FCMacro
          test -s artifacts/engineering-ngspice/merlin_project.FCStd
          test -s artifacts/engineering-ngspice/merlin_project.step
          test -s artifacts/engineering-ngspice/freecad_document_export.FCMacro
          test -s artifacts/engineering-ngspice/freecad-mesh.json
          test -s artifacts/engineering-ngspice/freecad-registration.json
          test -s artifacts/engineering-ngspice/ngspice-result.json
          test -s artifacts/engineering-ngspice/canonical-registry/merlin.sqlite3
          test -s artifacts/engineering-ngspice/canonical-graph.sqlite3
          echo "engineering_integration=PASS"

      - name: Upload reproducible engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-engineering-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/engineering-ngspice/
          if-no-files-found: warn
          retention-days: 14
