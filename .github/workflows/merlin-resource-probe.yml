name: Merlin runner resource probe

on:
  push:
    branches: ["feat/merlin-real-world-equation-atlas-v01-20261104"]
    paths:
      - "scripts/merlin_resource_probe.py"
      - "python/merlin/cpu_fabric/leases.py"
      - ".github/workflows/merlin-resource-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-resource-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record runner capacity without downloading models
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merlin_resource_probe.py --output artifacts/runner-inventory/capacity.json
          cat artifacts/runner-inventory/capacity.json

      - name: Publish runner inventory
        uses: actions/upload-artifact@v4
        with:
          name: merlin-runner-inventory
          path: artifacts/runner-inventory/capacity.json
          retention-days: 7
