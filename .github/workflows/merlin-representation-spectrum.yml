name: Merlin Representation Spectrum Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "merlin/representation_spectrum.py"
      - "tests/test_merlin_representation_spectrum.py"
      - "python/merlin/learner_model.py"
      - "python/merlin/app.py"
      - "tests/test_learner_model.py"
      - "tests/research/test_merlin_api.py"
      - "docs/merlin/MATH_KUNG_FU_ROTATION_LESSON_V0_1.html"
      - "docs/merlin/MERLIN_ART_MATH_STUDIO_CURRICULUM_V0_1.md"
      - "docs/merlin/MERLIN_ART_SKILL_GRAPH_V0_1.json"
      - "docs/merlin/MERLIN_ART_MATH_SYMMETRY_STUDIO_V0_1.html"
      - "docs/research/merlin-mathematical-idea-catalog.v1.json"
      - ".github/workflows/merlin-representation-spectrum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rational-generalized-eigenspaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record runner and commit
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf 'commit=%s\nrun_id=%s\nrunner=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_NAME" | tee artifacts/runner.log
      - name: Run exact generalized eigenspace tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_merlin_representation_spectrum.py" -v 2>&1 | tee artifacts/generalized-eigenspace-tests.log
          code=${PIPESTATUS[0]}
          printf '{"commit":"%s","run_id":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$code" > artifacts/result.json
          exit "$code"
      - name: Run learner model and Hermes routing tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_learner_model.py" -v 2>&1 | tee artifacts/learner-model-tests.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Run Merlin learning API integration tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests/research -p "test_merlin_api.py" -v 2>&1 | tee artifacts/learning-api-tests.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Compile learning and spectrum services
        shell: bash
        run: |
          set +e
          python3 -m py_compile merlin/representation_spectrum.py python/merlin/learner_model.py python/merlin/app.py 2>&1 | tee artifacts/compile.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-spectrum-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
