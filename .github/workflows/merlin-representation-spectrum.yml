name: Merlin Representation Spectrum Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "merlin/representation_spectrum.py"
      - "tests/test_merlin_representation_spectrum.py"
      - ".github/workflows/merlin-representation-spectrum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rational-generalized-eigenspaces:
    runs-on: avrea-ubuntu-latest-8-vcpu
    steps:
      - uses: actions/checkout@v4
      - name: Record runner and commit
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf 'commit=%s\nrun_id=%s\nrunner=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_NAME" | tee artifacts/runner.log
      - name: Run exact generalized eigenspace tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_merlin_representation_spectrum.py" -v 2>&1 | tee artifacts/generalized-eigenspace-tests.log
          code=${PIPESTATUS[0]}
          printf '{"commit":"%s","run_id":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$code" > artifacts/result.json
          exit "$code"
      - name: Compile spectrum module
        shell: bash
        run: |
          set +e
          python3 -m py_compile merlin/representation_spectrum.py 2>&1 | tee artifacts/compile.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-spectrum-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
