name: Avrea Offline Receipt Qualification (No Promotion)

on:
  pull_request:
    paths:
      - '.github/workflows/avrea-offline-receipt-qualification.yml'
      - 'scripts/run_autonomous_research_cycle.py'
      - 'scripts/verify_autonomous_research_receipt.py'
      - 'tests/autonomous_research_operations_smoke.py'
      - 'tests/test_receipt_verifier.py'
      - 'tests/cace_avrea_research_gate_smoke.py'
      - '.github/workflows/cace-biochemical-diffusion.yml'
      - '.github/workflows/external-free-runner-bridge.yml'
      - 'config/avrea_half_month_budget.json'
      - 'scripts/check_avrea_halfmonth_budget.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: expert-robot-avrea-half-month-slot
  cancel-in-progress: false

jobs:
  receipt-qualification:
    if: github.repository == 'Mannyspiro/expert-robot'
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_avrea_halfmonth_budget.py \
            --reserve-minutes 5 \
            --runner-label avrea-ubuntu-latest-8-vcpu
      - name: Verify pinned checkout and run bounded local checks
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python3 tests/autonomous_research_operations_smoke.py
          python3 tests/cace_avrea_research_gate_smoke.py
          python3 -m unittest discover -v -s tests -p 'test_receipt_verifier.py'
          mkdir -p avrea-receipt-artifacts
          python3 scripts/run_autonomous_research_cycle.py \
            --source-commit "$SOURCE_HEAD" \
            -o avrea-receipt-artifacts/research-episode.json
          python3 scripts/verify_autonomous_research_receipt.py \
            --root . \
            --receipt avrea-receipt-artifacts/research-episode.json \
            --source-commit "$SOURCE_HEAD" \
            | tee avrea-receipt-artifacts/structural-audit.json
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avrea-offline-receipt-${{ github.run_id }}
          path: avrea-receipt-artifacts/
          retention-days: 14
          if-no-files-found: warn
