name: Research metadata tests

on:
  pull_request:
    paths:
      - "python/merlin/research_sources.py"
      - "tests/research_sources_smoke.py"
      - ".github/workflows/research-metadata-tests.yml"
  push:
    branches:
      - "feat/research-metadata-cache"
    paths:
      - "python/merlin/research_sources.py"
      - "tests/research_sources_smoke.py"
      - ".github/workflows/research-metadata-tests.yml"

permissions:
  contents: read

jobs:
  offline-metadata-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile metadata client
        run: python -m py_compile python/merlin/research_sources.py tests/research_sources_smoke.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'research_sources_smoke.py' -v
