name: Merlin bounded real Qwen capability training

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/merlin/train_local_capability.py'
      - 'config/merlin/model-training/**'
      - '.github/workflows/merlin-capability-training.yml'

permissions:
  contents: read

concurrency:
  group: merlin-capability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  train-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 195
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONHASHSEED: '1701'
      OMP_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '40'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU model training libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install --disable-pip-version-check 'transformers==4.51.3' 'peft==0.15.2' 'accelerate==1.6.0' 'huggingface_hub==0.30.2' 'safetensors==0.5.3'
      - name: Validate disjoint synthetic training and holdout
        run: |
          python -m py_compile scripts/merlin/train_local_capability.py
          python tests/test_merlin_android_candidate_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/merlin/model-training/capability_v2.json').read_text())
          tr={r['prompt'] for r in d['train']}
          ho={r['prompt'] for r in d['holdout']}
          assert tr.isdisjoint(ho) and len(tr)>=60 and len(ho)>=25
          print('PASS: train/holdout prompts disjoint')
          PY
      - name: Actual Qwen 0.5B LoRA fine-tuning and independently held-out comparison
        run: |
          set -euo pipefail
          mkdir -p training-evidence
          python scripts/merlin/train_local_capability.py --dataset config/merlin/model-training/capability_v2.json --output training-evidence/result --steps 63
      - name: Preserve full evidence and adapter separately; never publish baseline weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-qwen05-capability-trained-candidate
          path: training-evidence/
          retention-days: 7
          if-no-files-found: warn
