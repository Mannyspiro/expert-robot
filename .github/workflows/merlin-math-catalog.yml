name: Merlin Mathematical Idea Catalog

on:
  push:
    paths:
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_LEDGER_V0.1.md"
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_INTAKE.md"
      - "docs/research/merlin-mathematical-idea-catalog.v1.json"
      - "docs/research/MERLIN_MULTI_REPRESENTATION_GEOMETRY_V0.1.md"
      - "docs/research/MERLIN_ARCHIVED_MATH_CLAIM_AUDIT_V0.1.md"
      - "merlin/representation_graph.py"
      - "merlin/rotation_representations.py"
      - "merlin/spherical_holonomy.py"
      - "scripts/merlin_math_idea_validate.py"
      - "tests/test_merlin_math_idea_validate.py"
      - "tests/test_merlin_representation_graph.py"
      - "tests/test_merlin_rotation_representations.py"
      - "tests/test_merlin_spherical_holonomy.py"
      - ".github/workflows/merlin-math-catalog.yml"
  pull_request:
    paths:
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_LEDGER_V0.1.md"
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_INTAKE.md"
      - "docs/research/merlin-mathematical-idea-catalog.v1.json"
      - "docs/research/MERLIN_MULTI_REPRESENTATION_GEOMETRY_V0.1.md"
      - "docs/research/MERLIN_ARCHIVED_MATH_CLAIM_AUDIT_V0.1.md"
      - "merlin/representation_graph.py"
      - "scripts/merlin_math_idea_validate.py"
      - "tests/test_merlin_math_idea_validate.py"
      - "tests/test_merlin_representation_graph.py"
      - ".github/workflows/merlin-math-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merlin-math-catalog-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate-catalog:
    runs-on: avrea-ubuntu-latest-8-vcpu
    steps:
      - uses: actions/checkout@v4
      - name: Record runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            nproc
          } | tee artifacts/runner-identity.log
      - name: Validate stable IDs and typed relations
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python3 scripts/merlin_math_idea_validate.py 2>&1 | tee artifacts/math-catalog-validation.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"math-catalog-validation","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/math-catalog-validation-result.json
          exit "$test_exit"
      - name: Test catalog validator
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_merlin_math_idea_validate.py" -v 2>&1 | tee artifacts/math-catalog-validator-tests.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"math-catalog-validator-tests","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/math-catalog-validator-tests-result.json
          exit "$test_exit"
      - name: Test exact multi-representation algebra
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_merlin_representation_graph.py" -v 2>&1 | tee artifacts/math-representation-graph-tests.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"math-representation-graph-tests","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/math-representation-graph-tests-result.json
          exit "$test_exit"
      - name: Test quaternion and Cl(3,0) rotor correspondence
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_merlin_rotation_representations.py" -v 2>&1 | tee artifacts/math-rotation-representations-tests.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"math-rotation-representations-tests","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/math-rotation-representations-tests-result.json
          exit "$test_exit"
      - name: Test spherical curvature and holonomy
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_merlin_spherical_holonomy.py" -v 2>&1 | tee artifacts/math-spherical-holonomy-tests.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"math-spherical-holonomy-tests","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/math-spherical-holonomy-tests-result.json
          exit "$test_exit"
      - name: Compile mathematical representation modules
        shell: bash
        run: |
          set +e
          python3 -m py_compile merlin/representation_graph.py merlin/rotation_representations.py merlin/spherical_holonomy.py 2>&1 | tee artifacts/math-representation-compile.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"math-representation-compile","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/math-representation-compile-result.json
          exit "$test_exit"
      - name: Record workflow evidence manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          keys = ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF", "GITHUB_EVENT_NAME",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW", "RUNNER_NAME")
          payload = {key.lower(): os.environ.get(key, "") for key in keys}
          payload["job_status"] = os.environ.get("JOB_STATUS", "unknown")
          with open("artifacts/math-catalog-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True, indent=2)
              handle.write("\\n")
          PY
      - name: Upload mathematical catalog logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-math-catalog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
