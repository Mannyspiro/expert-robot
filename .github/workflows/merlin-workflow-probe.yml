name: Merlin Workflow Parser Probe

on:
  push:
    branches:
      - "feat/hermes-routing-eval-avrea-discovery-20261105"
    paths:
      - ".github/workflows/merlin-workflow-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 3
    steps:
      - name: Record workflow parser and runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "workflow=$GITHUB_WORKFLOW"
          echo "commit=$GITHUB_SHA"
          echo "run_id=$GITHUB_RUN_ID"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          echo "runner=$RUNNER_NAME"
          echo "runner_arch=$RUNNER_ARCH"
          uname -a
