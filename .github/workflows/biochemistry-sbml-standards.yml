name: SBML Biochemical Standards Check

on:
  pull_request:
    paths:
      - "scripts/experiment_sbml_stoichiometry_subset.py"
      - "scripts/experiment_sbml_solver_crosscheck.py"
      - ".github/workflows/biochemistry-sbml-standards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbml-structural-and-libsbml-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate synthetic L3V2 enzyme kinetics SBML and mutation tests
        run: python3 scripts/experiment_sbml_stoichiometry_subset.py --sbml /tmp/biochemistry-enzyme-l3v2.xml --report /tmp/biochemistry-sbml-report.json
      - name: Check SBML with independent pinned libSBML implementation
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'python-libsbml==5.21.2'
          python3 - <<'PY'
          import json
          import libsbml
          path="/tmp/biochemistry-enzyme-l3v2.xml"
          document=libsbml.SBMLReader().readSBML(path)
          issues=[]
          document.checkConsistency()
          for i in range(document.getNumErrors()):
              issue=document.getError(i)
              if issue.getSeverity()>=libsbml.LIBSBML_SEV_ERROR:
                  issues.append({"id":issue.getErrorId(),"message":issue.getMessage()[:250]})
          record=json.load(open("/tmp/biochemistry-sbml-report.json",encoding="utf-8"))
          assert record["mutations_rejected"]==3
          assert record["kinetic_expressions_preserved"] is True
          assert record["enzyme_conservation"] and record["substrate_moiety_conservation"]
          if issues:
              print("Independent libSBML validation blocked:",json.dumps(issues))
              raise SystemExit(1)
          model=document.getModel()
          assert model.getNumSpecies()==4 and model.getNumReactions()==3
          assert all(model.getReaction(i).isSetKineticLaw() for i in range(3))
          print("Independent libSBML Level3V2 validation PASS; synthetic parameters only")
          PY
      - name: Independently compare libSBML kinetics and two numerical solvers
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'scipy==1.18.1'
          python3 scripts/experiment_sbml_solver_crosscheck.py --sbml /tmp/biochemistry-enzyme-l3v2.xml -o /tmp/biochemistry-solver-crosscheck.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/biochemistry-solver-crosscheck.json",encoding="utf-8"))
          assert d["total_solution_samples"]==243
          assert d["missing_product_mutant_detected"] is True
          assert d["real_biomodel_reproduced"] is False
          assert d["authority_expanded"] is False
          print("Independent synthetic ODE cross-check PASS")
          PY
      - name: Retain validated model and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-biochemistry-sbml
          path: |
            /tmp/biochemistry-enzyme-l3v2.xml
            /tmp/biochemistry-sbml-report.json
            /tmp/biochemistry-solver-crosscheck.json
          retention-days: 30
          if-no-files-found: warn
