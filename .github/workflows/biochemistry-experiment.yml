name: Biochemistry Conservation and Counterexamples

on:
  pull_request:
    paths:
      - "scripts/experiment_biochemistry_stoichiometry.py"
      - "scripts/experiment_biochemistry_equilibrium.py"
      - "docs/biochemistry-research-program.md"
      - ".github/workflows/biochemistry-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-biochemistry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently replay synthetic conservation experiment
        run: python3 scripts/experiment_biochemistry_stoichiometry.py -o /tmp/biochemistry-stoichiometry.json
      - name: Test zero-interior-equilibrium claim and weakened-assumption counterexamples
        run: python3 scripts/experiment_biochemistry_equilibrium.py -o /tmp/biochemistry-equilibrium.json
      - name: Check experiment reports no physical or authority claims
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/biochemistry-stoichiometry.json",encoding="utf-8"))
          assert d["exact_euler_steps"] == 24
          assert d["rank"] == 2 and d["left_nullity"] == 2
          assert d["mutation_detected"] is True
          for key in ("empirical_biochemical_parameters","quantified_runtime_speedup",
                      "direct_cace_backend_executed","biological_prediction_verified",
                      "promotion_or_authority_expanded"):
              assert d[key] is False, key
          assert d["network_operations"] == 0
          g=json.load(open("/tmp/biochemistry-equilibrium.json",encoding="utf-8"))
          assert g["positive_parameter_grid_evaluations"] == 6400
          assert g["positive_parameter_grid_equilibria"] == 0
          assert len(g["necessary_hypotheses_boundary_witnesses"]) == 4
          assert g["dropped_equation_mutant_detected"] is True
          assert g["mathematical_generalization_proved_by_this_script"] is False
          assert g["empirical_biochemistry_claimed"] is False
          assert g["authority_expanded"] is False
          print("Synthetic stoichiometry and equilibrium boundary claims PASS")
          PY
      - name: Retain synthetic exact arithmetic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biochemistry-exact-arithmetic
          path: |
            /tmp/biochemistry-stoichiometry.json
            /tmp/biochemistry-equilibrium.json
          retention-days: 30
