name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: avrea-ubuntu-latest-8-vcpu

    steps:
      - uses: actions/checkout@v4

      - name: Detect parallelism
        id: cores
        shell: bash
        run: |
          set -euo pipefail
          detected="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
          if [ "$detected" -gt 32 ]; then detected=32; fi
          if [ "$detected" -lt 1 ]; then detected=1; fi
          echo "jobs=$detected" >> "$GITHUB_OUTPUT"
          echo "Detected $detected build/test workers"
          lscpu || true
          free -h || true

      - name: Shell preflight syntax
        run: bash -n scripts/*.sh

      - name: Configure
        run: |
          cmake -S . -B build             -G Ninja             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: C++ tests
        env:
          CTEST_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: |
          ctest             --test-dir build             --parallel "${CTEST_PARALLEL_LEVEL}"             --output-on-failure

      - name: Compute policy guardrails
        run: python3 tests/compute_policy_smoke.py

      - name: Known failure regression guardrails
        run: python3 tests/known_failure_regression_smoke.py

      - name: Formal dependency lock
        run: python3 tests/formal_dependency_lock_smoke.py

      - name: CACE return bridge guardrails
        run: python3 tests/cace_return_bridge_smoke.py

      - name: CACE tool broker guardrails
        run: python3 tests/cace_tool_broker_smoke.py

      - name: CACE tool routing guardrails
        run: python3 tests/cace_tool_routing_smoke.py

      - name: Independent smoke tests
        shell: bash
        run: |
          set -euo pipefail

          python3 tests/smoke.py ./build/expert_robot_runtime &
          smoke_pid=$!

          python3 python/orchestrator.py             --runtime ./build/expert_robot_runtime             --role math             --task "health check" &
          orchestrator_pid=$!

          wait "$smoke_pid"
          wait "$orchestrator_pid"
