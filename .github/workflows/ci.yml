name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: avrea-ubuntu-latest-32-vcpu
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: C++ runtime smoke test
        run: python3 tests/smoke.py ./build/expert_robot_runtime

      - name: Python orchestrator smoke test
        run: python3 python/orchestrator.py --runtime ./build/expert_robot_runtime --role math --task "health check"
