name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: avrea-ubuntu-latest-8-vcpu

    steps:
      - uses: actions/checkout@v4

      - name: Restore C++ compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare ccache
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=max_size=2G
            ccache --zero-stats
            echo "EXPERT_ROBOT_CCACHE=1" >> "$GITHUB_ENV"
          else
            echo "ccache unavailable; continuing without compiler cache"
            echo "EXPERT_ROBOT_CCACHE=0" >> "$GITHUB_ENV"
          fi

      - name: Detect parallelism
        id: cores
        shell: bash
        run: |
          set -euo pipefail
          detected="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
          if [ "$detected" -gt 32 ]; then detected=32; fi
          if [ "$detected" -lt 1 ]; then detected=1; fi
          echo "jobs=$detected" >> "$GITHUB_OUTPUT"
          echo "Detected $detected build/test workers"
          lscpu || true
          free -h || true

      - name: Shell preflight syntax
        run: bash -n scripts/*.sh

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ "${EXPERT_ROBOT_CCACHE:-0}" = "1" ]; then
            args+=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake "${args[@]}"

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: C++ tests
        env:
          CTEST_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: |
          ctest             --test-dir build             --parallel "${CTEST_PARALLEL_LEVEL}"             --output-on-failure

      - name: Compute policy guardrails
        run: python3 tests/compute_policy_smoke.py

      - name: Merlin opportunity intelligence and procurement readiness tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_opportunity_intelligence.py" -v 2>&1 | tee artifacts/merlin-opportunity-intelligence-tests.log
          rc_opportunity=${PIPESTATUS[0]}
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_procurement_readiness.py" -v 2>&1 | tee -a artifacts/merlin-opportunity-intelligence-tests.log
          rc_readiness=${PIPESTATUS[0]}
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_source_status.py" -v 2>&1 | tee -a artifacts/merlin-opportunity-intelligence-tests.log
          rc_source_status=${PIPESTATUS[0]}
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_partner_qualification.py" -v 2>&1 | tee -a artifacts/merlin-opportunity-intelligence-tests.log
          rc_partner=${PIPESTATUS[0]}
          PYTHONPATH=python python3 -m unittest discover -s tests -p "test_partner_evidence_pipeline.py" -v 2>&1 | tee -a artifacts/merlin-opportunity-intelligence-tests.log
          rc_pipeline=${PIPESTATUS[0]}
          set -e
          if [ "$rc_opportunity" -ne 0 ] || [ "$rc_readiness" -ne 0 ] || [ "$rc_source_status" -ne 0 ] || [ "$rc_partner" -ne 0 ] || [ "$rc_pipeline" -ne 0 ]; then rc=1; else rc=0; fi
          printf '{"suite":"merlin-opportunity-intelligence-partner-evidence-pipeline","opportunity_exit_code":%s,"readiness_exit_code":%s,"source_status_exit_code":%s,"partner_exit_code":%s,"pipeline_exit_code":%s,"exit_code":%s,"commit":"%s"}\\n' "$rc_opportunity" "$rc_readiness" "$rc_source_status" "$rc_partner" "$rc_pipeline" "$rc" "$GITHUB_SHA" > artifacts/merlin-opportunity-intelligence-result.json
          exit "$rc"

      - name: Upload opportunity intelligence test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-opportunity-intelligence-${{ github.run_id }}
          path: artifacts/merlin-opportunity-intelligence-*
          if-no-files-found: warn

      - name: Known failure regression guardrails
        run: python3 tests/known_failure_regression_smoke.py

      - name: Benchmark progression guardrails
        run: |
          python3 tests/benchmark_baseline_smoke.py
          python3 tests/progression_benchmark_smoke.py
          python3 tests/progression_baseline_integrity_smoke.py
          python3 tests/progression_freezer_smoke.py

      - name: Formal dependency lock
        run: python3 tests/formal_dependency_lock_smoke.py

      - name: CACE return bridge guardrails
        run: python3 tests/cace_return_bridge_smoke.py

      - name: Collar policy guardrails
        run: |
          python3 tests/collar_policy_smoke.py
          python3 tests/collar_runtime_contract_smoke.py

      - name: Collar encrypted-core smoke
        run: bash tests/collar_vault_smoke.sh

      - name: Independent smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/smoke.py ./build/expert_robot_runtime
          python3 tests/research_cli_contract_smoke.py

      - name: Show ccache stats
        if: always()
        shell: bash
        run: |
          if [ "${EXPERT_ROBOT_CCACHE:-0}" = "1" ]; then
            ccache --show-stats || true
          fi

      - name: Save C++ compiler cache
        if: ${{ success() && github.event_name != 'pull_request' && env.EXPERT_ROBOT_CCACHE == '1' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  partner-evidence-tests:
    name: Partner evidence and proposal pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run partner suites and retain evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          rc=0
          for pattern in test_opportunity_intelligence.py test_procurement_readiness.py test_source_status.py test_partner_qualification.py test_partner_evidence_pipeline.py; do
            echo "===== $pattern =====" | tee -a artifacts/merlin-partner-evidence-tests.log
            PYTHONPATH=python python -m unittest discover -s tests -p "$pattern" -v 2>&1 | tee -a artifacts/merlin-partner-evidence-tests.log
            suite_rc=${PIPESTATUS[0]}
            printf '%s=%s\\n' "$pattern" "$suite_rc" >> artifacts/merlin-partner-evidence-exit-codes.txt
            if [ "$suite_rc" -ne 0 ]; then rc=1; fi
          done
          printf '{"suite":"merlin-partner-evidence-pipeline","exit_code":%s,"commit":"%s"}\\n' "$rc" "$GITHUB_SHA" > artifacts/merlin-partner-evidence-result.json
          exit "$rc"
      - name: Upload partner test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-partner-evidence-${{ github.run_id }}
          path: artifacts/merlin-partner-evidence-*
          if-no-files-found: warn
