name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
      - ".github/workflows/cace-headless-local-integration.yml"
      - ".github/workflows/cace-local-runtime-discovery.yml"
      - ".github/workflows/free-runner-capability-probe.yml"
      - "integration/cace/**"
      - "config/cace_headless_local.json"
      - "python/cace_headless.py"
      - "tests/cace_headless_client_smoke.py"
      - "tests/orchestrator_cace_headless_smoke.py"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
      - ".github/workflows/cace-headless-local-integration.yml"
      - ".github/workflows/cace-local-runtime-discovery.yml"
      - ".github/workflows/free-runner-capability-probe.yml"
      - "integration/cace/**"
      - "config/cace_headless_local.json"
      - "python/cace_headless.py"
      - "tests/cace_headless_client_smoke.py"
      - "tests/orchestrator_cace_headless_smoke.py"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      heavy_required: \${{ steps.classify.outputs.heavy_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify incremental change
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          import pathlib
          import subprocess

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          action = event.get("action", "")

          before = None
          after = None

          if event_name == "push":
              before = event.get("before")
              after = event.get("after")
          elif event_name == "pull_request":
              if action == "synchronize":
                  before = event.get("before")
                  after = event.get("after")
              if not before or not after:
                  pr = event.get("pull_request", {})
                  before = (pr.get("base") or {}).get("sha")
                  after = (pr.get("head") or {}).get("sha")

          if event_name == "workflow_dispatch":
              heavy = True
              changed = ["<manual-dispatch>"]
          elif not before or not after or set(before) == {"0"}:
              heavy = True
              changed = ["<unable-to-resolve-incremental-range>"]
          else:
              subprocess.run(["git", "fetch", "--no-tags", "origin", before, after], check=False)
              proc = subprocess.run(
                  ["git", "diff", "--name-only", f"{before}..{after}"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if proc.returncode != 0:
                  heavy = True
                  changed = ["<git-diff-failed>"]
              else:
                  changed = [line.strip() for line in proc.stdout.splitlines() if line.strip()]
                  cheap_exact = {
                      ".github/workflows/cace-headless-local-integration.yml",
                      ".github/workflows/cace-local-runtime-discovery.yml",
                      ".github/workflows/free-runner-capability-probe.yml",
                      "config/cace_headless_local.json",
                      "python/cace_headless.py",
                      "tests/cace_headless_client_smoke.py",
                      "tests/orchestrator_cace_headless_smoke.py",
                  }
                  cheap_prefixes = (
                      "integration/cace/",
                      "docs/",
                  )

                  def cheap(path: str) -> bool:
                      return path in cheap_exact or path.startswith(cheap_prefixes)

                  heavy = not changed or any(not cheap(path) for path in changed)

          print("Incremental changed paths:")
          for path in changed:
              print(f"  {path}")
          print(f"heavy_required={str(heavy).lower()}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"heavy_required={str(heavy).lower()}\n")
          PY

  build-and-smoke:
    needs: classify
    if: needs.classify.outputs.heavy_required == 'true'
    runs-on: avrea-ubuntu-latest-8-vcpu

    steps:
      - uses: actions/checkout@v4

      - name: Detect parallelism
        id: cores
        shell: bash
        run: |
          set -euo pipefail
          detected="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
          if [ "$detected" -gt 32 ]; then detected=32; fi
          if [ "$detected" -lt 1 ]; then detected=1; fi
          echo "jobs=$detected" >> "$GITHUB_OUTPUT"
          echo "Detected $detected build/test workers"
          lscpu || true
          free -h || true

      - name: Shell preflight syntax
        run: bash -n scripts/*.sh

      - name: Configure
        run: |
          cmake -S . -B build             -G Ninja             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: C++ tests
        env:
          CTEST_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: |
          ctest             --test-dir build             --parallel "${CTEST_PARALLEL_LEVEL}"             --output-on-failure

      - name: Compute policy guardrails
        run: python3 tests/compute_policy_smoke.py

      - name: Known failure regression guardrails
        run: python3 tests/known_failure_regression_smoke.py

      - name: Formal dependency lock
        run: python3 tests/formal_dependency_lock_smoke.py

      - name: CACE return bridge guardrails
        run: python3 tests/cace_return_bridge_smoke.py

      - name: CACE tool broker guardrails
        run: python3 tests/cace_tool_broker_smoke.py

      - name: Independent smoke tests
        shell: bash
        run: |
          set -euo pipefail

          python3 tests/smoke.py ./build/expert_robot_runtime &
          smoke_pid=$!

          python3 python/orchestrator.py             --runtime ./build/expert_robot_runtime             --role math             --task "health check" &
          orchestrator_pid=$!

          wait "$smoke_pid"
          wait "$orchestrator_pid"
