name: CI

on:
  push:
    branches: ["main", "feat/merlin-lean-proof-optimization-atlas-20261104", "feat/hermes-routing-eval-avrea-discovery-20261105", "repair/cace-bridge-request-isolation-20261105", "repair/merlin-full-integration-20261105", "feat/merlin-universal-research-school-v01-20261105", "feat/merlin-zero-first-math-learning-core-20261111"]
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_LEDGER_V0.1.md"
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_INTAKE.md"
      - "docs/research/merlin-mathematical-idea-catalog.v1.json"
      - "scripts/merlin_math_idea_validate.py"
      - "tests/test_merlin_math_idea_validate.py"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_LEDGER_V0.1.md"
      - "docs/research/MERLIN_MATHEMATICAL_IDEA_INTAKE.md"
      - "docs/research/merlin-mathematical-idea-catalog.v1.json"
      - "scripts/merlin_math_idea_validate.py"
      - "tests/test_merlin_math_idea_validate.py"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: avrea-ubuntu-latest-8-vcpu

    steps:
      - uses: actions/checkout@v4
      - name: Record runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_environment=$RUNNER_ENVIRONMENT"
            uname -a
            nproc
          } | tee artifacts/runner-identity.txt

      - name: Focused Python group 1 — Hermes claim routing
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m pip install pytest 2>&1 | tee artifacts/pytest-install.log
          python3 -m pytest -q tests/test_hermes_claim_routing.py 2>&1 | tee artifacts/focused-python-group-1.log

      - name: Focused Python group 2 — proof orchestrator and CACE adapter
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m pytest -q tests/test_hermes_proof_orchestrator.py tests/test_cace_adapter.py 2>&1 | tee artifacts/focused-python-group-2.log
          python3 tests/cace_optional_verifier_smoke.py 2>&1 | tee artifacts/cace-optional-verifier-smoke.log

      - name: Focused Python group 3 — research lifecycle
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m pytest -q tests/test_research_lifecycle.py 2>&1 | tee artifacts/focused-python-group-3.log


      - name: Merlin engineered prompt contract tests
        env:
          PYTHONPATH: python
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python3 -m unittest discover -s tests -p "test_merlin_prompt_contract.py" -v 2>&1 | tee artifacts/merlin-prompt-contract.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"merlin-prompt-contract","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/merlin-prompt-contract-result.json
          exit "$test_exit"

      - name: Merlin universal research curriculum tests
        env:
          PYTHONPATH: python
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python3 -m pytest -q tests/test_merlin_research_curriculum.py -v 2>&1 | tee artifacts/merlin-research-curriculum.log
          test_exit=${PIPESTATUS[0]}
          printf '{"suite":"merlin-research-curriculum","commit":"%s","run_id":"%s","run_attempt":"%s","exit_code":%s}\\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$test_exit" > artifacts/merlin-research-curriculum-result.json
          exit "$test_exit"

      - name: Merlin zero-first mathematics learning core
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_merlin_learning_core.py" -v

      - name: Merlin Parrondo paradox lesson
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_merlin_parrondo_lesson.py" -v

      - name: Merlin Parrondo reproducible simulation and learner session
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_merlin_parrondo_simulation.py" -v

      - name: Merlin concurrent council runtime tests
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_council_runtime.py" -v



      - name: Merlin measured model fabric routing contracts
        env:
          PYTHONPATH: python
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_model_fabric.py" -v

      - name: Restore C++ compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare ccache
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            mkdir -p "$HOME/.cache/ccache"
            ccache --set-config=max_size=2G
            ccache --zero-stats
            echo "EXPERT_ROBOT_CCACHE=1" >> "$GITHUB_ENV"
          else
            echo "ccache unavailable; continuing without compiler cache"
            echo "EXPERT_ROBOT_CCACHE=0" >> "$GITHUB_ENV"
          fi

      - name: Detect parallelism
        id: cores
        shell: bash
        run: |
          set -euo pipefail
          detected="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
          if [ "$detected" -gt 32 ]; then detected=32; fi
          if [ "$detected" -lt 1 ]; then detected=1; fi
          echo "jobs=$detected" >> "$GITHUB_OUTPUT"
          echo "Detected $detected build/test workers"
          lscpu || true
          free -h || true

      - name: Shell preflight syntax
        run: bash -n scripts/*.sh

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ "${EXPERT_ROBOT_CCACHE:-0}" = "1" ]; then
            args+=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake "${args[@]}"

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: C++ tests
        env:
          CTEST_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: |
          ctest             --test-dir build             --parallel "${CTEST_PARALLEL_LEVEL}"             --output-on-failure

      - name: Compute policy guardrails
        run: python3 tests/compute_policy_smoke.py

      - name: Known failure regression guardrails
        run: python3 tests/known_failure_regression_smoke.py

      - name: Benchmark progression guardrails
        run: |
          python3 tests/benchmark_baseline_smoke.py
          python3 tests/progression_benchmark_smoke.py
          python3 tests/progression_baseline_integrity_smoke.py
          python3 tests/progression_freezer_smoke.py

      - name: Formal dependency lock
        run: python3 tests/formal_dependency_lock_smoke.py

      - name: Merlin deterministic research and API contracts
        run: python3 -m unittest discover -s tests/research -v
      - name: Merlin glyph Foundry, normalizer and confluence tests
        run: |
          python3 -m unittest discover -s tests -p "test_glyph_foundry.py" -v
          python3 -m unittest discover -s tests -p "test_glyph_normalizer.py" -v
          python3 -m unittest discover -s tests -p "test_glyph_confluence.py" -v

      - name: Merlin media, drafting and council contracts
        env:
          PYTHONPATH: python
        run: |
          python3 -m unittest discover -s tests -p "test_media_and_drafting.py" -v
          python3 -m unittest discover -s tests -p "test_research_council.py" -v
          python3 -m unittest discover -s tests -p "test_project_registry.py" -v
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_knowledge_graph.py tests/test_foundation_store.py tests/test_archive_intake.py

      - name: Merlin equation-atlas symbolic, dimensional and numerical checks
        env:
          PYTHONPATH: python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-equation-atlas.txt
          python3 -m merlin.equation_atlas.dimensions
          python3 -m merlin.equation_atlas.symbolic_checks
          python3 -m unittest discover -s tests -p "test_merlin_simulation_engine.py" -v
          python3 -m unittest discover -s tests -p "test_merlin_composed_models.py" -v
          mkdir -p artifacts
          python3 -m merlin.equation_atlas.experiments.baseline > artifacts/equation-atlas-baseline.json
          python3 -m merlin.equation_atlas.normalize
          cp docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_001-080_V0.3.json artifacts/equation-atlas-normalized-entries-001-080.json
          python3 -m merlin.equation_atlas.receipts --artifact artifacts/equation-atlas-baseline.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_001-020.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_021-030.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_031-040.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_041-050.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_051-060.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_061-070.json --source docs/research/real-world-equation-atlas/NORMALIZED_ENTRIES_071-080.json --source docs/research/real-world-equation-atlas/XMG_CROSS_DOMAIN_OPERATOR_CONTRACT_V0.1.json --source python/merlin/equation_atlas/operators.py --source tests/test_merlin_xmg_operator_contract.py --source python/merlin/equation_atlas/simulation.py --source tests/test_merlin_simulation_engine.py --source python/merlin/equation_atlas/models.py --source tests/test_merlin_composed_models.py --source docs/research/real-world-equation-atlas/equation-entry.schema.json --source docs/research/real-world-equation-atlas/evidence-receipt.schema.json --source requirements-equation-atlas.txt --source python/merlin/equation_atlas/normalize.py --source python/merlin/equation_atlas/experiments/baseline.py --source python/merlin/equation_atlas/experiments/signal_processing.py --source python/merlin/equation_atlas/experiments/stochastic.py --source python/merlin/equation_atlas/experiments/biological_complexity.py --source python/merlin/equation_atlas/dimensions.py --source python/merlin/equation_atlas/symbolic_checks.py --source artifacts/equation-atlas-normalized-entries-001-080.json --output artifacts/equation-atlas-evidence-receipt.json
          python3 -m unittest discover -s tests -p "test_merlin_equation_atlas*.py" -v
          python3 -m unittest discover -s tests -p "test_merlin_signal_processing.py" -v
          python3 -m unittest discover -s tests -p "test_merlin_stochastic.py" -v
          python3 -m unittest discover -s tests -p "test_merlin_biological_complexity.py" -v
          python3 -m unittest discover -s tests -p "test_merlin_xmg_operator_contract.py" -v
          python3 -m unittest discover -s tests -p "test_merlin_evidence_receipts.py" -v
      - name: Publish equation-atlas reproducibility artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-equation-atlas-baseline
          path: artifacts/equation-atlas-*
          retention-days: 14

      - name: Merlin engineering IR, persistence, CAD and coordinate-frame tests
        env:
          PYTHONPATH: python
        shell: bash
        run: |
          set -euo pipefail
          for pattern in test_engineering_ir.py test_engineering_project_store.py test_cad_assembly.py test_freecad_bridge.py test_freecad_document_bridge.py test_merlin_dashboard_bootstrap.py test_coordinate_frames.py test_physical_connectivity.py test_wire_routing.py test_wire_qualification.py test_wiring_exports.py test_media_and_drafting.py test_route_evidence.py test_workload_leases.py test_workload_scheduler.py test_resource_probe.py test_lean_proof_receipt.py test_proof_observatory.py test_observatory_benchmarks.py test_theorem_dag.py test_observatory_benchmark_links.py test_observatory_graph_bridge.py; do
            python3 -m unittest discover -s tests -p "$pattern" -v
          done
          mkdir -p artifacts
          python3 -m merlin.observatory_benchmarks --commit "$GITHUB_SHA" --output artifacts/merlin-cross-domain-benchmark.json
          python3 -m merlin.theorem_dag --output artifacts/merlin-theorem-dag.json
          python3 -m merlin.observatory_linking --receipt artifacts/merlin-cross-domain-benchmark.json --dag artifacts/merlin-theorem-dag.json --database artifacts/merlin-proof-observatory.sqlite3 > artifacts/merlin-observatory-link-summary.json

      - name: Publish cross-domain Observatory evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-cross-domain-benchmark
          path: |
            artifacts/merlin-cross-domain-benchmark.json
            artifacts/merlin-cross-domain-repeatability.json
            artifacts/merlin-theorem-dag.json
            artifacts/merlin-proof-observatory.sqlite3
            artifacts/merlin-observatory-link-summary.json
          retention-days: 14

      - name: CACE return bridge guardrails
        run: python3 tests/cace_return_bridge_smoke.py

      - name: Collar policy guardrails
        run: |
          python3 tests/collar_policy_smoke.py
          python3 tests/collar_runtime_contract_smoke.py

      - name: Collar encrypted-core smoke
        run: bash tests/collar_vault_smoke.sh

      - name: Hermes and voice integration contracts
        run: |
          bash -n scripts/install_hermes_agent.sh scripts/models/*.sh
          python3 -m unittest discover -s tests/voice -v
          python3 -m unittest discover -s tests/engineering -v

      - name: Independent smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/smoke.py ./build/expert_robot_runtime
          python3 tests/research_cli_contract_smoke.py

      - name: Show ccache stats
        if: always()
        shell: bash
        run: |
          if [ "${EXPERT_ROBOT_CCACHE:-0}" = "1" ]; then
            ccache --show-stats || true
          fi

      - name: Record PR test evidence manifest
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          keys = ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF", "GITHUB_EVENT_NAME",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW", "GITHUB_WORKFLOW_REF")
          payload = {key.lower(): os.environ.get(key, "") for key in keys}
          payload["job_status"] = os.environ.get("JOB_STATUS", "see GitHub Actions job conclusion")
          with open("artifacts/pr-test-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, sort_keys=True, indent=2)
              handle.write("\n")
          PY

      - name: Upload CI diagnostics and runner identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-robot-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Save C++ compiler cache
        if: ${{ success() && env.EXPERT_ROBOT_CCACHE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  merlin-nouscoder-inference:
    needs: build-and-smoke
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[model-inference]') }}
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified NousCoder model cache
        id: nouscoder-cache
        uses: actions/cache/restore@v4
        with:
          path: models/hermes_coder
          key: nouscoder-14b-q4-k-m-v1-${{ runner.os }}
      - name: Download NousCoder model on cache miss
        if: steps.nouscoder-cache.outputs.cache-hit != 'true'
        run: bash scripts/models/download_nouscoder.sh
      - name: Verify model checksum
        run: |
          set -euo pipefail
          model='models/hermes_coder/NousResearch_NousCoder-14B-Q4_K_M.gguf'
          test -s "$model"
          printf '%s  %s\n' '9cc51afc755319db42a6324baf3395436cce5954dc87df95d3b9e7d625610624' "$model" | sha256sum --check
      - name: Save verified NousCoder cache
        if: success() && steps.nouscoder-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: models/hermes_coder
          key: nouscoder-14b-q4-k-m-v1-${{ runner.os }}
      - name: Build llama.cpp CPU server
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON
          cmake --build /tmp/llama.cpp/build --config Release --parallel 8 --target llama-server
      - name: Run code-only NousCoder inference
        run: |
          set -euo pipefail
          mkdir -p artifacts
          /tmp/llama.cpp/build/bin/llama-server \
            --model models/hermes_coder/NousResearch_NousCoder-14B-Q4_K_M.gguf \
            --host 127.0.0.1 --port 8080 --ctx-size 65536 \
            --threads 8 --threads-batch 8 --batch-size 512 --ubatch-size 128 \
            --n-gpu-layers 0 > /tmp/nouscoder-llama-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/nouscoder-llama-server.log; exit 5; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/nouscoder-llama-server.log; exit 6; fi
          curl --fail --silent --show-error --max-time 180 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"NousResearch_NousCoder-14B-Q4_K_M.gguf","messages":[{"role":"system","content":"You are a precise coding assistant. Do not think aloud. Return only valid Python code, without Markdown."},{"role":"user","content":"Write a Python function named clamp(value, low, high) that returns value clamped inclusively between low and high."}],"temperature":0.6,"top_p":0.95,"max_tokens":160,"chat_template_kwargs":{"enable_thinking":false},"reasoning_format":"none"}' \
            > artifacts/nouscoder-inference.json
          python3 - <<'PY'
          import json
          with open('artifacts/nouscoder-inference.json', encoding='utf-8') as f:
              data=json.load(f)
          text=data['choices'][0]['message'].get('content','')
          if not isinstance(text,str) or 'def clamp' not in text.lower() or 'return' not in text.lower():
              print(json.dumps(data,indent=2)[:4000])
              raise SystemExit('NousCoder did not return a complete clamp function.')
          print('PASS: NousCoder produced a complete clamp function.')
          print(text[:1200])
          PY
      - name: Publish NousCoder inference artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-nouscoder-code-smoke
          path: artifacts/nouscoder-inference.json
          retention-days: 7
      - name: Publish NousCoder diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-nouscoder-diagnostics
          path: /tmp/nouscoder-llama-server.log
          if-no-files-found: ignore
          retention-days: 3
