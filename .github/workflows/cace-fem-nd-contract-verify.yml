name: CACE FEM-ND Contract Verify

on:
  pull_request:
    paths:
      - "config/cace_fem_nd_contract_pin.json"
      - "scripts/extract_cace_contracts.py"
      - "scripts/verify_cace_fem_nd_contract.py"
      - ".github/workflows/cace-fem-nd-contract-verify.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: avrea-ubuntu-latest-8-vcpu
    concurrency:
      group: expert-robot-avrea-half-month-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Avrea half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
          AVREA_RUNNER_LABEL: avrea-ubuntu-latest-8-vcpu
        run: python3 scripts/check_avrea_halfmonth_budget.py --reserve-minutes 10 --runner-label "$AVREA_RUNNER_LABEL"
      - name: Prepare read-only deploy key
        shell: bash
        env:
          CACE_REPO_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${CACE_REPO_KEY:-}"
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$CACE_REPO_KEY" > "$key_file"
          chmod 600 "$key_file"
          eval "$(ssh-agent -s)"
          ssh-add "$key_file" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Clone pinned CACE and verify FEM-ND contract
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-app"
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git clone git@github.com:morganaspim/Cace-app.git "$work"
          expected="$(python3 -c 'import json; print(json.load(open("config/cace_fem_nd_contract_pin.json"))["commit"])')"
          git -C "$work" checkout --detach "$expected"
          python3 scripts/verify_cace_fem_nd_contract.py "$work"
      - name: Cleanup key
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/cace_repo_key"
