name: CACE Refinement Counterexample Search

on:
  pull_request:
    paths:
      - "scripts/search_cace_refinement_counterexamples.py"
      - ".github/workflows/cace-refinement-counterexample.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: refinement-counterexample-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: avrea-ubuntu-latest-8-vcpu
    concurrency:
      group: expert-robot-avrea-half-month-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Avrea half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
          AVREA_RUNNER_LABEL: avrea-ubuntu-latest-8-vcpu
        run: python3 scripts/check_avrea_halfmonth_budget.py --reserve-minutes 10 --runner-label "$AVREA_RUNNER_LABEL"
      - name: Prepare deploy key
        shell: bash
        env:
          CACE_REPO_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$CACE_REPO_KEY" > "$key_file"
          chmod 600 "$key_file"
          eval "$(ssh-agent -s)"
          ssh-add "$key_file" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Clone pinned CACE and install
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-app"
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' git clone git@github.com:morganaspim/Cace-app.git "$work"
          git -C "$work" checkout 0e7aa229d3bb57174e281b883ee8af5445f15f75
          python3 -m pip install --disable-pip-version-check --no-input numpy
          python3 -m pip install --disable-pip-version-check --no-input -e "$work"
      - name: Search for counterexamples
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/refinement-counterexamples.json"
          python3 scripts/search_cace_refinement_counterexamples.py "$RUNNER_TEMP/cace-app" -o "$out"
          cat "$out"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: cace-refinement-counterexamples-${{ github.run_id }}
          path: ${{ runner.temp }}/refinement-counterexamples.json
          retention-days: 14
      - name: Cleanup key
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/cace_repo_key"

