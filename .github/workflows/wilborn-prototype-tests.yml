name: Wilborn prototype tests
on:
  pull_request:
    paths:
      - 'wilborn_ops/**'
      - 'tests/test_wilborn_*.py'
      - '.github/workflows/wilborn-prototype-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_wilborn_*.py' -v
      - name: Syntax check
        run: python -m compileall -q wilborn_ops
