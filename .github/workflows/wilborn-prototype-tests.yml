name: Wilborn prototype tests
on:
  pull_request:
    paths:
      - 'wilborn_ops/**'
      - 'tests/test_wilborn_*.py'
      - 'python/merlin/artifact_ref.py'
      - 'python/merlin/cace_attestation.py'
      - 'python/merlin/project_registry.py'
      - 'python/merlin/titan_protocol_model.py'
      - 'tests/test_cace_attestation.py'
      - '.github/workflows/wilborn-prototype-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned cryptography test dependency
        run: python -m pip install --only-binary=:all: cryptography==50.0.2
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_wilborn_*.py' -v
      - name: Canonical CACE verifier regression
        run: python -m unittest discover -s tests -p 'test_cace_attestation.py' -v
      - name: Syntax check
        run: python -m compileall -q wilborn_ops
