name: Merlin Studio Android bundled CPU GGUF APK (review candidate)

on:
  pull_request:
    paths:
      - 'android/merlin-apk/**'
      - '.github/workflows/merlin-android-apk.yml'
      - 'portable/build_portable.py'
      - 'portable/merlin_studio/**'
      - 'python/merlin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner's preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check pinned Studio code and Android bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile android/merlin-apk/app/src/main/python/merlin_android.py
          python3 portable/build_portable.py --output android/merlin-apk/app/src/main/assets/merlin-studio-pinned.zip
          python3 scripts/verify_portable.py android/merlin-apk/app/src/main/assets/merlin-studio-pinned.zip
          python3 - <<'PY'
          import json, zipfile
          path="android/merlin-apk/app/src/main/assets/merlin-studio-pinned.zip"
          with zipfile.ZipFile(path) as a:
              m=json.loads(a.read("Merlin_Studio/PACKAGE_MANIFEST.json"))
              assert not m["contains_user_state"]
              assert not m["contains_model_weights"]
              assert not m["contains_inference_engine"]
              assert not m["contains_python_runtime"]
              assert "Merlin_Studio/web/index.html" in a.namelist()
              assert "Merlin_Studio/server.py" in a.namelist()
              print("Merlin embedded source identity verified")
          PY
      - name: Verify Python local model HTTP and injection boundaries (test stub only)
        shell: bash
        run: |
          python3 -m py_compile android/merlin-apk/app/src/main/python/merlin_local_http.py
          python3 tests/test_merlin_android_model_http.py
      - name: Fetch pinned Qwen2.5 0.5B Q4_K_M GGUF into APK assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=android/merlin-apk/app/src/main/assets
          mkdir -p "$ASSETS" release-evidence
          MODEL_REV=9217f5db79a29953eb74d5343926648285ec7e67
          MODEL_SHA=74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 7 \
            --connect-timeout 30 --max-time 1800 \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/$MODEL_REV/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true" \
            --output "$ASSETS/merlin-local.gguf"
          test "$(stat -c %s "$ASSETS/merlin-local.gguf")" -eq 491400032
          echo "$MODEL_SHA  $ASSETS/merlin-local.gguf" | sha256sum --check
          echo "$MODEL_SHA  merlin-local.gguf" > release-evidence/GGUF_SHA256SUMS.txt
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/raw/$MODEL_REV/LICENSE" \
            --output release-evidence/QWEN_MODEL_LICENSE.txt
          grep -qi "Apache License" release-evidence/QWEN_MODEL_LICENSE.txt
          echo "Qwen2.5-0.5B-Instruct-GGUF @$MODEL_REV (official upstream); exact file SHA-256 verified" \
            > release-evidence/GGUF_PROVENANCE.txt
      - name: Stage exact-revision CPU inference source (no model weights)
        shell: bash
        run: python3 scripts/merlin/prepare_android_native.py
      - name: Build installable Android debug APK
        working-directory: android/merlin-apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect APK identity and Python payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          APK=android/merlin-apk/app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK" > release-evidence/APK_SHA256SUMS.txt
          python3 - <<'PY' > release-evidence/apk-structure.json
          import json, zipfile
          path="android/merlin-apk/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(path) as a:
              names=a.namelist()
              assert "assets/merlin-studio-pinned.zip" in names, "Original Merlin Studio not bundled"
              assert any(n.startswith("lib/arm64-v8a/") for n in names), "ARM64 runtime not bundled"
              assert "lib/arm64-v8a/libmerlin_local_ai.so" in names, "CPU inference JNI ARM64 ABI absent"
              assert "classes.dex" in names, "Android Java runtime absent"
              assert "assets/merlin-local.gguf" in names, "Model weights not bundled"
              import hashlib
              h=hashlib.sha256()
              with a.open("assets/merlin-local.gguf") as model:
                  for block in iter(lambda:model.read(1024*1024),b""):
                      h.update(block)
              assert h.hexdigest()=="74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db", "Packaged model digest mismatch"
              print(json.dumps({"apk_structure":"pass","contains_studio":True,"has_arm64_libraries":True,"has_dex":True,"android_device_tested":False,"contains_model_weights":True},indent=2))
          PY
      - name: Publish APK candidate with scoped evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Merlin-Studio-Android-CPU-Qwen05-GGUF-DEV
          path: |
            android/merlin-apk/app/build/outputs/apk/debug/app-debug.apk
            release-evidence/
          if-no-files-found: error
          retention-days: 14
