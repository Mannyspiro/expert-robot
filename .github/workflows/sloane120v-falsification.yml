name: Sloane120v Falsification Pair

on:
  push:
    branches: ["research/bl-facsimile-acquisition"]
    paths: [".github/workflows/sloane120v-falsification.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Acquire explicitly labeled f120v and independent candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pair
          python3 - <<'PY'
          import hashlib,json,pathlib,ssl,urllib.parse,urllib.request
          root=pathlib.Path("pair"); ctx=ssl._create_unverified_context()
          def fetch(url,timeout=120):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 manuscript research","Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=timeout,context=ctx) as r:
                  return r.read(),r.geturl(),r.headers.get("Content-Type","")
          def jpeg_size(data):
              if not data.startswith(b"\xff\xd8"): return (0,0)
              i=2
              while i+9<len(data):
                  if data[i]!=0xff: i+=1; continue
                  marker=data[i+1]; i+=2
                  if marker in (0xd8,0xd9): continue
                  if i+2>len(data): break
                  seg=int.from_bytes(data[i:i+2],"big")
                  if seg<2 or i+seg>len(data): break
                  if marker in (0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf):
                      h=int.from_bytes(data[i+3:i+5],"big"); w=int.from_bytes(data[i+5:i+7],"big"); return w,h
                  i+=seg
              return (0,0)

          # Explicit archived BL mapping: f.120v -> IllID 16260 -> K150158.jpg
          targets=[
            "http://molcat1.bl.uk/IllImages/Kslides/K150/K150158.jpg",
            "http://www.bl.uk/IllImages/Kslides/K150/K150158.jpg",
            "https://www.bl.uk/IllImages/Kslides/K150/K150158.jpg",
            "http://molcat1.bl.uk/IllImages/Kslides/thm/K150/K150158.jpg",
            "http://www.bl.uk/IllImages/Kslides/thm/K150/K150158.jpg",
          ]
          snaps=[]
          for target in targets:
              q=urllib.parse.urlencode({"url":target,"output":"json","filter":"statuscode:200","fl":"timestamp,original,mimetype,statuscode,digest,length"})
              try:
                  b,_,_=fetch("https://web.archive.org/cdx/search/cdx?"+q,90)
                  arr=json.loads(b.decode("utf-8","replace"))
                  if isinstance(arr,list) and len(arr)>1:
                      hdr=arr[0]
                      for row in arr[1:]:
                          d=dict(zip(hdr,row)); d["target"]=target; snaps.append(d)
              except Exception: pass
          snaps.sort(key=lambda d:(1 if "/thm/" not in d.get("original","") else 0,d.get("timestamp","")),reverse=True)
          best=None; attempts=[]
          for d in snaps[:100]:
              u=f"https://web.archive.org/web/{d['timestamp']}id_/{d['original']}"
              try:
                  bb,final,ct=fetch(u)
                  if len(bb)<5000: raise ValueError("too small")
                  w,h=jpeg_size(bb)
                  rec={"wayback_url":u,"original":d["original"],"timestamp":d["timestamp"],"bytes":len(bb),"width":w,"height":h,"sha256":hashlib.sha256(bb).hexdigest(),"payload":bb}
                  if best is None or w*h>best["width"]*best["height"]: best=rec
              except Exception as e: attempts.append({"url":u,"error":repr(e)})
          if not best: raise SystemExit("could not acquire archived K150158")
          (root/"sloane1171_f120v_K150158.jpg").write_bytes(best.pop("payload"))
          meta={"shelfmark":"Sloane MS 1171","folio":"f.120v","legacy_illid":16260,"legacy_filename":"K150158.jpg","best":best,"attempts":attempts[:30]}
          (root/"sloane1171_f120v.json").write_text(json.dumps(meta,indent=2)+"\n")

          # Independent 1010 candidate
          u="https://www.1010.co.uk/images/sloane1171.jpg"
          bb,final,ct=fetch(u)
          w,h=jpeg_size(bb)
          cand={"source":"1010.co.uk","url":u,"final":final,"bytes":len(bb),"width":w,"height":h,"sha256":hashlib.sha256(bb).hexdigest()}
          (root/"1010_sloane1171.jpg").write_bytes(bb)
          (root/"1010_sloane1171.json").write_text(json.dumps(cand,indent=2)+"\n")
          print(json.dumps({"f120v":meta,"candidate":cand},indent=2))
          PY
      - name: Upload pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sloane120v-falsification-${{ github.run_id }}
          path: pair/
          if-no-files-found: error
          retention-days: 14
