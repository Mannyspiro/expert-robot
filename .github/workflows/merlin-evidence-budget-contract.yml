name: Merlin source-pinned evidence budget
"on":
  push:
    branches: ["fix/merlin-tool-continuation-fail-closed-20261122"]
    paths:
      - python/merlin/evidence_budget.py
      - tests/test_evidence_budget.py
      - .github/workflows/merlin-evidence-budget-contract.yml
  pull_request:
    paths:
      - python/merlin/evidence_budget.py
      - tests/test_evidence_budget.py
      - .github/workflows/merlin-evidence-budget-contract.yml

permissions:
  contents: read

jobs:
  source-pinned-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test bounded evidence retrieval and prompt authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile python/merlin/evidence_budget.py tests/test_evidence_budget.py
          python3 -B -m unittest discover -s tests -p 'test_evidence_budget.py' -v 2>&1 | tee evidence-budget-tests.log
          sha256sum python/merlin/evidence_budget.py tests/test_evidence_budget.py > evidence-budget-source-sha256.txt
      - name: Retain only tests and identity digests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-evidence-budget-${{ github.run_id }}
          path: |
            evidence-budget-tests.log
            evidence-budget-source-sha256.txt
          if-no-files-found: warn
          retention-days: 14
