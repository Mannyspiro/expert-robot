name: Heavy Qualification

on:
  workflow_dispatch:

concurrency:
  group: heavy-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-qualification:
    # Manual only: 32 vCPUs / 128 GB on Avrea. This runner is available at
    # zero monetary cost here; reserve it for genuinely heavy work to conserve
    # the free runner quota and avoid unnecessary churn.
    runs-on: namespace-profile-merlin

    steps:
      - uses: actions/checkout@v4

      - name: Detect hardware
        id: cores
        shell: bash
        run: |
          set -euo pipefail
          detected="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
          if [ "$detected" -gt 32 ]; then detected=32; fi
          if [ "$detected" -lt 1 ]; then detected=1; fi
          echo "jobs=$detected" >> "$GITHUB_OUTPUT"
          echo "Detected $detected workers"
          lscpu
          free -h

      - name: Configure
        run: |
          cmake -S . -B build             -G Ninja             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Full C++ test suite
        env:
          CTEST_PARALLEL_LEVEL: ${{ steps.cores.outputs.jobs }}
        run: |
          ctest             --test-dir build             --parallel "${CTEST_PARALLEL_LEVEL}"             --output-on-failure

      - name: Independent smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/smoke.py ./build/expert_robot_runtime &
          smoke_pid=$!

          python3 python/orchestrator.py             --runtime ./build/expert_robot_runtime             --role math             --task "heavy qualification health check" &
          orchestrator_pid=$!

          wait "$smoke_pid"
          wait "$orchestrator_pid"

