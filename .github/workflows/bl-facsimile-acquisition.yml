name: BL Facsimile Acquisition

on:
  push:
    branches:
      - "research/bl-facsimile-acquisition"
    paths:
      - ".github/workflows/bl-facsimile-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bl-facsimile-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Fetch British Library source metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquisition
          manifest='https://bl.digirati.io/iiif/ark:/81055/vdc_100057740056.0x000001'
          sloane_catalog='https://searcharchives.bl.uk/catalog/040-002113521'
          sloane_legacy='https://www.bl.uk/catalogues/illuminatedmanuscripts/record.asp?MSID=1217&CollID=9&NStart=1171'

          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            -H 'Accept: application/ld+json, application/json;q=0.9, */*;q=0.1' \
            "$manifest" -o acquisition/harley2407_manifest.json

          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            "$sloane_catalog" -o acquisition/sloane1171_catalog.html || true

          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            "$sloane_legacy" -o acquisition/sloane1171_legacy_record.html || true

      - name: Resolve exact Harley f.56r canvas and full-resolution image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, struct, urllib.request

          root = pathlib.Path("acquisition")
          data = json.loads((root/"harley2407_manifest.json").read_text(encoding="utf-8"))

          def label_text(v):
              if v is None: return ""
              if isinstance(v, str): return v
              if isinstance(v, list): return " ".join(label_text(x) for x in v)
              if isinstance(v, dict):
                  vals=[]
                  for x in v.values():
                      vals.extend(x if isinstance(x,list) else [x])
                  return " ".join(label_text(x) for x in vals)
              return str(v)

          canvases = data.get("items") or ((data.get("sequences") or [{}])[0].get("canvases") or [])
          rows=[{
              "index":i,
              "label":label_text(c.get("label")),
              "id":c.get("id") or c.get("@id") or "",
              "width":c.get("width"),
              "height":c.get("height"),
          } for i,c in enumerate(canvases)]
          (root/"harley2407_canvas_labels.json").write_text(json.dumps(rows,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          def folio_norm(s):
              return re.sub(r"[^0-9a-z]","",s.lower()).replace("folio","").replace("fol","").lstrip("f")

          exact=[]
          for i,c in enumerate(canvases):
              lab=label_text(c.get("label"))
              n=folio_norm(lab)
              if n=="56r" or re.search(r"(?i)(?:^|\b)(?:f(?:ol(?:io)?)?\.?\s*)?56\s*r(?:\b|$)",lab):
                  exact.append((i,c,lab))

          neighbor=[r for r in rows if re.search(r"(?i)\b(?:f(?:ol(?:io)?)?\.?\s*)?(?:55|56|57)\s*[rv]\b",r["label"])]
          (root/"harley2407_neighbor_labels.json").write_text(json.dumps(neighbor,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)

          def image_dims(payload,ctype):
              if payload.startswith(b"\x89PNG\r\n\x1a\n") and len(payload)>=24:
                  return struct.unpack(">II",payload[16:24])
              if payload[:2]==b"\xff\xd8":
                  i=2
                  sof={0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
                  while i+4<len(payload):
                      if payload[i]!=0xFF:
                          i+=1; continue
                      while i<len(payload) and payload[i]==0xFF: i+=1
                      if i>=len(payload): break
                      marker=payload[i]; i+=1
                      if marker in {0xD8,0xD9,0x01} or 0xD0<=marker<=0xD7:
                          continue
                      if i+2>len(payload): break
                      seglen=int.from_bytes(payload[i:i+2],"big")
                      if marker in sof and i+7<=len(payload):
                          h=int.from_bytes(payload[i+3:i+5],"big")
                          w=int.from_bytes(payload[i+5:i+7],"big")
                          return w,h
                      i+=seglen
              return None,None

          result={
              "manifest":"https://bl.digirati.io/iiif/ark:/81055/vdc_100057740056.0x000001",
              "canvas_count":len(canvases),
              "exact_match_count":len(exact),
              "exact_match":False,
              "status":"NO_EXACT_F56R_LABEL",
          }

          if len(exact)==1:
              idx,canvas,lab=exact[0]
              result.update({
                  "exact_match":True,
                  "status":"EXACT_F56R_CANVAS_FOUND",
                  "canvas_index":idx,
                  "canvas_label":lab,
                  "canvas_id":canvas.get("id") or canvas.get("@id") or "",
                  "canvas_width":canvas.get("width"),
                  "canvas_height":canvas.get("height"),
              })
              (root/"harley2407_f56r_canvas.json").write_text(json.dumps(canvas,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

              services=[]
              direct=[]
              for obj in walk(canvas):
                  oid=obj.get("id") or obj.get("@id")
                  typ=str(obj.get("type") or obj.get("@type") or "")
                  prof=str(obj.get("profile") or "")
                  fmt=str(obj.get("format") or "")
                  if isinstance(oid,str):
                      if "ImageService" in typ or "iiif.io/api/image" in prof:
                          services.append({
                              "id":oid.rstrip("/"),
                              "type":typ,
                              "profile":prof,
                              "width":obj.get("width"),
                              "height":obj.get("height"),
                          })
                      if fmt.startswith("image/") and not oid.endswith("/info.json"):
                          direct.append(oid)

              dedup={}
              for s in services: dedup[s["id"]]=s
              services=list(dedup.values())
              services.sort(key=lambda s:(("thumbs" in s["id"].lower()), -int(s.get("width") or 0), s["id"]))
              direct=list(dict.fromkeys(direct))
              result["image_services"]=services
              result["direct_image_ids"]=direct

              candidates=[]
              for s in services:
                  sid=s["id"]
                  candidates += [
                      sid+"/full/max/0/default.jpg",
                      sid+"/full/full/0/default.jpg",
                  ]
              candidates += direct
              candidates=list(dict.fromkeys(candidates))

              errors=[]
              best=None
              for url in candidates:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"image/*"})
                      with urllib.request.urlopen(req,timeout=120) as r:
                          payload=r.read()
                          ctype=r.headers.get("Content-Type","")
                      if len(payload)<10000 or not ctype.lower().startswith("image/"):
                          errors.append({"url":url,"error":f"unexpected content {ctype} bytes={len(payload)}"})
                          continue
                      w,h=image_dims(payload,ctype)
                      candidate={
                          "url":url,"payload":payload,"ctype":ctype,
                          "width":w,"height":h,"bytes":len(payload),
                      }
                      if best is None or (w or 0)*(h or 0) > (best["width"] or 0)*(best["height"] or 0):
                          best=candidate
                      if w==canvas.get("width") and h==canvas.get("height"):
                          break
                  except Exception as e:
                      errors.append({"url":url,"error":repr(e)})

              if best:
                  suffix=".png" if "png" in best["ctype"].lower() else ".jpg"
                  out=root/("harley2407_f56r_full"+suffix)
                  out.write_bytes(best["payload"])
                  result.update({
                      "image_downloaded":True,
                      "image_url":best["url"],
                      "image_content_type":best["ctype"],
                      "image_bytes":best["bytes"],
                      "image_width":best["width"],
                      "image_height":best["height"],
                      "native_dimension_match":best["width"]==canvas.get("width") and best["height"]==canvas.get("height"),
                      "sha256":hashlib.sha256(best["payload"]).hexdigest(),
                      "image_file":str(out),
                  })
              result["download_attempts"]=errors
              if not result.get("image_downloaded"):
                  result["status"]="EXACT_CANVAS_FOUND_IMAGE_FETCH_FAILED"

          (root/"harley2407_f56r_acquisition.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Audit Sloane 1171 institutional metadata for exact folio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path("acquisition")
          records=[]
          for name in ["sloane1171_catalog.html","sloane1171_legacy_record.html"]:
              p=root/name
              if not p.exists(): continue
              text=p.read_text(encoding="utf-8",errors="replace")
              urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text,re.I)))
              relevant=[u for u in urls if re.search(r'iiif|manifest|digit|image|viewer|ark:',u,re.I)]
              hits=[]
              for pat in [r'.{0,180}120r.{0,180}',r'.{0,180}120v.{0,180}',r'.{0,180}man and woman.{0,180}',r'.{0,180}flask.{0,180}']:
                  hits += re.findall(pat,text,re.I|re.S)
              records.append({
                  "file":name,
                  "bytes":len(text.encode("utf-8")),
                  "relevant_urls":relevant[:200],
                  "folio_context_hits":[re.sub(r'\s+',' ',h).strip() for h in hits[:100]],
              })
          out={
              "shelfmark":"Sloane MS 1171",
              "target_folio":"120r",
              "catalog_record":"040-002113521",
              "legacy_msid":"1217",
              "records":records,
              "acceptance_rule":"Do not equate 120v or an unlabeled legacy illustration with 120r. Exact folio metadata required."
          }
          (root/"sloane1171_f120r_metadata_audit.json").write_text(json.dumps(out,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Write integrity summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner=$(hostname)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sha256sum acquisition/* 2>/dev/null || true
          } | tee acquisition/integrity.txt

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bl-facsimile-acquisition-${{ github.run_id }}
          path: acquisition/
          if-no-files-found: error
          retention-days: 14
