name: Merlin Science Atlas Smoke
on:
  push:
    branches: ["feat/merlin-science-knowledge-webapp-20261105"]
    paths:
      - "apps/merlin-web/**"
      - "research/science/**"
      - "docs/MERLIN_SCIENCE_HISTORY_PHILOSOPHY_PLATFORM.md"
      - "tests/merlin_science_atlas_smoke.py"
      - "tests/merlin_google_books_contract_smoke.py"
      - "tests/merlin_science_intake_smoke.py"
      - "scripts/merlin_science_intake.py"
      - "scripts/merlin_google_books_discover.py"
      - "research/science/reading-notes/**"
      - ".github/workflows/merlin-science-atlas-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merlin-science-atlas-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate atlas data and web shell
        run: |
          python3 -m json.tool research/science/discipline-taxonomy.v1.json >/dev/null
          python3 -m json.tool research/science/source-registry.v1.json >/dev/null
          python3 -m json.tool research/science/ingestion-contract.v1.json >/dev/null
          python3 tests/merlin_science_atlas_smoke.py
          python3 tests/merlin_google_books_contract_smoke.py
          python3 tests/merlin_science_intake_smoke.py
          python3 scripts/merlin_google_books_discover.py --query "subject:history of science" --max-results 5 > google-books-discovery.json
      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-google-books-discovery
          path: google-books-discovery.json
          if-no-files-found: warn
          retention-days: 14
