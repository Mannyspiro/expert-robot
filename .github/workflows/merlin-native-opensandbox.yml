name: Merlin native OpenSandbox Docker acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/merlin-native-opensandbox.yml'
      - 'scripts/merlin/native_sandbox_acceptance.py'
      - 'scripts/merlin/opensandbox_eval.py'
      - 'tests/test_opensandbox_zai_integration.py'
      - 'tests/test_native_sandbox_mount_contract.py'
      - 'portable/merlin_studio/tools.py'
      - 'portable/merlin_studio/sandbox_backend.py'
      - 'scripts/merlin/native_studio_tool_acceptance.py'
      - 'third_party/opensandbox'
      - 'docs/merlin/NATIVE_SANDBOX_ACCEPTANCE_20261122.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-docker-isolation:
    # Never run fork PR code against the runner's Docker socket.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch exact reviewed OpenSandbox source
        run: |
          git submodule update --init third_party/opensandbox
          test "$(git -C third_party/opensandbox rev-parse HEAD)" = "2ff37a988e4df129babaa6f07bb616394ef94086"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server and SDK from pinned checkout
        run: |
          python -m pip install --disable-pip-version-check ./third_party/opensandbox/server ./third_party/opensandbox/sdks/sandbox/python
          python -m py_compile scripts/merlin/opensandbox_eval.py scripts/merlin/native_sandbox_acceptance.py
      - name: Reject mock host binds and mismatched runtime volume identities
        run: |
          python -m unittest discover -s tests -p test_native_sandbox_mount_contract.py -v
      - name: Pull container runtime images
        run: |
          docker version
          docker pull python:3.11-slim
          docker pull opensandbox/execd:v1.1.0
          docker pull opensandbox/egress:v1.1.7
          IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.11-slim)"
          test -n "$IMAGE"
          echo "MERLIN_SANDBOX_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Start loopback OpenSandbox controller on the CI host
        run: |
          KEY="$(python -c 'import secrets;print(secrets.token_hex(24))')"
          echo "::add-mask::$KEY"
          echo "OPEN_SANDBOX_API_KEY=$KEY" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/merlin-opensandbox.toml" <<'EOF'
          [server]
          host = "127.0.0.1"
          port = 8080
          max_sandbox_timeout_seconds = 120

          [runtime]
          type = "docker"
          execd_image = "opensandbox/execd:v1.1.0"

          [storage]
          allowed_host_paths = []

          [docker]
          network_mode = "bridge"
          publish_host = "127.0.0.1"
          no_new_privileges = true
          pids_limit = 64
          drop_capabilities = ["AUDIT_WRITE","MKNOD","NET_ADMIN","NET_RAW","SYS_ADMIN","SYS_MODULE","SYS_PTRACE","SYS_TIME","SYS_TTY_CONFIG"]

          [egress]
          image = "opensandbox/egress:v1.1.7"
          mode = "dns+nft"
          readiness_timeout_seconds = 30.0
          EOF
          OPENSANDBOX_SERVER_API_KEY="$KEY" opensandbox-server --config "$RUNNER_TEMP/merlin-opensandbox.toml" > "$RUNNER_TEMP/merlin-opensandbox-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/merlin-opensandbox.pid"
          READY=0
          for attempt in $(seq 1 100); do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:8080/health" > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/merlin-opensandbox.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "OpenSandbox server did not become healthy"
            tail -n 60 "$RUNNER_TEMP/merlin-opensandbox-server.log" || true
            exit 1
          fi
      - name: Run real runtime tests with controlled positive canary
        run: |
          python scripts/merlin/native_sandbox_acceptance.py \
            --image "$MERLIN_SANDBOX_IMAGE" \
            --report "$RUNNER_TEMP/merlin-native-acceptance.json"
      - name: Execute Studio ToolSet against the real approved Docker sandbox
        env:
          MERLIN_PYTHON_BACKEND: opensandbox
          MERLIN_SANDBOX_PORT: '8080'
        run: |
          python scripts/merlin/native_studio_tool_acceptance.py | tee "$RUNNER_TEMP/merlin-native-studio-tool.json"
      - name: Check cleanup and preserve failure evidence
        if: always()
        run: |
          mkdir -p native-evidence
          if [ -f "$RUNNER_TEMP/merlin-native-studio-tool.json" ]; then
            python -m json.tool "$RUNNER_TEMP/merlin-native-studio-tool.json"
            cp "$RUNNER_TEMP/merlin-native-studio-tool.json" native-evidence/
          fi
          if [ -f "$RUNNER_TEMP/merlin-native-acceptance.json" ]; then
            python -m json.tool "$RUNNER_TEMP/merlin-native-acceptance.json"
            cp "$RUNNER_TEMP/merlin-native-acceptance.json" native-evidence/
          fi
          if [ -f "$RUNNER_TEMP/merlin-opensandbox-server.log" ]; then
            cp "$RUNNER_TEMP/merlin-opensandbox-server.log" native-evidence/
          fi
          echo "Remaining managed OpenSandbox containers:"
          docker ps -a --filter 'label=opensandbox.io/id' --format '{{.ID}} {{.Names}} {{.Status}}' || true
          echo "Remaining managed egress sidecars:"
          docker ps -a --filter 'label=opensandbox.io/egress-sidecar-for' --format '{{.ID}} {{.Names}} {{.Status}}' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merlin-native-opensandbox-evidence
          path: native-evidence/
          retention-days: 14
          if-no-files-found: warn
