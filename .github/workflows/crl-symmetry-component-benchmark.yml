name: CRL Symmetry Component Benchmark

on:
  pull_request:
    paths:
      - "config/examples/circle_symmetry_component.crl"
      - "scripts/benchmark_crl_symmetry_component.py"
      - "tests/crl_symmetry_component_benchmark_smoke.py"
      - "scripts/compile_crl.py"
      - "scripts/compile_magick_geometry.py"
      - "formal/MathAI/Geometry/CircleDerived.lean"
      - ".github/workflows/crl-symmetry-component-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crl-symmetry-component-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Smoke correctness
        run: python3 tests/crl_symmetry_component_benchmark_smoke.py
      - name: Benchmark CRL exact geometry component
        run: |
          mkdir -p benchmark-artifacts
          python3 scripts/benchmark_crl_symmetry_component.py \
            --cases 5000 \
            --repeats 3 \
            --output benchmark-artifacts/crl-symmetry-component.json
          cat benchmark-artifacts/crl-symmetry-component.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: crl-symmetry-component-${{ github.run_id }}
          path: benchmark-artifacts/crl-symmetry-component.json
          if-no-files-found: error
          retention-days: 30
