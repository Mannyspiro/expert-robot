name: Auto Promote Qualified Candidate

on:
  workflow_run:
    workflows: ["RSI Candidate Qualification"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download trusted decision only
        uses: actions/download-artifact@v4
        with:
          name: candidate-promotion-decision-${{ github.event.workflow_run.id }}
          path: decision
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate decision envelope
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          p=json.load(open("decision/promotion-decision.json",encoding="utf-8"))
          expected_run=int("${{ github.event.workflow_run.id }}")
          assert p["schema_version"]==1
          assert p["source_qualification_run_id"]==expected_run
          assert p["eligible_for_automatic_promotion"] is True
          assert p["base_branch"]=="main"
          assert p["promotion_target"]=="qualified/latest"
          assert p["authority_change"] in {"same","less"}
          expected_hash=p.pop("decision_sha256")
          canonical=json.dumps(p,sort_keys=True,separators=(",",":")).encode()
          assert hashlib.sha256(canonical).hexdigest()==expected_hash
          for key in ("candidate_ref","candidate_sha","base_sha"):
              value=p[key]
              assert value and "\n" not in value and "\r" not in value
              print(f"{key}={value}")
          PY

      - name: Rebind decision to live repository state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ steps.decision.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ steps.decision.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.decision.outputs.base_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_main" = "$BASE_SHA" ] || {
            echo "::error::main moved after qualification; requalification required"; exit 2;
          }

          live_candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_REF" --jq '.object.sha')"
          [ "$live_candidate" = "$CANDIDATE_SHA" ] || {
            echo "::error::candidate ref moved after qualification"; exit 2;
          }

          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$CANDIDATE_SHA" --jq '.status')"
          case "$status" in ahead|identical) ;; *) echo "::error::candidate is no longer based on qualified main"; exit 2 ;; esac

      - name: Promote capability pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/qualified/latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/qualified/latest"               -f sha="$CANDIDATE_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/heads/qualified/latest" -f sha="$CANDIDATE_SHA" >/dev/null
          fi
          echo "Promoted qualified/latest -> $CANDIDATE_SHA"
