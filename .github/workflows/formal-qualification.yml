name: Formal Qualification

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "formal/**"
      - ".github/workflows/formal-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-qualification-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lean-qualification:
    runs-on: avrea-ubuntu-latest-8-vcpu
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Project proof-escape audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path("formal/MathAI")
          forbidden = [
              ("sorry", re.compile(r"(?<![A-Za-z0-9_])sorry(?![A-Za-z0-9_])")),
              ("admit", re.compile(r"(?<![A-Za-z0-9_])admit(?![A-Za-z0-9_])")),
              ("native_decide", re.compile(r"(?<![A-Za-z0-9_])native_decide(?![A-Za-z0-9_])")),
              ("axiom declaration", re.compile(r"(?m)^\s*axiom\s+")),
              ("unsafe declaration", re.compile(r"(?m)^\s*unsafe\s+")),
          ]

          failures = []
          for path in sorted(root.rglob("*.lean")):
              text = path.read_text(encoding="utf-8")
              for label, pattern in forbidden:
                  if pattern.search(text):
                      failures.append(f"{path}: forbidden {label}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)

          print("Project Lean source audit passed.")
          PY

      - name: Verified registry audit binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          formal = pathlib.Path("formal")
          registry_path = formal / "theorem_registry.json"
          audit_path = formal / "MathAI" / "Audit.lean"

          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          audit = audit_path.read_text(encoding="utf-8")

          failures = []
          for theorem in registry.get("theorems", []):
              if theorem.get("status") != "verified":
                  continue

              name = theorem.get("name", "")
              source = theorem.get("source", "")

              if not name or not source:
                  failures.append("verified theorem missing name/source")
                  continue

              if not (formal / source).is_file():
                  failures.append(f"{name}: registered source does not exist: {source}")

              if f"#check {name}" not in audit:
                  failures.append(f"{name}: missing exact #check in MathAI/Audit.lean")

              if f"#print axioms {name}" not in audit:
                  failures.append(f"{name}: missing exact #print axioms in MathAI/Audit.lean")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)

          print("Verified theorem registry is explicitly bound to the Lean axiom audit.")
          PY

      - name: Build and independently check pinned Lean package
        uses: leanprover/lean-action@v1
        env:
          # Mathlib-dependent leanchecker jobs can be memory-heavy.
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: "formal"
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          leanchecker: "true"
          leanchecker-args: "MathAI"
          axiom-audit: "true"
          axiom-audit-root: "MathAI"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"

      - name: Direct audited-root replay
        working-directory: formal
        env:
          LEAN_ABORT_ON_PANIC: "1"
        run: lake env lean MathAI.lean

      - name: Compile THTG conditional maximum theorem and print axiom dependencies
        working-directory: formal
        env:
          LEAN_ABORT_ON_PANIC: "1"
        run: lake env lean THTGConditionalTheorems.lean

      - name: Compile exact printed-beta audit and print axiom dependencies
        working-directory: formal
        env:
          LEAN_ABORT_ON_PANIC: "1"
        run: |
          set +e
          output="$(lake env lean ../proofs/THTGPrintedBetaAudit.lean 2>&1)"
          result=$?
          set -e
          printf '%s\n' "$output"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          if grep -Eq 'sorryAx|admitAx' <<< "$output"; then
            echo "::error::THTG beta theorem contains an untrusted proof escape."
            exit 1
          fi
          echo "THTG printed-beta audit compiled without proof escapes."

      - name: Registered theorem axiom report
        working-directory: formal
        env:
          LEAN_ABORT_ON_PANIC: "1"
        run: lake env lean MathAI/Audit.lean

      - name: Manifest immutability check
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- lake-manifest.json
