name: CACE Local Runtime Discovery

on:
  push:
    branches:
      - "feat/cace-headless-local-llm"
    paths:
      - ".github/workflows/cace-local-runtime-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-local-runtime-discovery
  cancel-in-progress: true

jobs:
  dispatch-and-collect:
    runs-on: avrea-ubuntu-latest-1-vcpu
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare CACE deploy key
        id: key
        shell: bash
        env:
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_SSH_PRIVATE_KEY:-}"
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > "$RUNNER_TEMP/cace_repo_key.pub"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Install bounded runtime probe
        id: install
        shell: bash
        env:
          KEY_FILE: ${{ steps.key.outputs.key_file }}
          CACE_BRANCH: expert-robot/headless-local-llm
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-runtime-discovery"
          rm -rf "$work"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            git clone git@github.com:morganaspim/Cace-app.git "$work"
          cd "$work"
          git checkout "$CACE_BRANCH"

          request_id="runtime-discovery-$GITHUB_RUN_ID"
          mkdir -p bridge .github/workflows
          cat > bridge/local-runtime-probe-request.json <<JSON
          {
            "schema_version": 1,
            "request_id": "$request_id",
            "authority": "observation-only",
            "promotion_authority": false,
            "network_probe": false,
            "download_allowed": false
          }
          JSON

          cat > .github/workflows/expert-robot-local-runtime-probe.yml <<'YAML'
          name: Expert Robot Local Runtime Probe

          on:
            push:
              branches:
                - "expert-robot/headless-local-llm"
              paths:
                - "bridge/local-runtime-probe-request.json"
                - ".github/workflows/expert-robot-local-runtime-probe.yml"

          concurrency:
            group: expert-robot-local-runtime-probe
            cancel-in-progress: true

          jobs:
            probe:
              runs-on: [self-hosted, cace, oci, aarch64]
              timeout-minutes: 5
              permissions:
                contents: read
              outputs:
                request_id: ${{ steps.meta.outputs.request_id }}

              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false

                - name: Inspect local model/runtime inventory
                  id: meta
                  shell: bash
                  run: |
                    set -euo pipefail
                    request_id="$(python3 -c 'import json; print(json.load(open("bridge/local-runtime-probe-request.json"))["request_id"])')"
                    echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
                    out="$RUNNER_TEMP/local-runtime-probe"
                    mkdir -p "$out"

                    python3 - "$out/result.json" "$request_id" <<'PY'
                    import json
                    import os
                    import pathlib
                    import platform
                    import shutil
                    import subprocess
                    import sys

                    output = pathlib.Path(sys.argv[1])
                    request_id = sys.argv[2]

                    roots = []
                    for raw in (
                        "/opt",
                        "/srv",
                        "/var/lib/cace-cache",
                        os.environ.get("HOME", ""),
                        "/mnt",
                        "/models",
                        "/workspace",
                    ):
                        if raw:
                            path = pathlib.Path(raw)
                            if path.exists() and str(path) not in {str(x) for x in roots}:
                                roots.append(path)

                    llama_candidates = []
                    gguf_candidates = []
                    max_results = 80

                    def add_unique(bucket, item):
                        if item not in bucket and len(bucket) < max_results:
                            bucket.append(item)

                    direct = shutil.which("llama-server")
                    if direct:
                        add_unique(llama_candidates, direct)

                    for root in roots:
                        root_depth = len(root.parts)
                        for current, dirs, files in os.walk(root, topdown=True, followlinks=False):
                            cur = pathlib.Path(current)
                            depth = len(cur.parts) - root_depth
                            if depth >= 5:
                                dirs[:] = []
                            dirs[:] = [
                                d for d in dirs
                                if d not in {".git", ".cache/pip", "node_modules", "__pycache__"}
                            ]
                            for name in files:
                                p = cur / name
                                lname = name.lower()
                                if name == "llama-server":
                                    add_unique(llama_candidates, str(p))
                                elif lname.endswith(".gguf"):
                                    try:
                                        st = p.stat()
                                    except OSError:
                                        continue
                                    add_unique(gguf_candidates, {
                                        "path": str(p),
                                        "size_bytes": st.st_size,
                                        "name": name,
                                    })
                            if len(llama_candidates) >= max_results and len(gguf_candidates) >= max_results:
                                break

                    llama = None
                    if llama_candidates:
                        path = llama_candidates[0]
                        version = ""
                        executable = os.access(path, os.X_OK)
                        if executable:
                            try:
                                result = subprocess.run(
                                    [path, "--version"],
                                    text=True,
                                    stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT,
                                    timeout=15,
                                    check=False,
                                )
                                version = (result.stdout or "").strip()[-2000:]
                            except Exception as exc:
                                version = f"version probe failed: {exc}"
                        llama = {
                            "path": path,
                            "executable": executable,
                            "version_output": version,
                        }

                    payload = {
                        "schema_version": 1,
                        "request_id": request_id,
                        "status": "observed",
                        "authority": "observation-only",
                        "promotion_authority": False,
                        "network_probe_performed": False,
                        "download_performed": False,
                        "machine": platform.node(),
                        "architecture": platform.machine(),
                        "llama_server": llama,
                        "llama_server_candidates": llama_candidates,
                        "gguf_candidates": gguf_candidates,
                    }
                    output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
                    print(json.dumps({
                        "request_id": request_id,
                        "architecture": payload["architecture"],
                        "llama_server_found": llama is not None,
                        "gguf_count": len(gguf_candidates),
                    }, indent=2))
                    PY

                - name: Upload observation artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: local-runtime-probe-${{ github.run_id }}
                    path: ${{ runner.temp }}/local-runtime-probe/result.json
                    if-no-files-found: error
                    retention-days: 1

            publish:
              needs: probe
              runs-on: ubuntu-latest
              timeout-minutes: 5
              permissions:
                actions: read
                contents: write

              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: expert-robot/headless-local-llm
                    persist-credentials: true

                - uses: actions/download-artifact@v4
                  with:
                    pattern: local-runtime-probe-*
                    path: "$RUNNER_TEMP/probe"
                    merge-multiple: true

                - name: Validate and publish observation
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f "$RUNNER_TEMP/probe/result.json"
                    python3 - "$RUNNER_TEMP/probe/result.json" <<'PY'
                    import json, re, sys
                    p=json.load(open(sys.argv[1], encoding="utf-8"))
                    assert p["schema_version"] == 1
                    assert re.fullmatch(r"runtime-discovery-[0-9]+", p["request_id"])
                    assert p["status"] == "observed"
                    assert p["authority"] == "observation-only"
                    assert p["promotion_authority"] is False
                    assert p["network_probe_performed"] is False
                    assert p["download_performed"] is False
                    PY

                    mkdir -p bridge
                    cp "$RUNNER_TEMP/probe/result.json" bridge/local-runtime-probe-result.json
                    git config user.name "cace-runtime-observer"
                    git config user.email "noreply@github.com"
                    git add bridge/local-runtime-probe-result.json
                    if git diff --cached --quiet; then
                      exit 0
                    fi
                    git commit -m "Record local CACE runtime observation"
                    git push origin HEAD:expert-robot/headless-local-llm
          YAML

          git config user.name "expert-robot-runtime-probe"
          git config user.email "noreply@github.com"
          git add bridge/local-runtime-probe-request.json .github/workflows/expert-robot-local-runtime-probe.yml
          git commit -m "Probe local CACE model/runtime inventory"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            git push origin HEAD:"$CACE_BRANCH"

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Await published observation
        shell: bash
        env:
          KEY_FILE: ${{ steps.key.outputs.key_file }}
          CACE_BRANCH: expert-robot/headless-local-llm
          REQUEST_ID: ${{ steps.install.outputs.request_id }}
        run: |
          set -euo pipefail
          poll="$RUNNER_TEMP/cace-runtime-poll"
          rm -rf "$poll"
          git init -q "$poll"
          git -C "$poll" remote add origin git@github.com:morganaspim/Cace-app.git

          found=false
          for attempt in $(seq 1 48); do
            GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
              git -C "$poll" fetch -q --force origin "$CACE_BRANCH:refs/remotes/origin/cace"
            if git -C "$poll" show refs/remotes/origin/cace:bridge/local-runtime-probe-result.json > "$RUNNER_TEMP/result.json" 2>/dev/null; then
              got="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/result.json"))["request_id"])')"
              if [ "$got" = "$REQUEST_ID" ]; then
                found=true
                break
              fi
            fi
            sleep 5
          done

          if [ "$found" != true ]; then
            echo "::error::Timed out waiting for CACE local runtime observation."
            exit 1
          fi

          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          summary={
              "request_id": p["request_id"],
              "architecture": p["architecture"],
              "llama_server": p["llama_server"],
              "gguf_candidates": p["gguf_candidates"],
          }
          print(json.dumps(summary, indent=2))
          PY

      - name: Remove key material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cace_repo_key" "$RUNNER_TEMP/cace_repo_key.pub"
