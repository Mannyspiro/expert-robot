name: CACE Runner Recovery Discovery

on:
  push:
    branches:
      - "feat/cace-headless-local-llm"
    paths:
      - ".github/workflows/cace-local-runtime-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-runner-recovery-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare read-only CACE deploy-key session
        shell: bash
        env:
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RAILWAY_SSH_PRIVATE_KEY:-}"
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > "$RUNNER_TEMP/cace_repo_key.pub"
          eval "$(ssh-agent -s)"
          ssh-add "$key_file"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Discover runner recovery surfaces
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-runner-recovery"
          out="$RUNNER_TEMP/cace-runner-recovery-evidence"
          rm -rf "$work" "$out"
          mkdir -p "$out/selected-source"

          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git clone --depth 1 git@github.com:morganaspim/Cace-app.git "$work"

          cd "$work"
          git rev-parse HEAD | tee "$out/cace-default-commit.txt"
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git ls-remote --heads origin \
            | sed 's#refs/heads/##' \
            | sort \
            > "$out/remote-branches.txt"

          {
            git ls-files \
              | grep -Ei '(^|/)(oci|oracle|runner|runners|infra|infrastructure|deploy|deployment|provision|scripts|systemd|cloud-init|ansible|terraform)(/|$)|(^|/).*(oci|oracle|runner|self-hosted|systemd|cloud-init|recover|restart|provision).*$' \
              || true
          } | sort -u > "$out/candidate-files.txt"

          git grep -InEi \
            'self-hosted|cace-oci|oracle|oci|actions[ -]runner|runsvc|run\.sh|svc\.sh|systemctl|systemd|cloud-init|restart.*runner|runner.*restart|provision.*runner|runner.*provision' \
            -- \
            ':!*.env*' \
            ':!*secret*' \
            ':!*credential*' \
            ':!*private*key*' \
            ':!*.pem' \
            ':!node_modules/**' \
            2>/dev/null \
            | head -n 1500 \
            > "$out/content-matches.txt" \
            || true

          python3 - "$work" "$out" <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()
          out = pathlib.Path(sys.argv[2]).resolve()
          selected = out / "selected-source"
          selected.mkdir(parents=True, exist_ok=True)

          candidate_path = out / "candidate-files.txt"
          candidates = candidate_path.read_text(encoding="utf-8").splitlines() if candidate_path.exists() else []

          allowed_suffixes = {
              ".md", ".txt", ".sh", ".py", ".json", ".yaml", ".yml",
              ".toml", ".service", ".conf", ".tf", ".tfvars.example"
          }
          copied = []
          for raw in candidates:
              rel = pathlib.PurePosixPath(raw)
              lowered = raw.lower()
              if any(token in lowered for token in ("secret", "credential", "private_key", "private-key")):
                  continue
              src = root / rel
              try:
                  if not src.is_file() or src.stat().st_size > 300_000:
                      continue
              except OSError:
                  continue
              suffix = src.suffix.lower()
              if suffix not in allowed_suffixes and src.name not in {
                  "Dockerfile", "Makefile", "Procfile"
              }:
                  continue
              dst = selected / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(raw)
              if len(copied) >= 120:
                  break

          payload = {
              "schema_version": 1,
              "repository": "morganaspim/Cace-app",
              "commit": (out / "cace-default-commit.txt").read_text().strip(),
              "candidate_file_count": len(candidates),
              "selected_file_count": len(copied),
              "selected_files": copied,
              "remote_mutated": False,
              "network_action": "git-read-only",
              "authority": "observation-only",
          }
          (out / "summary.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: cace-runner-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/cace-runner-recovery-evidence/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Remove deploy key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/cace_repo_key" "$RUNNER_TEMP/cace_repo_key.pub"
