name: CACE Contract Extract

on:
  pull_request:
    paths:
      - "scripts/extract_cace_contracts.py"
      - ".github/workflows/cace-contract-extract.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: contract-extract-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: avrea-ubuntu-latest-8-vcpu
    concurrency:
      group: expert-robot-avrea-half-month-slot
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Avrea half-month budget
        env:
          GH_TOKEN: ${{ github.token }}
          AVREA_RUNNER_LABEL: avrea-ubuntu-latest-8-vcpu
        run: python3 scripts/check_avrea_halfmonth_budget.py --reserve-minutes 10 --runner-label "$AVREA_RUNNER_LABEL"
      - name: Prepare deploy key
        shell: bash
        env:
          CACE_REPO_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/cace_repo_key"
          printf '%s\n' "$CACE_REPO_KEY" > "$key_file"
          chmod 600 "$key_file"
          eval "$(ssh-agent -s)"
          ssh-add "$key_file" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Clone CACE and extract contracts
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cace-app"
          out="$RUNNER_TEMP/cace-contracts.json"
          GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' \
            git clone --depth 1 git@github.com:morganaspim/Cace-app.git "$work"
          python3 scripts/extract_cace_contracts.py "$work" -o "$out"
          cat "$out"
      - name: Upload contracts
        uses: actions/upload-artifact@v4
        with:
          name: cace-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/cace-contracts.json
          retention-days: 14
      - name: Cleanup key
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/cace_repo_key"

