# Designated Plesk server (x86_64 or ARM64), localhost-only Forgejo. No Plesk nginx/Apache changes.
# Review upstream Forgejo LTS image digest and pin it before production.
services:
  forgejo:
    image: ${FORGEJO_IMAGE:?Forgejo image must be digest pinned during bootstrap}
    user: "10001:10001"
    restart: unless-stopped
    environment:
      FORGEJO__server__ROOT_URL: "http://127.0.0.1:3000/"
      FORGEJO__server__DOMAIN: "127.0.0.1"
      FORGEJO__server__SSH_DOMAIN: "127.0.0.1"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__database__DB_TYPE: "sqlite3"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: "private"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "127.0.0.0/8,::1/128"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:2222"
    volumes:
      - ./data:/var/lib/gitea
      - ./config:/etc/gitea
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1258291200
    stop_grace_period: 60s
