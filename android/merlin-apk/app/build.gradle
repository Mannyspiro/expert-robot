plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.merlin.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'org.merlin.studio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0-apk-alpha'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pyc {
            src = false
        }
    }
}
